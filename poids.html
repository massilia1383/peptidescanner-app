<link rel="stylesheet" href="/peptidescanner.css">

<style>
  /* Poids (maquettes « weight » et « empty-weight ») — jetons du kit uniquement */
  .wt2-last { margin: 8px 0 18px }
  .wt2-chart { margin-top: 18px }
  .wt2-chart .notice { margin: 4px 0 8px }
  .wt2-table td { vertical-align: middle }
  .wt2-table td.wt2-note { padding-top: 0 }
  .wt2-table .wt2-actions { white-space: nowrap; text-align: right; padding-right: 0 }
  .wt2-table .wt2-actions .icon-btn { display: inline-flex; color: var(--accent) }
  .wt2-table .wt2-actions .icon-btn.wt2-del { color: var(--error) }
  .wt2-form { margin-top: 16px }
</style>
</head>
<body data-tab="weight">
<a class="sr-only" href="#main" data-i18n="wt2_skip">Aller au contenu</a>
<div class="page">
  <header id="psHeader"></header>
  <main id="main" class="content" tabindex="-1">
    <div class="page-intro"><h1 data-i18n="wt2_title">Poids</h1><p class="muted small" id="wt2Sub" data-i18n="wt2_sub">Vos mesures, sans objectif imposé</p></div>
    <div id="view" class="stack"></div>
  </main>
  <nav id="psTabbar"></nav>
</div>

<script src="/vendor/supabase-2.117.3.umd.js"></script>
<script>
const SUPABASE_URL      = 'https://dkwztwlkjewdzfichkgk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrd3p0d2xramV3ZHpmaWNoa2drIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MjYwOTAsImV4cCI6MjA5NzQwMjA5MH0.iT7ylcNvPCf2jMUYfJlsDJcoGjPolphQWONFusAAlAk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const P = window.PS;   // outils communs (ps-app.js)
let userId = null;

// Mesures triées de la plus ancienne à la plus récente (logged_at = AAAA-MM-JJ, date locale)
let weights = [];
let period = 30;           // 7 | 30 | 90 | 0 (= tout)
let formOpen = false;      // état vide : formulaire montré après « Ajouter une mesure »
const PERIODS = [[7, 'wt2_p7'], [30, 'wt2_p30'], [90, 'wt2_p90'], [0, 'wt2_pall']];
try { const p = parseInt(localStorage.getItem('ps_wt2_period'), 10); if ([7, 30, 90, 0].indexOf(p) >= 0) period = p; } catch (e) {}

PS_initShell();
document.getElementById('view').innerHTML = P.skeleton();

// ── Petits outils locaux ────────────────────────────────────────
function fill(str, map) { return String(str).replace(/\{(\w+)\}/g, (m, k) => (k in map ? map[k] : m)); }
function dayOf(w) { return String(w.logged_at || '').slice(0, 10); }
function kgOf(w) { return Number(w.weight_kg); }
function fmtKg(n) { return isFinite(n) ? Number(n).toLocaleString(P.locale(), { minimumFractionDigits: 1, maximumFractionDigits: 2 }) : '—'; }
function shortDate(ds) {
  const d = psDay(ds), opts = { day: 'numeric', month: 'short' };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return P.fmtDate(d, opts);
}
function inputKg(n) { return String(n).replace('.', P.lang() === 'en' ? '.' : ','); }
// Règle du kit : nombre positif, au plus deux décimales
function parseKg(raw) {
  const s = String(raw || '').trim().replace(',', '.');
  if (!/^\d{1,3}(\.\d{1,2})?$/.test(s) || !(Number(s) > 0)) return null;
  return Number(s);
}
function filtered() {
  if (!period) return weights.slice();
  const from = psDayStr(P.addDays(psDay(new Date()), -(period - 1)));
  return weights.filter(w => dayOf(w) >= from);
}

// ── Données ─────────────────────────────────────────────────────
async function loadWeights() {
  const { data, error } = await sb.from('weight_logs').select('*').eq('user_id', userId)
    .order('logged_at', { ascending: false }).limit(1000);
  if (error) throw error;
  weights = (data || []).filter(w => dayOf(w) && isFinite(kgOf(w)))
    .sort((a, b) => dayOf(a) < dayOf(b) ? -1 : dayOf(a) > dayOf(b) ? 1 : String(a.created_at || '').localeCompare(String(b.created_at || '')));
}

async function init() {
  const session = await P.requireSession(sb);
  if (!session) return;
  userId = session.user.id;
  const { data: profil } = await sb.from('profiles').select('*').eq('id', userId).single();
  if (profil) PS_loadLangFromProfile(sb, userId, profil.lang);
  document.documentElement.lang = P.lang();
  await loadWeights();
  render();
}

// ── Courbe (fonction chart() du kit, alimentée par les vraies mesures) ──
// viewBox 310 × 200 : 3 lignes de grille (y 35 / 85 / 135), valeurs à gauche,
// dates en bas. Abscisse proportionnelle au temps : un jour sans mesure n'est
// jamais remplacé par zéro, la ligne relie simplement les mesures existantes.
let chartSerial = 0;
function chartHtml(list) {
  if (list.length === 0) return P.notice(P.tr('wt2_chart_none'));
  if (list.length === 1) return P.notice(P.tr('wt2_chart_one'));
  const vals = list.map(kgOf);
  const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  const steps = [0.1, 0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10, 20, 25, 50, 100];
  let step = steps[steps.length - 1], top = 0;
  for (const s of steps) {
    const tp = Math.ceil(mx / s - 1e-9) * s;
    if (tp - 2 * s <= mn + 1e-9) { step = s; top = tp; break; }
  }
  if (!top) top = Math.ceil(mx / step) * step;
  const digits = step >= 10 ? 0 : (Math.abs(step * 10 - Math.round(step * 10)) < 1e-9 ? 1 : 2);
  const lab = v => Number(v).toLocaleString(P.locale(), { minimumFractionDigits: digits, maximumFractionDigits: digits });
  const yOf = v => 35 + (top - v) / (2 * step) * 100;
  const d0 = dayOf(list[0]), d1 = dayOf(list[list.length - 1]);
  const span = P.dayIndex(d0, d1);
  const xOf = (w, i) => span > 0 ? 40 + P.dayIndex(d0, dayOf(w)) / span * 256 : 40 + i / (list.length - 1) * 256;
  const pts = list.map((w, i) => [Math.round(xOf(w, i) * 10) / 10, Math.round(yOf(kgOf(w)) * 10) / 10]);
  const r = list.length > 60 ? 2.5 : 4;
  const id = 'wt2Chart' + (++chartSerial);
  const title = fill(P.tr('wt2_chart_title'), {
    from: P.fmtDate(d0, { day: 'numeric', month: 'long', year: 'numeric' }), to: P.fmtDate(d1, { day: 'numeric', month: 'long', year: 'numeric' }),
    n: list.length, first: fmtKg(vals[0]), last: fmtKg(vals[vals.length - 1]), min: fmtKg(mn), max: fmtKg(mx)
  });
  let svg = '<svg class="chart" viewBox="0 0 310 200" role="img" aria-labelledby="' + id + '"><title id="' + id + '">' + P.esc(title) + '</title>';
  [0, 1, 2].forEach(i => {
    const y = 35 + i * 50;
    svg += '<path class="chart-grid" d="M36 ' + y + 'H300"/><text x="30" y="' + (y + 4) + '" text-anchor="end">' + lab(top - i * step) + '</text>';
  });
  svg += '<path class="chart-line" d="M' + pts.map(p => p[0] + ' ' + p[1]).join(' ') + '"/>';
  svg += pts.map(p => '<circle class="chart-dot" cx="' + p[0] + '" cy="' + p[1] + '" r="' + r + '"/>').join('');
  svg += '<text x="36" y="180">' + P.esc(shortDate(d0)) + '</text>';
  if (span >= 4) svg += '<text x="168" y="180" text-anchor="middle">' + P.esc(shortDate(psDayStr(P.addDays(psDay(d0), Math.round(span / 2))))) + '</text>';
  svg += '<text x="300" y="180" text-anchor="end">' + P.esc(shortDate(d1)) + '</text></svg>';
  return svg;
}

// ── Tableau (alternative accessible de la courbe, même période) ──
function tableHtml(list) {
  if (!list.length) return '';
  const rows = list.map(w => {
    const ds = dayOf(w), dl = shortDate(ds);
    return '<tr><td>' + P.esc(dl) + (w.notes ? '<div class="muted small">' + P.esc(w.notes) + '</div>' : '') + '</td>' +
      '<td class="num">' + fmtKg(kgOf(w)) + '</td>' +
      '<td class="wt2-actions">' +
        '<button class="icon-btn" type="button" data-act="edit" data-id="' + P.esc(w.id) + '" aria-label="' + P.esc(fill(P.tr('wt2_edit_aria'), { date: dl })) + '">' + P.icon('pencil-square') + '</button>' +
        '<button class="icon-btn wt2-del" type="button" data-act="delete" data-id="' + P.esc(w.id) + '" aria-label="' + P.esc(fill(P.tr('wt2_delete_aria'), { date: dl })) + '">' + P.icon('trash') + '</button>' +
      '</td></tr>';
  }).join('');
  return '<details id="wt2Details"><summary class="toggle-detail">' + P.esc(P.tr('wt2_table_toggle')) + '</summary>' +
    '<table class="table wt2-table"><caption class="sr-only">' + P.esc(P.tr('wt2_table_caption')) + '</caption><thead><tr>' +
    '<th scope="col">' + P.esc(P.tr('wt2_col_date')) + '</th><th scope="col" class="num">' + P.esc(P.tr('wt2_col_weight')) + '</th>' +
    '<th scope="col"><span class="sr-only">' + P.esc(P.tr('wt2_col_actions')) + '</span></th></tr></thead><tbody>' + rows + '</tbody></table></details>';
}

function formHtml(hidden) {
  return '<section class="card' + (hidden ? ' hidden' : '') + '" id="wt2AddCard"><h2 data-i18n="wt2_add_title">Ajouter une mesure</h2>' +
    '<form id="wt2Form" class="stack wt2-form" novalidate>' +
      P.field(P.tr('wt2_f_weight'), 'wt2Kg', 'kg', 'text', '', '', 'placeholder="—" required autocomplete="off"') +
      P.field(P.tr('wt2_f_date'), 'wt2Date', '', 'date', psDayStr(), '', 'required') +
      P.field(P.tr('wt2_f_note'), 'wt2Note', '', 'text', '', '', 'maxlength="200" autocomplete="off"') +
      '<button class="btn full" type="submit" id="wt2Save">' + P.esc(P.tr('wt2_save')) + '</button>' +
      '<div id="wt2Error" aria-live="polite"></div>' +
    '</form></section>';
}

// ── Rendu ───────────────────────────────────────────────────────
function render() {
  const view = document.getElementById('view');
  const sub = document.getElementById('wt2Sub');
  if (!weights.length) {
    // Maquette « empty-weight » : titre seul, carte vide, formulaire révélé au bouton
    sub.classList.add('hidden');
    view.innerHTML = '<section class="card">' + P.empty(P.tr('wt2_empty_title'), P.tr('wt2_empty_text'), 'scale', P.tr('wt2_add_title'), null, 'wt2-open') + '</section>' +
      formHtml(!formOpen);
  } else {
    sub.classList.remove('hidden');
    const last = weights[weights.length - 1];
    const list = filtered();
    const wasOpen = !!(document.getElementById('wt2Details') && document.getElementById('wt2Details').open);
    view.innerHTML =
      '<section class="card">' +
        '<div class="small muted">' + P.esc(fill(P.tr('wt2_last'), { date: P.fmtDate(dayOf(last), { day: 'numeric', month: 'short' }) })) + '</div>' +
        '<div class="number big-number wt2-last">' + fmtKg(kgOf(last)) + ' <span class="unit">kg</span></div>' +
        '<div class="segmented" role="group" aria-label="' + P.esc(P.tr('wt2_period_aria')) + '">' +
          PERIODS.map(p => '<button type="button" data-act="period" data-p="' + p[0] + '" aria-pressed="' + (period === p[0]) + '">' + P.esc(P.tr(p[1])) + '</button>').join('') +
        '</div>' +
        '<div id="wt2ChartBox" class="wt2-chart">' + chartHtml(list) + '</div>' +
        tableHtml(list) +
      '</section>' +
      formHtml(false) +
      '<a class="btn secondary full" href="analytics.html" data-i18n="wt2_stats_btn">Voir les statistiques de cure</a>';
    if (wasOpen && document.getElementById('wt2Details')) document.getElementById('wt2Details').open = true;
  }
  bindForm();
  PS_applyI18n();
}

function bindForm() {
  const f = document.getElementById('wt2Form');
  if (f) f.addEventListener('submit', e => { e.preventDefault(); addWeight(); });
}

// Erreur de saisie : notice du kit + aria-invalid sur le champ concerné
function showError(boxId, inputId, msg) {
  const box = document.getElementById(boxId);
  if (box) box.innerHTML = P.notice(msg, 'error');
  const inp = document.getElementById(inputId);
  if (inp) { inp.setAttribute('aria-invalid', 'true'); inp.setAttribute('aria-errormessage', boxId); inp.focus(); }
}
function clearErrors(scope, boxId) {
  scope.querySelectorAll('[aria-invalid]').forEach(i => { i.removeAttribute('aria-invalid'); i.removeAttribute('aria-errormessage'); });
  const box = document.getElementById(boxId); if (box) box.innerHTML = '';
}

// ── Écritures weight_logs ──────────────────────────────────────
async function addWeight() {
  const form = document.getElementById('wt2Form');
  clearErrors(form, 'wt2Error');
  const kg = parseKg(document.getElementById('wt2Kg').value);
  const date = document.getElementById('wt2Date').value;
  const note = document.getElementById('wt2Note').value.trim();
  if (kg === null) { showError('wt2Error', 'wt2Kg', P.tr('wt2_err_weight')); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { showError('wt2Error', 'wt2Date', P.tr('wt2_err_date')); return; }
  const btn = document.getElementById('wt2Save'); btn.disabled = true;
  const { error } = await sb.from('weight_logs').insert({ user_id: userId, weight_kg: kg, logged_at: date, notes: note || null });
  btn.disabled = false;
  if (error) { document.getElementById('wt2Error').innerHTML = P.notice(P.tr('msg_save_error'), 'error'); return; }
  formOpen = false;
  P.toast(P.tr('wt2_saved'));
  await reload();
}

function openEdit(id) {
  const w = weights.find(x => String(x.id) === String(id)); if (!w) return;
  P.openSheet(P.tr('wt2_edit_title'),
    '<form id="wt2EditForm" class="stack" novalidate>' +
      P.field(P.tr('wt2_f_weight'), 'wt2EKg', 'kg', 'text', inputKg(kgOf(w)), '', 'required autocomplete="off"') +
      P.field(P.tr('wt2_f_date'), 'wt2EDate', '', 'date', dayOf(w), '', 'required') +
      P.field(P.tr('wt2_f_note'), 'wt2ENote', '', 'text', w.notes || '', '', 'maxlength="200" autocomplete="off"') +
      '<button class="btn full" type="submit" id="wt2ESave">' + P.esc(P.tr('wt2_save')) + '</button>' +
      '<div id="wt2EError" aria-live="polite"></div>' +
    '</form>',
    d => {
      d.querySelector('#wt2EditForm').addEventListener('submit', async e => {
        e.preventDefault();
        clearErrors(d, 'wt2EError');
        const kg = parseKg(d.querySelector('#wt2EKg').value);
        const date = d.querySelector('#wt2EDate').value;
        const note = d.querySelector('#wt2ENote').value.trim();
        if (kg === null) { showError('wt2EError', 'wt2EKg', P.tr('wt2_err_weight')); return; }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { showError('wt2EError', 'wt2EDate', P.tr('wt2_err_date')); return; }
        const b = d.querySelector('#wt2ESave'); b.disabled = true;
        const { error } = await sb.from('weight_logs').update({ weight_kg: kg, logged_at: date, notes: note || null }).eq('id', w.id);
        b.disabled = false;
        if (error) { d.querySelector('#wt2EError').innerHTML = P.notice(P.tr('msg_save_error'), 'error'); return; }
        P.closeSheet();
        P.toast(P.tr('wt2_updated'));
        await reload();
      });
    });
}

async function removeWeight(id) {
  const w = weights.find(x => String(x.id) === String(id)); if (!w) return;
  const ok = await P.confirm({
    title: P.tr('wt2_del_title'),
    text: fill(P.tr('wt2_del_text'), { date: shortDate(dayOf(w)), kg: fmtKg(kgOf(w)) }),
    ok: P.tr('wt2_del_ok'), cancel: P.tr('wt2_del_cancel'), danger: true
  });
  if (!ok) return;
  const { error } = await sb.from('weight_logs').delete().eq('id', w.id);
  if (error) { P.toast(P.tr('msg_save_error')); return; }
  const copy = { user_id: userId, weight_kg: kgOf(w), logged_at: dayOf(w), notes: w.notes || null };
  P.toast(P.tr('wt2_deleted'), async () => { await sb.from('weight_logs').insert(copy); await reload(); });
  await reload();
}

async function reload() {
  try { await loadWeights(); render(); }
  catch (e) { console.error(e); document.getElementById('view').innerHTML = P.errorState(init); }
}

// ── Actions (délégation) ───────────────────────────────────────
document.getElementById('view').addEventListener('click', e => {
  const open = e.target.closest('[data-ps-action="wt2-open"]');
  if (open) {
    formOpen = true;
    const card = document.getElementById('wt2AddCard');
    if (card) {
      card.classList.remove('hidden');
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      const k = document.getElementById('wt2Kg'); if (k) k.focus({ preventScroll: true });
    }
    return;
  }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'period') {
    period = parseInt(el.dataset.p, 10) || 0;
    try { localStorage.setItem('ps_wt2_period', String(period)); } catch (er) {}
    render();
    const again = document.querySelector('[data-act="period"][data-p="' + period + '"]'); if (again) again.focus();
  } else if (act === 'edit') openEdit(el.dataset.id);
  else if (act === 'delete') removeWeight(el.dataset.id);
});

init().catch(e => { console.error(e); document.getElementById('view').innerHTML = P.errorState(init); });
</script>
</body>
</html>
