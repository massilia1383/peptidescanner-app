<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nouveau mot de passe — PeptideScanner</title>
  <script src="/lang.js"></script>
  <script>try { var _t = localStorage.getItem('ps_theme'); if (_t) document.documentElement.dataset.theme = _t; } catch (e) {}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FBF7F1">
  <link rel="stylesheet" href="/peptidescanner.css">
  <!--
    Créée le 14/10/2026 : le lien « Mot de passe oublié » de login.html renvoie ici
    (redirectTo = origine + /reset-password.html). La page n'existait pas.
    Supabase lit le jeton de récupération dans l'adresse, ouvre une session temporaire,
    puis on enregistre le nouveau mot de passe avec auth.updateUser().
    Côté Supabase, l'adresse doit figurer dans Authentication > URL Configuration > Redirect URLs.
  -->
  <style>
    body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px calc(32px + env(safe-area-inset-bottom));}
    .auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
    .auth-logo img{width:40px;height:40px;}
    .auth-logo-name{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.3px;}
    .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 28px;width:100%;max-width:420px;}
    .auth-title{font-size:22px;font-weight:700;letter-spacing:-.4px;margin-bottom:6px;color:var(--text);}
    .auth-subtitle{font-size:14px;color:var(--muted);margin-bottom:24px;line-height:1.5;}
    .auth-field{margin-bottom:16px;display:grid;gap:7px;}
    .auth-field label{font-size:13px;font-weight:700;color:var(--text-soft);}
    .auth-field input{width:100%;min-height:48px;padding:11px 13px;font-family:inherit;font-size:16px;color:var(--text);background:var(--surface-elevated);border:1px solid var(--border);border-radius:10px;outline:none;}
    .auth-field input:focus{border-color:var(--focus);box-shadow:0 0 0 3px var(--focus-ring);}
    .auth-submit{width:100%;min-height:48px;padding:12px;font-family:inherit;font-size:15px;font-weight:700;color:var(--accent-on);background:var(--accent);border:none;border-radius:10px;cursor:pointer;margin-top:6px;}
    .auth-submit:hover{background:var(--accent-hover);}
    .auth-submit:disabled{opacity:.6;cursor:not-allowed;}
    .msg{display:none;padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:16px;line-height:1.45;}
    .msg.error{display:block;background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);}
    .msg.success{display:block;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-border);}
    .auth-link{display:block;text-align:center;margin-top:18px;font-size:14px;color:var(--info);text-decoration:none;font-weight:600;}
  </style>
</head>
<body>
  <div class="auth-logo">
    <img src="/brand/brand-mark.svg" alt="" width="40" height="40">
    <span class="auth-logo-name">PeptideScanner</span>
  </div>

  <div class="auth-card">
    <div class="auth-title" data-i18n="reset_title">Nouveau mot de passe</div>
    <div class="auth-subtitle" data-i18n="reset_subtitle">Choisissez un nouveau mot de passe pour votre compte.</div>
    <div class="msg" id="msgBox"></div>
    <form id="resetForm" onsubmit="return false">
      <div class="auth-field">
        <label for="pw1" data-i18n="reset_new_pw">Nouveau mot de passe</label>
        <input type="password" id="pw1" autocomplete="new-password" minlength="6">
      </div>
      <div class="auth-field">
        <label for="pw2" data-i18n="login_confirm_pw">Confirme le mot de passe</label>
        <input type="password" id="pw2" autocomplete="new-password" minlength="6">
      </div>
      <button class="auth-submit" id="submitBtn" type="submit" data-i18n="reset_submit">Enregistrer</button>
    </form>
    <a class="auth-link" href="/login.html" data-i18n="reset_back_login">Retour à la connexion</a>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://dkwztwlkjewdzfichkgk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrd3p0d2xramV3ZHpmaWNoa2drIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MjYwOTAsImV4cCI6MjA5NzQwMjA5MH0.iT7ylcNvPCf2jMUYfJlsDJcoGjPolphQWONFusAAlAk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showMsg(text, type) {
  const box = document.getElementById('msgBox');
  box.textContent = text; box.className = 'msg ' + type;
}

// Session de récupération : ouverte automatiquement par Supabase à partir du lien reçu par email.
let recoveryReady = false;
sb.auth.onAuthStateChange(function (event, session) {
  if (event === 'PASSWORD_RECOVERY' || (session && event === 'SIGNED_IN')) recoveryReady = true;
});
sb.auth.getSession().then(function (res) {
  if (res && res.data && res.data.session) recoveryReady = true;
  setTimeout(function () {
    if (!recoveryReady) showMsg(t('reset_link_invalid'), 'error');
  }, 1500);
});

document.getElementById('resetForm').addEventListener('submit', async function () {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  if (pw1.length < 6) { showMsg(t('login_pw_short'), 'error'); return; }
  if (pw1 !== pw2) { showMsg(t('login_pw_mismatch'), 'error'); return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  const { error } = await sb.auth.updateUser({ password: pw1 });
  btn.disabled = false;
  if (error) { showMsg(t('reset_error'), 'error'); return; }
  showMsg(t('reset_done'), 'success');
  setTimeout(function () { window.location.href = '/dashboard.html'; }, 1800);
});

PS_applyI18n();
</script>
</body>
</html>
