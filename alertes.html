<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PeptideScanner — Rappels</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F4F7FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1424" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-title" content="PeptideScanner">
<script>try{var _pst=localStorage.getItem('ps_theme');if(_pst==='light'||_pst==='dark')document.documentElement.dataset.theme=_pst}catch(e){}</script>
<link rel="stylesheet" href="/peptidescanner.css">
<script src="/lang.js"></script>
<script src="/assets/assets-bundle.js"></script>
<script src="/ps-app.js"></script>
<style>
  /* Rappels (kit « reminders ») — jetons du kit uniquement */
  #view { display: grid; gap: 18px; }
  .switchline > span { min-width: 0; }
  .switchline .sub { display: block; }
  /* Interrupteur : même dessin que le kit (48 × 28), zone tactile portée à 44 px de haut */
  .switchline input[role=switch] { height: 44px; border: 0; border-radius: 0; background: transparent; cursor: pointer; }
  .switchline input[role=switch]::before {
    content: ''; position: absolute; left: 0; top: 8px; width: 48px; height: 28px; box-sizing: border-box;
    border-radius: 30px; background: var(--border-control); border: 2px solid var(--border-control);
  }
  .switchline input[role=switch]::after { top: 12px; left: 4px; }
  .switchline input[role=switch]:checked { background: transparent; }
  .switchline input[role=switch]:checked::before { background: var(--accent); border-color: var(--accent); }
  .switchline input[role=switch]:disabled::before { background: var(--disabled-bg); border-color: var(--disabled-bg); }
  .switchline input[role=switch]:disabled { cursor: not-allowed; }
  #notification-feedback:empty, #saveNote:empty { display: none; }
  .slot-time { min-width: 3.4em; }
  .rem-row .grow { min-width: 0; }
  .rem-row strong { overflow-wrap: anywhere; }
</style>
</head>
<body data-tab="home" data-back="dashboard.html">
<a class="sr-only" href="#main" data-i18n="rem2_skip">Aller au contenu</a>
<div class="page">
  <header id="psHeader"></header>
  <main id="main" class="content" tabindex="-1">
    <div class="page-intro"><h1 data-i18n="rem2_title">Rappels</h1><p class="muted small" data-i18n="rem2_sub">Aux horaires que vous choisissez</p></div>
    <div id="view"></div>
  </main>
  <nav id="psTabbar"></nav>
</div>

<script src="/vendor/supabase-2.117.3.umd.js"></script>
<script>
const SUPABASE_URL      = 'https://dkwztwlkjewdzfichkgk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrd3p0d2xramV3ZHpmaWNoa2drIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MjYwOTAsImV4cCI6MjA5NzQwMjA5MH0.iT7ylcNvPCf2jMUYfJlsDJcoGjPolphQWONFusAAlAk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const P = window.PS;   // outils communs (ps-app.js)
const tx = (k) => P.tr(k);
let userId = null, allCures = [], allInjections = [];
let permState = 'prompt';   // granted | denied | prompt (non demandé) | unavailable
let browserTimers = [];     // rappels du navigateur (hors appli installée)

PS_initShell();
document.getElementById('view').innerHTML = P.skeleton();

// ── Stockage local (mêmes clés que l'ancienne page et que ps-app.js) ──────
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function remKey() { return 'ps_reminders_' + (userId || 'anon'); }
function getReminders() { try { return JSON.parse(lsGet(remKey()) || '{}') || {}; } catch (e) { return {}; } }
function saveReminders(r) { lsSet(remKey(), JSON.stringify(r)); }
function getCustom() { try { const a = JSON.parse(lsGet('ps_custom_alerts') || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function saveCustom(a) { lsSet('ps_custom_alerts', JSON.stringify(a)); }
function isNative() { return !!(window.PS_isNativeApp && PS_isNativeApp()); }

// Cures concernées : actives et en cours aujourd'hui
function activeCures() {
  return allCures.filter(c => c.status === 'active' && c.start_date && P.cure(c).state === 'active');
}
function slotLabel(i) {
  if (i < 3) return tx('rem2_slot_' + (i + 1));
  return tx('rem2_slot_n') + ' ' + (i + 1);
}
function timesFor(cure, saved) {
  const m = P.cure(cure);
  return m.times.map((def, i) => (saved && Array.isArray(saved.times) && /^\d{2}:\d{2}$/.test(saved.times[i] || '')) ? saved.times[i] : def);
}

// ── Autorisation des notifications ──────────────────────────────────
function normPerm(p) {
  if (p === 'granted' || p === 'denied' || p === 'unavailable') return p;
  return 'prompt';   // default, prompt, prompt-with-rationale
}
async function readPermission() {
  try { permState = normPerm(await PS_permissionState()); } catch (e) { permState = 'unavailable'; }
  return permState;
}
function remindersOn() {
  const choice = lsGet('ps_notif_choice');
  if (permState !== 'granted') return false;
  // Appli installée : choix explicite « on » ; navigateur : ancien comportement (autorisé et pas « off »)
  return isNative() ? choice === 'on' : choice !== 'off';
}
function feedbackHtml() {
  if (permState === 'unavailable') return P.notice(tx('rem2_unavailable'));
  if (permState === 'denied') return P.notice(tx('rem2_denied'), 'warning');
  if (remindersOn()) return P.notice(tx('rem2_on'), 'success');
  return '';
}
function paintFeedback() {
  const box = document.getElementById('notification-feedback');
  if (box) box.innerHTML = feedbackHtml();
  const help = document.getElementById('askHelp');   // pas de « sera demandée » si le téléphone a refusé ou ne sait pas
  if (help) help.hidden = (permState === 'denied' || permState === 'unavailable');
  const sw = document.getElementById('notification-toggle');
  if (sw) { sw.checked = remindersOn(); sw.disabled = permState === 'unavailable'; sw.setAttribute('aria-checked', sw.checked ? 'true' : 'false'); }
}

// ── Programmation ───────────────────────────────────────────────────
function clearBrowserTimers() { browserTimers.forEach(id => clearTimeout(id)); browserTimers = []; }
async function scheduleAll() {
  const plan = PS_buildInjectionPlan(allCures, allInjections, getReminders(), 7);
  if (isNative()) {
    if (lsGet('ps_notif_choice') !== 'on') return true;
    return PS_scheduleReminders(plan, false);
  }
  // Navigateur : rappels du jour tant que la page reste ouverte (ancien fonctionnement)
  clearBrowserTimers();
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted' || lsGet('ps_notif_choice') === 'off') return false;
  const now = Date.now();
  plan.forEach(it => {
    const ms = it.at - now;
    if (ms > 0 && ms < 86400000) browserTimers.push(setTimeout(() => {
      try { new Notification(it.title, { body: it.body, icon: '/icons/icon-192.png' }); } catch (e) {}
    }, ms));
  });
  return true;
}

async function turnOn() {
  if (permState === 'unavailable') { paintFeedback(); return; }
  if (permState === 'denied') { paintFeedback(); return; }   // le téléphone ne redemande pas : on renvoie aux réglages
  if (isNative()) {
    const ok = await PS_scheduleReminders(PS_buildInjectionPlan(allCures, allInjections, getReminders(), 7), true);
    await readPermission();
    if (ok) { lsSet('ps_notif_choice', 'on'); P.toast(tx('rem2_on')); }
    else lsDel('ps_notif_choice');
    paintFeedback();
    return;
  }
  if (typeof Notification === 'undefined') { permState = 'unavailable'; paintFeedback(); return; }
  let p = 'default';
  try { p = await Notification.requestPermission(); } catch (e) {}
  permState = normPerm(p);
  if (p === 'granted') { lsSet('ps_notif_choice', 'on'); await scheduleAll(); P.toast(tx('rem2_on')); }
  else lsDel('ps_notif_choice');
  paintFeedback();
}
async function turnOff() {
  lsSet('ps_notif_choice', 'off');
  clearBrowserTimers();
  if (window.PS_cancelReminders) await PS_cancelReminders();
  paintFeedback();
  P.toast(tx('rem2_off'));
}

// ── Rendu ───────────────────────────────────────────────────────────
function switchHtml(id, title, sub, checked, aria, extra) {
  return '<label class="switchline"><span><strong>' + P.esc(title) + '</strong>' +
    (sub ? '<span class="small muted sub">' + P.esc(sub) + '</span>' : '') + '</span>' +
    '<input id="' + id + '" type="checkbox" role="switch"' + (checked ? ' checked' : '') +
    ' aria-checked="' + (checked ? 'true' : 'false') + '" aria-label="' + P.esc(aria || title) + '" ' + (extra || '') + '></label>';
}

function cureCardsHtml() {
  const list = activeCures();
  if (!list.length) {
    return '<section class="card">' + P.empty(tx('rem2_no_cure_title'), tx('rem2_no_cure_text'), 'bell', tx('rem2_no_cure_cta'), 'cure.html') + '</section>';
  }
  const rem = getReminders();
  return list.map(c => {
    const m = P.cure(c), saved = rem[c.id];
    const enabled = saved ? saved.enabled !== false : true;   // pas encore réglé → activé
    const times = timesFor(c, saved);
    return '<section class="card" data-cure="' + P.esc(c.id) + '"><div class="stack">' +
      switchHtml('cureSw-' + P.esc(c.id), m.name, m.freqLabel(), enabled, m.name + ' — ' + tx('rem2_cure_switch'), 'data-cure-switch="' + P.esc(c.id) + '"') +
      times.map((hm, i) => P.field(slotLabel(i), 'rt-' + c.id + '-' + i, '', 'time', hm, '', 'data-cure-time="' + P.esc(c.id) + '" data-slot="' + i + '" required')).join('') +
      '</div></section>';
  }).join('');
}

function todayHtml() {
  const ds = psDayStr();
  const rows = [], rem = getReminders();
  activeCures().forEach(c => {
    const m = P.cure(c), saved = rem[c.id];
    const on = remindersOn() && !(saved && saved.enabled === false), rtimes = timesFor(c, saved);
    const states = P.slotStates(m, allInjections, ds) || [];
    states.forEach(s => {
      let sub = m.doseLabel || '';
      // Créneau encore prévu : on indique l'heure du rappel (ou qu'il n'y en a pas)
      if (s.status === 'planned' && !s.incoming && !s.extra && !s.off) {
        sub += (sub ? ' · ' : '') + (on && rtimes[s.slot] ? tx('rem2_reminder_at') + ' ' + rtimes[s.slot] : tx('rem2_reminder_off'));
      }
      rows.push({ time: s.time || '', name: m.name, sub: sub, status: s.status });
    });
  });
  rows.sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
  const zone = lsGet('ps_notif_zone') === 'fixed' ? tx('rem2_zone_fixed') : tx('rem2_zone_local');
  let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
  const date = P.fmtDate(new Date(), { weekday: 'long', day: 'numeric', month: 'long' });
  return '<section class="card"><div class="stack tight"><h2>' + P.esc(tx('rem2_today')) + '</h2>' +
    '<p class="muted small">' + P.esc(date) + ' · ' + P.esc(tx('rem2_zone_summary')) + ' ' + P.esc(zone) + (tz ? ' (' + P.esc(tz) + ')' : '') + '</p></div>' +
    (rows.length
      ? '<div class="list">' + rows.map(r =>
          '<div class="list-row"><span class="number slot-time">' + P.esc(r.time || '—') + '</span><div class="grow"><strong>' + P.esc(r.name) + '</strong>' +
          (r.sub ? '<div class="muted small">' + P.esc(r.sub) + '</div>' : '') + '</div>' + P.status(r.status) + '</div>').join('') + '</div>'
      : '<p class="muted small mt-2">' + P.esc(tx('rem2_today_none')) + '</p>') +
    '</section>';
}

function customHtml() {
  const items = getCustom().slice().sort((a, b) => (String(a.date) + 'T' + String(a.time)).localeCompare(String(b.date) + 'T' + String(b.time)));
  const today = psDayStr();
  const list = items.length
    ? '<div class="list">' + items.map(a => {
        const okDate = /^\d{4}-\d{2}-\d{2}$/.test(String(a.date || ''));
        const when = (okDate ? (a.date === today ? tx('rem2_today') : P.fmtDate(a.date, { weekday: 'short', day: 'numeric', month: 'short' })) : '') +
          (a.time ? ' · ' + a.time : '');
        return '<div class="list-row rem-row">' + P.icon('bell') + '<div class="grow"><strong>' + P.esc(a.msg || '') + '</strong>' +
          '<div class="muted small">' + P.esc(when) + '</div></div>' +
          '<button class="icon-btn" type="button" data-del="' + P.esc(String(a.id)) + '" aria-label="' + P.esc(tx('rem2_del') + ' — ' + (a.msg || '')) + '">' + P.icon('trash') + '</button></div>';
      }).join('') + '</div>'
    : '<p class="muted small">' + P.esc(tx('rem2_custom_none')) + '</p>';
  return '<section class="card"><div class="stack"><div class="stack tight"><h2>' + P.esc(tx('rem2_custom')) + '</h2>' +
    '<p class="help">' + P.esc(tx('rem2_custom_help')) + '</p></div>' + list +
    '<hr class="divider">' +
    P.field(tx('rem2_msg'), 'alertMsg', '', 'text', '', '', 'maxlength="120" autocomplete="off" placeholder="' + P.esc(tx('rem2_msg_ph')) + '"') +
    '<div class="stack">' + P.field(tx('rem2_date'), 'alertDate', '', 'date', today) +
    P.field(tx('rem2_time'), 'alertTime', '', 'time', P.pad(new Date().getHours()) + ':00') + '</div>' +
    '<div id="customErr"></div>' +
    '<button class="btn secondary full" type="button" id="addAlert">' + P.icon('plus') + '<span>' + P.esc(tx('rem2_add')) + '</span></button>' +
    '</div></section>';
}

function render() {
  document.documentElement.lang = P.lang();
  const zone = lsGet('ps_notif_zone') === 'fixed' ? 'fixed' : 'local';
  const discreet = lsGet('ps_notif_discreet') !== '0';
  document.getElementById('view').innerHTML =
    // 1. Interrupteur général + retour d'état
    '<section class="card">' +
      switchHtml('notification-toggle', tx('rem2_inj'), tx('rem2_inj_sub'), remindersOn(), tx('rem2_inj'), permState === 'unavailable' ? 'disabled' : '') +
      '<p class="help" id="askHelp">' + P.esc(tx('rem2_ask_help')) + '</p>' +
      '<div id="notification-feedback" class="mt-2" aria-live="polite"></div>' +
    '</section>' +
    // 2. Une carte par cure en cours : interrupteur + un champ heure par créneau
    cureCardsHtml() +
    // 3. Fuseau
    '<section class="card"><div class="stack">' +
      P.select(tx('rem2_zone'), 'reminder-zone', [['local', tx('rem2_zone_local')], ['fixed', tx('rem2_zone_fixed')]], zone) +
      P.notice(tx('rem2_zone_notice')) +
    '</div></section>' +
    // 4. Contenu discret
    '<section class="card">' + switchHtml('discreet-toggle', tx('rem2_discreet'), tx('rem2_discreet_sub'), discreet, tx('rem2_discreet')) + '</section>' +
    // 5. Enregistrer
    '<div class="stack tight"><button class="btn full" type="button" id="save-reminders">' + P.esc(tx('rem2_save')) + '</button>' +
    '<div id="saveNote" aria-live="polite"></div></div>' +
    // 6. Aujourd'hui
    '<div id="todayBox">' + todayHtml() + '</div>' +
    // 7. Rappels personnels (téléphone)
    '<div id="customBox">' + customHtml() + '</div>';
  paintFeedback();
  bind();
  PS_applyI18n();
}

function markDirty() {
  const n = document.getElementById('saveNote');
  if (n) n.innerHTML = '<p class="help center">' + P.esc(tx('rem2_dirty')) + '</p>';
}

function bind() {
  const sw = document.getElementById('notification-toggle');
  sw.addEventListener('change', () => {
    sw.setAttribute('aria-checked', sw.checked ? 'true' : 'false');
    if (sw.checked) turnOn(); else turnOff();
  });
  document.querySelectorAll('[data-cure-switch], [data-cure-time], #reminder-zone, #discreet-toggle').forEach(el => {
    el.addEventListener('change', () => {
      if (el.getAttribute('role') === 'switch') el.setAttribute('aria-checked', el.checked ? 'true' : 'false');
      if (el.matches('[data-cure-time]')) el.removeAttribute('aria-invalid');
      markDirty();
    });
  });
  document.getElementById('save-reminders').addEventListener('click', saveAll);
  bindCustom();
}

async function saveAll() {
  const note = document.getElementById('saveNote');
  const rem = getReminders();
  let bad = null;
  activeCures().forEach(c => {
    const sw = document.querySelector('[data-cure-switch="' + CSS.escape(c.id) + '"]');
    const inputs = [...document.querySelectorAll('[data-cure-time="' + CSS.escape(c.id) + '"]')];
    const times = inputs.map(inp => {
      const v = String(inp.value || '').slice(0, 5);
      if (!/^\d{2}:\d{2}$/.test(v)) { inp.setAttribute('aria-invalid', 'true'); if (!bad) bad = inp; }
      return v;
    });
    rem[c.id] = { ...(rem[c.id] || {}), enabled: !!(sw && sw.checked), times: times };
  });
  if (bad) {
    note.innerHTML = P.notice(tx('rem2_time_invalid'), 'error');
    bad.focus();
    return;
  }
  saveReminders(rem);
  lsSet('ps_notif_zone', document.getElementById('reminder-zone').value === 'fixed' ? 'fixed' : 'local');
  lsSet('ps_notif_discreet', document.getElementById('discreet-toggle').checked ? '1' : '0');
  note.innerHTML = '';
  await scheduleAll();
  document.getElementById('todayBox').innerHTML = todayHtml();
  P.toast(tx('rem2_saved'));
}

// ── Rappels personnels (mémoire du téléphone, clé ps_custom_alerts) ─────
function bindCustom() {
  const add = document.getElementById('addAlert');
  if (add) add.onclick = () => {
    const msgEl = document.getElementById('alertMsg'), dEl = document.getElementById('alertDate'), hEl = document.getElementById('alertTime');
    const msg = msgEl.value.trim(), date = dEl.value, time = String(hEl.value || '').slice(0, 5);
    [msgEl, dEl, hEl].forEach(el => el.removeAttribute('aria-invalid'));
    if (!msg || !date || !time) {
      [[msgEl, msg], [dEl, date], [hEl, time]].forEach(([el, v]) => { if (!v) el.setAttribute('aria-invalid', 'true'); });
      document.getElementById('customErr').innerHTML = P.notice(tx('rem2_fill'), 'error');
      return;
    }
    const list = getCustom();
    list.push({ id: Date.now(), msg: msg, date: date, time: time });
    saveCustom(list);
    document.getElementById('customBox').innerHTML = customHtml();
    bindCustom();
    P.toast(tx('rem2_added'));
  };
  document.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = async () => {
      const ok = await P.confirm({ title: tx('rem2_del_title'), text: tx('rem2_del_text'), ok: tx('rem2_del'), cancel: tx('rem2_cancel'), danger: true });
      if (!ok) return;
      saveCustom(getCustom().filter(a => String(a.id) !== b.dataset.del));
      document.getElementById('customBox').innerHTML = customHtml();
      bindCustom();
      P.toast(tx('rem2_deleted'));
    };
  });
}

async function init() {
  const session = await P.requireSession(sb);
  if (!session) return;
  userId = session.user.id;
  const { data: profil } = await sb.from('profiles').select('lang').eq('id', userId).single();
  if (profil) PS_loadLangFromProfile(sb, userId, profil.lang);
  const [cRes, iRes] = await Promise.all([
    sb.from('cures').select('*').eq('user_id', userId),
    sb.from('injections').select('*').eq('user_id', userId).order('injected_at', { ascending: false }).limit(500)
  ]);
  if (cRes.error || iRes.error) throw (cRes.error || iRes.error);
  allCures = cRes.data || [];
  allInjections = iRes.data || [];
  await readPermission();
  render();
  // Rappels déjà activés : reprogrammés à l'ouverture (téléphone ou navigateur)
  if (remindersOn()) scheduleAll();
}
init().catch(e => { console.error(e); document.getElementById('view').innerHTML = P.errorState(init); });
</script>
</body>
</html>
