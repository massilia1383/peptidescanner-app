<style>
  /* Styles propres à l'onglet Cure — jetons du kit uniquement */
  #view{display:grid;gap:18px}
  .cal-row{display:contents}
  .cal-pad{min-height:56px}
  .calendar-card .cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .calendar-card .cal-head h2{text-align:center;flex:1}
  .calendar-card .cal-head .icon-btn{color:var(--accent)}
  .calendar-card .help{padding:0 6px}
  .calendar-agenda{padding:0 6px}
  .calendar-agenda button{display:grid;gap:6px;width:100%;color:var(--text)}
  .calendar-agenda .marks{display:flex;flex-wrap:wrap;gap:6px 12px}
  .legend .status{font-size:.75rem}
  .day .more{font-size:.75rem;line-height:1}
  .day-card .day-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
  .day-card .list-row .status{flex:none}
  .day-card .list-row strong{display:block}
  .day-card .note-block{margin-top:14px}
  .day-card .note-block .btn{margin-top:8px}
  .day-card .day-msg{margin:10px 0 4px}
  .slot-meta{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .site-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-md)}
  .site-line strong{display:block}
  .dow-set{border:1px solid var(--border);border-radius:var(--radius-md);padding:4px 14px 6px;margin:0;min-width:0}
  .dow-set legend{font-size:var(--text-sm);font-weight:600;padding:0 4px}
  .time-row{display:flex;gap:8px;align-items:flex-end}
  .time-row .field{flex:1;min-width:0}
  .time-row .icon-btn{color:var(--text-secondary);margin-bottom:2px}
  .date-list .list-row{padding:4px 0;min-height:48px}
  .date-add{display:flex;gap:8px;align-items:flex-end}
  .date-add .field{flex:1;min-width:0}
  .date-add .btn{flex:none}
  details.stats summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:650}
  details.stats summary::-webkit-details-marker{display:none}
  details.stats summary .icon{transition:transform var(--duration-base) var(--ease)}
  details.stats[open] summary .icon{transform:rotate(90deg)}
  details.stats .footnote{margin-top:10px}
  #main:focus{outline:none}
  .grid2 .field,.grid2 .input-wrap{min-width:0}
  .grid2 input[type=date].input{padding-right:10px;max-width:100%}
  /* Cases à cocher : zone tactile 44 px, case dessinée 22 px (jetons du kit) */
  .dow-set input[type=checkbox]{appearance:none;-webkit-appearance:none;width:44px;height:44px;flex:0 0 44px;margin:-11px;border:11px solid transparent;border-radius:17px;background:var(--surface);background-clip:padding-box;box-shadow:inset 0 0 0 2px var(--border-control)}
  .dow-set input[type=checkbox]:checked{background-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 5px var(--surface)}
  .dow-set input[type=checkbox]:focus-visible{outline:3px solid var(--focus);outline-offset:-8px}
  .dow-set .checkline{align-items:center}
</style>

<script>

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrd3p0d2xramV3ZHpmaWNoa2drIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MjYwOTAsImV4cCI6MjA5NzQwMjA5MH0.iT7ylcNvPCf2jMUYfJlsDJcoGjPolphQWONFusAAlAk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const P = window.PS;   // outils communs (ps-app.js)
const esc = P.esc;
let userId = null;

/* ══════════════ État de la page ══════════════ */
let allCures = [], allInjs = [], inventory = [];
let currentCureId = null;
let calY = 0, calM = 0, selDs = null;
let statsOpen = false;
let dayStates = [];            // créneaux du jour sélectionné (pour les feuilles)
let formDates = [], formDow = []; // réglages en cours de saisie
let loaded = false;

const todayStr = () => psDayStr();
function fmtStr(key, map) { let s = t(key); Object.keys(map || {}).forEach(k => { s = s.split('{' + k + '}').join(map[k]); }); return s; }
function capFirst(v) { const s = String(v || ''); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function months() { return (PS_LANG[PS_getLang()] && PS_LANG[PS_getLang()].months) || PS_LANG.fr.months; }
function daysShort() { return (PS_LANG[PS_getLang()] && PS_LANG[PS_getLang()].days_short) || PS_LANG.fr.days_short; }
// Noms complets des jours (lundi → dimanche) dans la langue de l'appli
function weekdayNames() {
  const out = [];
  for (let i = 0; i < 7; i++) out.push(capFirst(new Date(2026, 0, 5 + i).toLocaleDateString(P.locale(), { weekday: 'long' })));
  return out;
}
function dayLong(ds) { return P.fmtDate(ds, { day: 'numeric', month: 'long', year: 'numeric' }); }
function dayShort(ds) { return P.fmtDate(ds, { day: 'numeric', month: 'long' }); }
function dayWeek(ds) { return capFirst(P.fmtDate(ds, { weekday: 'long', day: 'numeric', month: 'long' })); }
function curCure() { return allCures.find(c => c.id === currentCureId) || null; }
function cureInjs(id) { return allInjs.filter(i => i.cure_id === id); }
function cureTitle(c) { return capFirst((c && (c.name || c.peptide_name)) || ''); }
function cureStatusText(m) { return m.state === 'ended' ? t('cure_status_ended') : m.state === 'future' ? t('cure_status_future') : t('cure_status_active'); }
// Dose toujours affichée en mg (ancienne unité mcg convertie)
function doseMg(c) {
  const v = parseFloat(c && c.dose_mcg); if (!isFinite(v) || v <= 0) return null;
  return String((c.unit || 'mg')).toLowerCase() === 'mcg' ? v / 1000 : v;
}
function mgLabel(v) { return (v === null || v === undefined || !isFinite(v)) ? '' : P.fmtNum(v, 3) + ' mg'; }

/* ══════════════ Rotation des sites (mémoire du téléphone, comme avant) ══════════════ */
function sitesFor(admin) {
  return String(admin || '').toUpperCase() === 'IM'
    ? [['deltoid_g', 'site_deltoid_g'], ['deltoid_d', 'site_deltoid_d'], ['quad_g', 'site_quad_g'], ['quad_d', 'site_quad_d']]
    : [['abd_g', 'site_abd_g'], ['abd_d', 'site_abd_d'], ['cuisse_g', 'site_thigh_g'], ['cuisse_d', 'site_thigh_d'], ['fesse_g', 'site_glute_g'], ['fesse_d', 'site_glute_d']];
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function siteKey(cureId, ds, slot) { return 'ps_site_' + cureId + '_' + ds + (slot ? '_' + slot : ''); }
function nextSite(cure, ds, slot) {
  const sites = sitesFor(P.cure(cure).admin);
  const stored = lsGet(siteKey(cure.id, ds, slot));
  let idx = stored !== null ? parseInt(stored, 10) : parseInt(lsGet('ps_site_global_' + cure.id) || '0', 10);
  if (!isFinite(idx) || idx < 0) idx = 0;
  idx = idx % sites.length;
  return { idx, label: t(sites[idx][1]) };
}
function cycleSite(cure, ds, slot) {
  const sites = sitesFor(P.cure(cure).admin);
  const cur = nextSite(cure, ds, slot).idx;
  lsSet(siteKey(cure.id, ds, slot), String((cur + 1) % sites.length));
}
function commitSite(cure, ds, slot, idx) {
  const sites = sitesFor(P.cure(cure).admin);
  lsSet(siteKey(cure.id, ds, slot), String(idx));
  lsSet('ps_site_global_' + cure.id, String((idx + 1) % sites.length));
}

/* ══════════════ Chargement ══════════════ */
PS_initShell();
document.getElementById('view').innerHTML = P.skeleton();

async function init() {
  const session = await P.requireSession(sb);
  if (!session) return;
  userId = session.user.id;
  const { data: profil } = await sb.from('profiles').select('lang').eq('id', userId).single();
  if (profil) PS_loadLangFromProfile(sb, userId, profil.lang);
  await loadData();
  loaded = true;
  route();
}
async function loadData() {
  const [cRes, iRes, vRes] = await Promise.all([
    sb.from('cures').select('*').eq('user_id', userId).order('created_at', { ascending: false }),
    sb.from('injections').select('*').eq('user_id', userId).limit(1000),
    sb.from('inventory').select('id, peptide_name, notes, remaining_units, vial_qty_mg').eq('user_id', userId).order('created_at', { ascending: false })
  ]);
  if (cRes.error) throw cRes.error;
  if (iRes.error) throw iRes.error;
  allCures  = cRes.data || [];
  allInjs   = iRes.data || [];
  inventory = (vRes && vRes.data) || [];
  await loadDayNotes();
}

/* ── NOTES DU JOUR (BUG-09) ────────────────────────────────────
   Table Supabase day_notes (docs/sql/2026-10-15_notes_du_jour.sql). Tant qu'elle n'existe
   pas, repli sur la mémoire du téléphone ('ps_note_<cure>_<jour>'). Dès qu'elle existe,
   les notes restées dans le téléphone y sont recopiées puis retirées du téléphone. */
let dayNotes = {};            // '<cureId>_<AAAA-MM-JJ>' → texte
let dayNotesRemote = false;
async function loadDayNotes() {
  dayNotes = {};
  try {
    const { data, error } = await sb.from('day_notes').select('cure_id, day, note').eq('user_id', userId);
    if (error) throw error;
    dayNotesRemote = true;
    (data || []).forEach(n => { dayNotes[n.cure_id + '_' + String(n.day).slice(0, 10)] = n.note || ''; });
  } catch (e) { dayNotesRemote = false; return; }
  const ids = new Set(allCures.map(c => c.id));
  const rows = [], keys = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      const m = k && /^ps_note_(.+)_(\d{4}-\d{2}-\d{2})$/.exec(k);
      if (!m || !ids.has(m[1])) continue;
      const note = localStorage.getItem(k) || '';
      if (!note.trim()) { keys.push(k); continue; }
      if (dayNotes[m[1] + '_' + m[2]] === undefined) rows.push({ user_id: userId, cure_id: m[1], day: m[2], note });
      keys.push(k);
    }
  } catch (e) { return; }
  if (rows.length) {
    const { error } = await sb.from('day_notes').upsert(rows, { onConflict: 'user_id,cure_id,day' });
    if (error) return;   // on réessaiera au prochain chargement
    rows.forEach(r => { dayNotes[r.cure_id + '_' + r.day] = r.note; });
  }
  keys.forEach(lsDel);
}
function getDayNote(ds) {
  const k = currentCureId + '_' + ds;
  if (dayNotes[k] !== undefined) return dayNotes[k];
  return lsGet('ps_note_' + k) || '';
}
async function saveNote() {
  const el = document.getElementById('dayNote'), msg = document.getElementById('noteMsg');
  if (!el || !selDs || !currentCureId) return;
  const ds = selDs, k = currentCureId + '_' + ds;
  const btn = document.getElementById('noteSave');
  if (btn) { btn.disabled = true; btn.setAttribute('aria-busy', 'true'); }
  let remote = false, local = false;
  if (dayNotesRemote) {
    try {
      const { error } = await sb.from('day_notes').upsert({ user_id: userId, cure_id: currentCureId, day: ds, note: el.value }, { onConflict: 'user_id,cure_id,day' });
      if (!error) { remote = true; dayNotes[k] = el.value; lsDel('ps_note_' + k); }
    } catch (e) {}
  }
  if (!remote) local = lsSet('ps_note_' + k, el.value);
  if (btn) { btn.disabled = false; btn.removeAttribute('aria-busy'); }
  el.removeAttribute('aria-invalid');
  if (msg) msg.innerHTML = '';
  if (remote) P.toast(t('cure2_note_saved'));
  else if (local) P.toast(t('cure2_note_local'));
  else {
    el.setAttribute('aria-invalid', 'true'); el.setAttribute('aria-errormessage', 'noteMsg');
    if (msg) msg.innerHTML = P.notice(t('cure2_note_error'), 'error');
  }
}

/* ══════════════ Navigation entre la cure et ses réglages ══════════════ */
function route() {
  if (!loaded) return;
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === 'new') renderSettings(null);
  else if (h.indexOf('edit=') === 0) {
    const id = h.slice(5);
    if (allCures.some(c => c.id === id)) renderSettings(id);
    else { history.replaceState(null, '', location.pathname); renderMain(); P.toast(t('cure2_not_found')); }
  }
  else renderMain();
  window.scrollTo(0, 0);
}
function goMain() {
  if (location.hash) { history.replaceState(null, '', location.pathname); }
  renderMain(); window.scrollTo(0, 0);
  const m = document.getElementById('main'); if (m) m.focus({ preventScroll: true });
}
window.addEventListener('hashchange', () => { route(); const m = document.getElementById('main'); if (m) m.focus({ preventScroll: true }); });

/* ══════════════ Vue principale ══════════════ */
function pickDefaultCure() {
  if (currentCureId && allCures.some(c => c.id === currentCureId)) return;
  const saved = lsGet('ps_cure_view');
  if (saved && allCures.some(c => c.id === saved)) { currentCureId = saved; return; }
  const active = allCures.find(c => P.cure(c).state === 'active');
  currentCureId = (active || allCures[0]).id;
}
function pickDefaultDay(m) {
  const td = todayStr();
  if (m.inCure(psDay(td)) || m.state === 'active') return td;
  if (m.state === 'future') return psDayStr(m.start);
  return psDayStr(P.addDays(m.end, -1));
}
function setSelected(ds) {
  selDs = ds; const d = psDay(ds); calY = d.getFullYear(); calM = d.getMonth();
}

function renderMain() {
  const v = document.getElementById('view');
  if (!allCures.length) {
    v.innerHTML =
      '<div class="page-intro"><h1>' + esc(t('cure2_title')) + '</h1><p class="muted small">' + esc(t('cure2_empty_sub')) + '</p></div>' +
      '<section class="card">' + P.empty(t('cure2_empty_title'), t('cure2_empty_text'), 'calendar-days', t('cure2_create'), '#new') + '</section>' +
      '<a class="btn secondary full" href="inventaire.html">' + esc(t('cure2_add_equipment')) + '</a>';
    PS_applyI18n();
    return;
  }
  pickDefaultCure();
  const cure = curCure(), m = P.cure(cure);
  if (!selDs || !selDsBelongs) { setSelected(pickDefaultDay(m)); selDsBelongs = true; }
  const picker = allCures.length > 1
    ? P.select(t('cure2_select_label'), 'cureSelect', allCures.map(c => [c.id, cureTitle(c) + ' · ' + cureStatusText(P.cure(c))]), currentCureId)
    : '';
  v.innerHTML =
    '<div class="page-intro"><h1>' + esc(t('cure2_title')) + '</h1><p class="muted small">' + esc(t('intro_cure_sub')) + '</p></div>' +
    picker +
    '<section class="card calendar-card" id="calCard"></section>' +
    '<section class="card day-card" id="dayCard" aria-live="polite"></section>' +
    '<a class="btn secondary full" href="#edit=' + encodeURIComponent(cure.id) + '">' + P.icon('cog-6-tooth') + esc(t('cure2_settings_btn')) + '</a>' +
    '<section class="card compact" id="statsCard"></section>';
  const sel = document.getElementById('cureSelect');
  if (sel) sel.onchange = () => {
    currentCureId = sel.value; lsSet('ps_cure_view', sel.value);
    setSelected(pickDefaultDay(P.cure(curCure()))); renderMain();
  };
  renderCalendar(); renderDay(); renderStats();
  PS_applyI18n();
}
let selDsBelongs = false;   // vrai une fois une journée choisie pour la cure affichée

/* ── Calendrier ── */
function statesFor(model, ds, rep) { return P.slotStates(model, cureInjs(model.id), ds, rep); }
function countLabel(states) {
  if (states === null) return t('cure2_outside');
  if (!states.length) return t('cure2_c_rest_1');
  const n = {}, order = [];
  states.forEach(s => { if (!n[s.status]) { n[s.status] = 0; order.push(s.status); } n[s.status]++; });
  return order.map(k => n[k] + ' ' + t('cure2_c_' + k + '_' + (n[k] > 1 ? 'n' : '1'))).join(', ');
}
function marksHtml(codes, withLabel) {
  if (!codes || !codes.length) return '';
  const shown = codes.slice(0, 2).map(c => P.status(c, withLabel ? undefined : false)).join('');
  const more = codes.length > 2 ? '<span class="more" aria-hidden="true">+' + (codes.length - 2) + '</span>' : '';
  return '<span class="marks">' + shown + more + '</span>';
}
function renderCalendar() {
  const box = document.getElementById('calCard'); if (!box) return;
  const cure = curCure(), m = P.cure(cure), rep = P.reportMap(m, cureInjs(cure.id));
  const first = new Date(calY, calM, 1), nDays = new Date(calY, calM + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7, td = todayStr();
  const names = weekdayNames(), shortN = daysShort();
  const selInMonth = selDs && psDay(selDs).getFullYear() === calY && psDay(selDs).getMonth() === calM;
  const focusDs = selInMonth ? selDs : (psDay(td).getMonth() === calM && psDay(td).getFullYear() === calY ? td : psDayStr(first));
  const cells = names.map((nm, i) => '<span class="day-name" role="columnheader" aria-label="' + esc(nm) + '">' + esc(shortN[i]) + '</span>');
  for (let i = 0; i < lead; i++) cells.push('<span class="cal-pad" role="gridcell"></span>');
  let agenda = '';
  for (let d = 1; d <= nDays; d++) {
    const ds = psDayStr(new Date(calY, calM, d));
    const st = statesFor(m, ds, rep), codes = P.dayCodes(st);
    const isToday = ds === td, isSel = ds === selDs;
    const label = dayLong(ds) + ', ' + countLabel(st) + (isToday ? ', ' + t('cure2_today') : '');
    cells.push('<button type="button" class="day' + (st === null ? ' outside' : '') + '" role="gridcell" data-ds="' + ds + '" aria-selected="' + isSel + '"' +
      (isToday ? ' aria-current="date"' : '') + ' tabindex="' + (ds === focusDs ? 0 : -1) + '" aria-label="' + esc(label) + '">' +
      '<span class="day-number" aria-hidden="true">' + d + '</span>' + (codes ? marksHtml(codes, false) : '<span class="marks"></span>') + '</button>');
    if (st !== null) {
      agenda += '<button type="button" data-ds="' + ds + '" aria-pressed="' + isSel + '"><strong>' + esc(capFirst(dayShort(ds))) + (isToday ? ' · ' + esc(t('cure2_today')) : '') + '</strong>' +
        marksHtml(codes, true) + '</button>';
    }
  }
  while (cells.length % 7) cells.push('<span class="cal-pad" role="gridcell"></span>');
  let rows = '';
  for (let i = 0; i < cells.length; i += 7) rows += '<div class="cal-row" role="row">' + cells.slice(i, i + 7).join('') + '</div>';
  box.innerHTML =
    '<div class="cal-head"><button type="button" class="icon-btn" id="calPrev" aria-label="' + esc(t('cure2_prev_month')) + '">' + P.icon('chevron-left') + '</button>' +
    '<h2 id="calHeading" aria-live="polite">' + esc(months()[calM] + ' ' + calY) + '</h2>' +
    '<button type="button" class="icon-btn" id="calNext" aria-label="' + esc(t('cure2_next_month')) + '">' + P.icon('chevron-right') + '</button></div>' +
    '<div class="calendar" role="grid" aria-labelledby="calHeading">' + rows + '</div>' +
    P.legend() +
    '<div class="calendar-agenda" aria-label="' + esc(t('cure2_agenda_aria')) + '">' + (agenda || '<p class="small muted">' + esc(t('cure2_agenda_empty')) + '</p>') + '</div>' +
    '<p class="help">' + esc(t('cure2_cal_help')) + '</p>';
  document.getElementById('calPrev').onclick = () => changeMonth(-1);
  document.getElementById('calNext').onclick = () => changeMonth(1);
  box.querySelectorAll('.calendar .day, .calendar-agenda button[data-ds]').forEach(b => {
    b.onclick = () => { selectDay(b.dataset.ds, b.classList.contains('day')); };
  });
  box.querySelectorAll('.calendar .day').forEach(b => b.addEventListener('keydown', onDayKey));
}
function changeMonth(dir) {
  calM += dir;
  if (calM < 0) { calM = 11; calY--; }
  if (calM > 11) { calM = 0; calY++; }
  renderCalendar();
}
function selectDay(ds, focusGrid) {
  setSelected(ds); renderCalendar(); renderDay();
  if (focusGrid) { const b = document.querySelector('.calendar .day[data-ds="' + ds + '"]'); if (b) b.focus(); }
}
function onDayKey(e) {
  const cur = psDay(e.currentTarget.dataset.ds), wd = (cur.getDay() + 6) % 7;
  const off = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7, Home: -wd, End: 6 - wd }[e.key];
  if (off === undefined) return;
  e.preventDefault();
  selectDay(psDayStr(P.addDays(cur, off)), true);
}

/* ── Détail du jour ── */
function slotSub(s, cure) {
  const parts = [];
  const rec = s.inj;
  const status = s.status;
  if (status === 'partial' && rec && P.getTag(rec.notes, 'qty')) parts.push(mgLabel(parseFloat(P.getTag(rec.notes, 'qty'))));
  else if (status === 'done' || status === 'partial' || status === 'planned') { const d = mgLabel(doseMg(cure)); if (d) parts.push(d); }
  if (rec && rec.injection_site && P.isTaken(rec)) parts.push(rec.injection_site);
  else if (status === 'done' || status === 'partial' || status === 'planned') parts.push(P.cure(cure).admin);
  if (status === 'postponed' && rec) {
    const to = P.postponedTo(rec);
    if (to) parts.push(fmtStr('cure2_postponed_to', { d: dayShort(to.ds) + (to.time ? ' · ' + to.time : '') }));
  } else if (s.to && !rec) {
    parts.push(fmtStr('cure2_covered_on', { d: dayShort(s.to.ds) }));
  } else if (s.incoming) {
    parts.push(fmtStr('cure2_from', { d: dayShort(s.from) }));
  } else if ((s.extra || s.off) && s.from) {
    parts.push(fmtStr('cure2_covers', { d: dayShort(s.from) }));
  } else if (s.extra || s.off) {
    parts.push(t('cure2_offplan'));
  }
  if (s.auto && status === 'missed') parts.push(t('cure2_not_recorded'));
  return parts.filter(Boolean).join(' · ');
}
function renderDay() {
  const box = document.getElementById('dayCard'); if (!box) return;
  const cure = curCure(), m = P.cure(cure), ds = selDs;
  const rep = P.reportMap(m, cureInjs(cure.id));
  const st = statesFor(m, ds, rep);
  dayStates = st || [];
  const codes = P.dayCodes(st);
  let head = '';
  if (codes && codes.length === 1) head = P.status(codes[0]);
  else if (codes && codes.length > 1) head = '<span class="small muted">' + esc(countLabel(st)) + '</span>';
  let body = '';
  const peptide = capFirst(cure.peptide_name || cure.name);
  dayStates.forEach((s, i) => {
    body += '<button type="button" class="list-row" data-slot-i="' + i + '">' +
      '<div class="grow"><strong>' + esc((s.time || '—') + ' · ' + peptide) + '</strong><div class="muted small">' + esc(slotSub(s, cure)) + '</div></div>' +
      P.status(s.status) + P.icon('chevron-right', 'chev') + '</button>';
  });
  if (st === null) body += '<p class="small muted day-msg">' + esc(t('cure2_day_outside')) + '</p>';
  else if (!m.isScheduled(psDay(ds)) && !dayStates.some(s => !s.incoming)) {
    body += '<p class="small muted day-msg">' + esc(t('cure2_rest_planned')) + '</p>';
    if (ds <= todayStr()) body += '<button type="button" class="btn ghost full" id="addOff">' + P.icon('plus') + esc(t('cure2_add_offplan')) + '</button>';
  }
  const note = st === null ? '' :
    '<div class="note-block"><label class="label" for="dayNote">' + esc(t('cure2_note_label')) + '</label>' +
    '<textarea class="textarea" id="dayNote" placeholder="' + esc(t('cure2_note_ph')) + '">' + esc(getDayNote(ds)) + '</textarea>' +
    '<div id="noteMsg"></div>' +
    '<button type="button" class="btn ghost full" id="noteSave">' + esc(t('cure2_note_save')) + '</button></div>';
  box.innerHTML = '<div class="day-head"><h2>' + esc(capFirst(dayShort(ds))) + '</h2>' + head + '</div>' + body + note;
  box.querySelectorAll('[data-slot-i]').forEach(b => { b.onclick = () => openSlot(dayStates[Number(b.dataset.slotI)], b); });
  const add = document.getElementById('addOff');
  if (add) add.onclick = () => openSlot({ slot: 0, time: m.times[0], status: 'rest', inj: null, auto: true, off: true, offNew: true }, add);
  const ns = document.getElementById('noteSave'); if (ns) ns.onclick = saveNote;
}

/* ── Statistiques (repliables) ── */
function renderStats() {
  const box = document.getElementById('statsCard'); if (!box) return;
  const cure = curCure(), m = P.cure(cure), r = P.cureStats(m, cureInjs(cure.id));
  const dayN = Math.min(Math.max(1, m.dayNumber(new Date())), m.duration);
  const kv = (k, v) => '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>';
  box.innerHTML = '<details class="stats"' + (statsOpen ? ' open' : '') + '><summary class="toggle-detail">' + esc(t('cure2_stats')) + P.icon('chevron-right') + '</summary>' +
    kv(t('cure2_st_period'), dayShort(m.start) + ' → ' + dayShort(P.addDays(m.end, -1))) +
    kv(t('cure2_st_state'), cureStatusText(m) + (m.state === 'active' ? ' · ' + fmtStr('cure2_st_day', { n: dayN, d: m.duration }) : '')) +
    kv(t('cure2_st_freq'), m.freqLabel()) +
    kv(t('cure2_st_recorded'), fmtStr('cure2_st_of', { a: r.recorded, b: r.slotsElapsed })) +
    kv(t('cure2_st_done'), String(r.done)) +
    kv(t('cure2_st_partial'), String(r.partial)) +
    kv(t('cure2_st_missed'), String(Math.max(0, r.missed - r.notRecorded))) +
    kv(t('cure2_st_notrec'), String(r.notRecorded)) +
    kv(t('cure2_st_postponed'), String(r.postponed)) +
    kv(t('cure2_st_planned'), String(r.planned)) +
    kv(t('cure2_st_rest'), String(r.restDays)) +
    '<p class="footnote">' + esc(t('cure2_st_note')) + '</p></details>';
  box.querySelector('details').addEventListener('toggle', e => { statsOpen = e.target.open; });
}

/* ══════════════ Feuille d'un créneau ══════════════ */
// Injections « hors planning » de la cure, non rattachées : candidates à un rattachement
function strayInjections(m) {
  return cureInjs(m.id).filter(i => P.isTaken(i) && !P.readReport(i) && !m.isScheduled(psDay(P.injDay(i))))
    .sort((a, b) => String(a.injected_at).localeCompare(String(b.injected_at)));
}
function openSlot(s, trigger) {
  if (!s) return;
  const cure = curCure(), m = P.cure(cure), ds = selDs, td = todayStr();
  const rec = s.inj || null, future = ds > td;
  const peptide = capFirst(cure.peptide_name || cure.name);
  const title = fmtStr('cure2_slot_title', { h: s.time || '—' });
  let body = '<p class="muted small">' + esc(dayWeek(ds) + ' · ' + peptide) + '</p>' +
    '<div class="slot-meta"><span class="small muted">' + esc(t('cure2_current')) + '</span>' + P.status(s.status) + '</div>';
  const sub = slotSub(s, cure); if (sub) body += '<p class="small muted">' + esc(sub) + '</p>';

  // Ancien lien « report: » (injection hors planning rattachée à ce jour) : lecture + retrait
  if (s.to && !rec) {
    body += '<button type="button" class="btn secondary full" id="slUnlink">' + esc(t('cure2_unlink')) + '</button>';
    P.openSheet(title, body, d => {
      d.querySelector('#slUnlink').onclick = () => { P.closeSheet(); unlinkReport(ds); };
      d.addEventListener('close', () => { if (trigger && trigger.isConnected) trigger.focus(); }, { once: true });
    });
    return;
  }
  const taken = rec && P.isTaken(rec);
  const allow = s.incoming ? ['done', 'partial', 'missed'] : (s.offNew ? ['done', 'partial'] : (future ? ['postponed', 'rest'] : ['done', 'partial', 'missed', 'postponed', 'rest']));
  const canDone = !future && !taken;
  if (canDone) body += '<button type="button" class="btn full" id="slDone">' + esc(t('cure2_mark_done')) + '</button>';
  body += '<button type="button" class="btn secondary full" id="slOther">' + esc(t(rec ? 'cure2_change_status' : 'cure2_other_status')) + '</button>';
  if (future && !rec) body += '<p class="help">' + esc(t('cure2_future_hint')) + '</p>';
  // Heure
  body += '<hr class="divider">' + P.field(t('cure2_time_label'), 'slTime', '', 'time', (rec ? P.injTime(rec) : s.time) || '', rec ? '' : t('cure2_time_hint'));
  if (rec) body += '<button type="button" class="btn ghost full" id="slTimeSave">' + esc(t('cure2_time_save')) + '</button>';
  // Site (rotation)
  if (!future && !(rec && rec.injection_site) && (!rec || !taken)) {
    const site = nextSite(cure, ds, s.slot);
    body += '<div class="site-line"><div><span class="small muted">' + esc(t('cure2_site_label')) + '</span><strong id="slSite">' + esc(site.label) + '</strong></div>' +
      '<button type="button" class="link-btn" id="slSiteNext">' + esc(t('cure2_site_change')) + '</button></div>';
  } else if (rec && rec.injection_site) {
    body += '<div class="site-line"><div><span class="small muted">' + esc(t('cure2_site_label')) + '</span><strong>' + esc(rec.injection_site) + '</strong></div></div>';
  }
  // Rattacher une injection hors planning (jour prévu non renseigné)
  const strays = (s.auto && s.status === 'missed' && s.slot === 0 && !s.incoming && !rec && m.perDay === 1) ? strayInjections(m) : [];
  if (strays.length) {
    body += '<hr class="divider"><h3>' + esc(t('cure2_link_title')) + '</h3><p class="small muted">' + esc(t('cure2_link_help')) + '</p>' +
      P.select(t('cure2_link_pick'), 'slLinkPick', strays.map(i => [i.id, dayWeek(P.injDay(i)) + ' · ' + P.injTime(i)])) +
      '<button type="button" class="btn secondary full" id="slLink">' + esc(t('cure2_link_btn')) + '</button>';
  }
  if (rec) body += '<button type="button" class="btn ghost full danger-text" id="slClear">' + P.icon('trash') + esc(t('st_clear')) + '</button>';

  P.openSheet(title, body, d => {
    const timeVal = () => { const v = (d.querySelector('#slTime') || {}).value; return /^\d{2}:\d{2}$/.test(v || '') ? v : (s.time || P.nowHM()); };
    const ctx = () => ({ cure, model: m, ds, s, rec, time: timeVal() });
    d.addEventListener('close', () => { if (trigger && trigger.isConnected) trigger.focus(); }, { once: true });
    const bDone = d.querySelector('#slDone');
    if (bDone) bDone.onclick = () => { const c = ctx(); P.closeSheet(); applyStatus(c, { status: 'done' }); };
    d.querySelector('#slOther').onclick = async () => {
      const c = ctx();
      const res = await P.statusSheet({ title: t('st_sheet_title'), sub: dayWeek(ds) + ' · ' + c.time, date: ds, time: c.time, allow, canClear: !!rec });
      if (!res) return;
      if (res.status === 'clear') clearLine(c);
      else applyStatus(c, res);
    };
    const bT = d.querySelector('#slTimeSave');
    if (bT) bT.onclick = () => { const v = d.querySelector('#slTime').value; if (!/^\d{2}:\d{2}$/.test(v)) { d.querySelector('#slTime').setAttribute('aria-invalid', 'true'); return; } P.closeSheet(); saveTime(rec, v); };
    const bS = d.querySelector('#slSiteNext');
    if (bS) bS.onclick = () => { cycleSite(cure, ds, s.slot); d.querySelector('#slSite').textContent = nextSite(cure, ds, s.slot).label; };
    const bL = d.querySelector('#slLink');
    if (bL) bL.onclick = () => { const id = d.querySelector('#slLinkPick').value; P.closeSheet(); linkReport(id, ds); };
    const bC = d.querySelector('#slClear');
    if (bC) bC.onclick = () => { const c = ctx(); P.closeSheet(); clearLine(c); };
  });
}

/* ══════════════ Écritures des créneaux ══════════════ */
// Quantité à déduire du stock pour une ligne : done → dose de la cure (undefined) ;
// partiel → qty saisie, sinon rien ; autres états → rien (null)
function stockQty(notes) {
  const st = P.getTag(notes, 'st');
  if (st === 'missed' || st === 'rest' || st === 'postponed') return null;
  if (st === 'partial') { const q = parseFloat(P.getTag(notes, 'qty')); return isFinite(q) && q > 0 ? q : null; }
  return undefined;
}
async function stockMove(cure, notes, dir) {
  const q = stockQty(notes); if (q === null) return;
  try { await P.updateStock(sb, userId, cure, dir, q); } catch (e) { console.warn('[stock]', e); }
}
function buildNotes(base, slot, res) {
  let n = P.setTag(base, 'slot', String(slot));
  n = P.setTag(n, 'st', res.status === 'done' ? null : res.status);
  n = P.setTag(n, 'qty', res.status === 'partial' && res.qty ? String(res.qty) : null);
  n = P.setTag(n, 'to', res.status === 'postponed' ? res.date + ' ' + res.time : null);
  return n;
}
async function reloadAndRender() {
  try { await loadData(); } catch (e) { console.warn(e); }
  P.refreshReminders(allCures, allInjs, userId);
  if (document.getElementById('dayCard')) { renderCalendar(); renderDay(); renderStats(); } else renderMain();
}
function findLine(cureId, ds, slot, notes) {
  return allInjs.find(i => i.cure_id === cureId && P.injDay(i) === ds && P.injSlot(i) === slot && String(i.notes || '') === notes) || null;
}
function toastFor(status) {
  return status === 'done' ? t('cure2_saved_done') : status === 'partial' ? t('msg_partial') : status === 'missed' ? t('msg_missed') : status === 'postponed' ? t('cure2_saved_postponed') : t('cure2_saved_status');
}
async function applyStatus(c, res) {
  const { cure, ds, s, rec } = c;
  const slot = s.slot || 0;
  const taking = res.status === 'done' || res.status === 'partial';
  try {
    if (rec) {
      const prev = { notes: rec.notes || '', injection_site: rec.injection_site || null, dose_mcg: rec.dose_mcg };
      const notes = buildNotes(prev.notes, slot, res);
      const upd = { notes };
      if (taking && !rec.injection_site) { const site = nextSite(cure, ds, slot); upd.injection_site = site.label; commitSite(cure, ds, slot, site.idx); }
      if (res.status === 'partial' && res.qty) upd.dose_mcg = res.qty;
      else if (res.status === 'done') upd.dose_mcg = cure.dose_mcg || null;
      const { error } = await sb.from('injections').update(upd).eq('id', rec.id);
      if (error) throw error;
      if (P.isTaken({ notes: prev.notes })) await stockMove(cure, prev.notes, +1);
      if (taking) await stockMove(cure, notes, -1);
      await reloadAndRender();
      P.toast(toastFor(res.status), async () => {
        await sb.from('injections').update(prev).eq('id', rec.id);
        if (taking) await stockMove(cure, notes, +1);
        if (P.isTaken({ notes: prev.notes })) await stockMove(cure, prev.notes, -1);
        await reloadAndRender();
      });
      return;
    }
    // Nouvelle ligne
    const base = s.incoming ? 'slot:' + slot + '|report:' + s.from : 'slot:' + slot;
    const notes = buildNotes(base, slot, res);
    const row = {
      user_id: userId, cure_id: cure.id, peptide_name: cure.peptide_name || cure.name,
      dose_mcg: taking ? (res.status === 'partial' && res.qty ? res.qty : (cure.dose_mcg || null)) : null,
      injection_site: null, injected_at: P.localStamp(ds, c.time), notes
    };
    if (taking) { const site = nextSite(cure, ds, slot); row.injection_site = site.label; commitSite(cure, ds, slot, site.idx); }
    const { data, error } = await sb.from('injections').insert(row).select().single();
    if (error) throw error;
    if (taking) await stockMove(cure, notes, -1);
    await reloadAndRender();
    const newId = (data && data.id) || (findLine(cure.id, ds, slot, notes) || {}).id || null;
    P.toast(toastFor(res.status), async () => {
      if (newId) await sb.from('injections').delete().eq('id', newId);
      if (taking) await stockMove(cure, notes, +1);
      await reloadAndRender();
    });
  } catch (e) {
    console.error(e); P.toast(t('msg_save_error'));
  }
}
async function clearLine(c) {
  const { cure, rec } = c; if (!rec) return;
  const ok = await P.confirm({ title: t('cure2_clear_title'), text: t('cure2_clear_text'), ok: t('cure2_clear_ok'), cancel: t('cancel'), danger: true });
  if (!ok) return;
  try {
    const { error } = await sb.from('injections').delete().eq('id', rec.id);
    if (error) throw error;
    if (P.isTaken(rec)) await stockMove(cure, rec.notes, +1);
    const copy = { user_id: userId, cure_id: rec.cure_id, peptide_name: rec.peptide_name, dose_mcg: rec.dose_mcg, injection_site: rec.injection_site || null, injected_at: rec.injected_at, notes: rec.notes };
    await reloadAndRender();
    P.toast(t('cure2_cleared'), async () => {
      await sb.from('injections').insert(copy);
      if (P.isTaken(rec)) await stockMove(cure, rec.notes, -1);
      await reloadAndRender();
    });
  } catch (e) { console.error(e); P.toast(t('msg_save_error')); }
}
async function saveTime(rec, hm) {
  if (!rec) return;
  const stamp = P.localStamp(P.injDay(rec), hm), prev = rec.injected_at;
  try {
    const { error } = await sb.from('injections').update({ injected_at: stamp }).eq('id', rec.id);
    if (error) throw error;
    await reloadAndRender();
    P.toast(t('cure2_time_saved'), async () => { await sb.from('injections').update({ injected_at: prev }).eq('id', rec.id); await reloadAndRender(); });
  } catch (e) { console.error(e); P.toast(t('msg_save_error')); }
}
// Liens de report décidés par l'utilisateur (ancien fonctionnement « report: »)
async function linkReport(injId, missedDs) {
  const inj = allInjs.find(i => i.id === injId); if (!inj) return;
  const notes = P.setTag(inj.notes, 'report', missedDs);
  const { error } = await sb.from('injections').update({ notes }).eq('id', inj.id);
  if (error) { P.toast(t('msg_save_error')); return; }
  inj.notes = notes;
  await reloadAndRender();
  P.toast(t('cure_report_linked'));
}
async function unlinkReport(missedDs) {
  const inj = allInjs.find(i => i.cure_id === currentCureId && P.readReport(i) === missedDs); if (!inj) return;
  const notes = P.setTag(inj.notes, 'report', null);
  const { error } = await sb.from('injections').update({ notes }).eq('id', inj.id);
  if (error) { P.toast(t('msg_save_error')); return; }
  inj.notes = notes;
  await reloadAndRender();
  P.toast(t('cure_report_unlinked'));
}

  'Epithalon', 'Semax', 'Selank', 'PT-141', 'AOD-9604', 'Thymosin Alpha-1', 'GHK-Cu', 'TB-500 + BPC-157'];
const MAX_TIMES = 3;
function fld(label, id, opts) {
  opts = opts || {};
  return '<div class="field" id="' + id + '-f"><label class="label" for="' + id + '">' + esc(label) + '</label><div class="input-wrap">' +
    '<input class="input" id="' + id + '" name="' + id + '" type="' + (opts.type || 'text') + '" value="' + esc(opts.value || '') + '"' +
    (opts.inputmode ? ' inputmode="' + opts.inputmode + '"' : '') + (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '') +

    (opts.unit ? '<span class="input-unit">' + esc(opts.unit) + '</span>' : '') + '</div>' +

}
function sel(label, id, list, value, hint) {
  return '<div class="field" id="' + id + '-f"><label class="label" for="' + id + '">' + esc(label) + '</label><select class="select" id="' + id + '"' +

function invLabel(f) {
  const ty = P.getTag(f.notes, 'type') || 'vial';

  return capFirst(f.peptide_name || '—') + ' · ' + kind;
}

  formDates = m && m.dates ? m.dates.slice().sort() : [];

  if (freq === 'keep') freqOpts.unshift(['keep', fmtStr('cure2_fq_keep', { f: m.freqLabel() })]);

  if (m && m.inv && !invOpts.some(o => o[0] === m.inv)) invOpts.push([m.inv, t('cure2_vial_unknown')]);
  const names = Array.from(new Set(inventory.map(f => f.peptide_name).filter(Boolean).concat(PEPTIDES_BIBLIO)));

  v.innerHTML =

    '<div class="page-intro"><h1>' + esc(t('cure2_settings_btn')) + '</h1><p class="muted small">' + esc(t('cure2_set_sub')) + '</p></div>' +
    '<form id="cureForm" class="stack" novalidate>' +
      '<div id="formErr"></div>' +
      fld(t('cure2_f_name'), 'cName', { value: cure ? (cure.name || cure.peptide_name || '') : '', ph: t('cure2_f_name_ph'), attrs: 'required autocomplete="off"' }) +
      fld(t('cure2_f_peptide'), 'cPeptide', { value: cure ? (cure.peptide_name || '') : '', ph: t('cure2_f_peptide_ph'), attrs: 'required list="pepList" autocomplete="off"' }) +
      '<datalist id="pepList">' + names.map(n => '<option value="' + esc(n) + '">').join('') + '</datalist>' +
      sel(t('cure2_f_device'), 'cDevice', [['syringe', t('cure2_dev_syringe')], ['prefilled', t('cure2_dev_prefilled')], ['refillable', t('cure2_dev_refillable')]], m ? m.device : 'syringe') +
      fld(t('cure2_f_dose'), 'cDose', { value: dose !== null ? String(dose).replace('.', P.lang() === 'en' ? '.' : ',') : '', unit: 'mg', inputmode: 'decimal', ph: '—', hint: t('cure2_dose_help') }) +
      sel(t('cure2_f_admin'), 'cAdmin', adminOpts, admin) +
      sel(t('cure2_f_freq'), 'cFreq', freqOpts, freq) +
      '<div id="freqDetail"></div>' +
      '<div class="grid2">' +
        fld(t('cure2_f_start'), 'cStart', { type: 'date', value: cure ? String(cure.start_date || '').slice(0, 10) : todayStr(), attrs: 'required' }) +
        fld(t('cure2_f_duration'), 'cDuration', { value: cure && cure.duration_days ? String(cure.duration_days) : '', unit: t('days'), inputmode: 'numeric', attrs: 'required' }) +
      '</div>' +
      '<div class="stack tight" id="timesBox"></div>' +
      '<button type="button" class="btn secondary full" id="addTime">' + P.icon('plus') + esc(t('cure2_add_time')) + '</button>' +
      sel(t('cure2_f_vial'), 'cInv', invOpts, m && m.inv ? m.inv : '', t('cure2_vial_help')) +
      P.notice(t('cure2_notice')) +
      '<button class="btn full" type="submit" id="cSave">' + esc(t('cure2_save')) + '</button>' +
      (cure ? '<button type="button" class="btn danger full" id="cDelete">' + P.icon('trash') + esc(t('cure2_delete')) + '</button>' : '') +
    '</form>';

  document.getElementById('setBack').onclick = goMain;
  const tb = document.getElementById('timesBox');
  times.forEach(h => addTimeRow(h));
  document.getElementById('addTime').onclick = () => { addTimeRow(''); const all = tb.querySelectorAll('input[type=time]'); if (all.length) all[all.length - 1].focus(); };
  const fq = document.getElementById('cFreq');
  fq.onchange = () => renderFreqDetail(fq.value);
  renderFreqDetail(freq);
  document.getElementById('cureForm').onsubmit = e => { e.preventDefault(); saveCure(cure); };
  const del = document.getElementById('cDelete'); if (del) del.onclick = () => deleteCure(cure);
  PS_applyI18n();
}
let timeSerial = 0;
function addTimeRow(val) {
  const tb = document.getElementById('timesBox'); if (!tb) return;
  const n = tb.querySelectorAll('.time-row').length;
  if (n >= MAX_TIMES) return;
  const id = 'cTime' + (++timeSerial);
  const row = document.createElement('div'); row.className = 'time-row';
  row.innerHTML = fld(n === 0 ? t('cure2_f_time') : t('cure2_f_time_more'), id, { type: 'time', value: val, attrs: 'required' }) +
    (n === 0 ? '' : '<button type="button" class="icon-btn" aria-label="' + esc(t('cure2_remove_time')) + '">' + P.icon('x-mark') + '</button>');
  const rm = row.querySelector('.icon-btn');
  if (rm) rm.onclick = () => { row.remove(); relabelTimes(); };
  tb.appendChild(row);
  relabelTimes();
}
function relabelTimes() {
  const tb = document.getElementById('timesBox'); if (!tb) return;
  const rows = tb.querySelectorAll('.time-row');
  rows.forEach((r, i) => { const l = r.querySelector('.label'); if (l) l.textContent = i === 0 ? t('cure2_f_time') : t('cure2_f_time_more'); });
  const add = document.getElementById('addTime'); if (add) add.disabled = rows.length >= MAX_TIMES;
}
function renderFreqDetail(mode) {
  const box = document.getElementById('freqDetail'); if (!box) return;
  if (mode === 'dow') {
    const nm = weekdayNames();
    box.innerHTML = '<fieldset class="dow-set" id="dowSet" aria-describedby="dowSet-err"><legend>' + esc(t('cure2_dow_legend')) + '</legend>' +
      nm.map((n, i) => '<label class="checkline"><input type="checkbox" value="' + (i + 1) + '"' + (formDow.indexOf(i + 1) >= 0 ? ' checked' : '') + '>' + esc(n) + '</label>').join('') + '</fieldset>';
    box.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => {
      formDow = Array.from(box.querySelectorAll('input:checked')).map(x => Number(x.value));
    });
  } else if (mode === 'dates') {
    box.innerHTML = '<div class="stack tight" id="datesSet"><div class="date-list" id="dateList"></div>' +
      '<div class="date-add">' + fld(t('cure2_dates_add_label'), 'cDateNew', { type: 'date' }) +
      '<button type="button" class="btn secondary" id="dateAdd">' + P.icon('plus') + esc(t('cure2_dates_add')) + '</button></div></div>';
    const draw = () => {
      const list = document.getElementById('dateList');
      list.innerHTML = formDates.length
        ? formDates.map(d => '<div class="list-row"><span class="grow">' + esc(dayWeek(d)) + '</span><button type="button" class="icon-btn" data-rm="' + d + '" aria-label="' + esc(fmtStr('cure2_date_remove', { d: dayShort(d) })) + '">' + P.icon('x-mark') + '</button></div>').join('')
        : '<p class="small muted">' + esc(t('cure2_dates_none')) + '</p>';
      list.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { formDates = formDates.filter(x => x !== b.dataset.rm); draw(); });
    };
    draw();
    document.getElementById('dateAdd').onclick = () => {
      const inp = document.getElementById('cDateNew'), val = inp.value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(val)) { inp.setAttribute('aria-invalid', 'true'); inp.focus(); return; }
      inp.removeAttribute('aria-invalid');
      if (formDates.indexOf(val) < 0) { formDates.push(val); formDates.sort(); }
      inp.value = ''; draw();
    };
  } else box.innerHTML = '';
}
function setErr(id, msg) {
  const el = document.getElementById(id); if (!el) return;
  const holder = document.getElementById(id + '-f') || el.parentElement;
  if (el.tagName === 'INPUT' || el.tagName === 'SELECT') { el.setAttribute('aria-invalid', 'true'); el.setAttribute('aria-errormessage', id + '-err'); }
  const p = document.createElement('p'); p.className = 'error-text'; p.id = id + '-err'; p.textContent = msg;
  (holder.tagName === 'FIELDSET' ? holder : holder).appendChild(p);
}
function clearErrs(form) {
  form.querySelectorAll('.error-text').forEach(e => e.remove());
  form.querySelectorAll('[aria-invalid]').forEach(e => { e.removeAttribute('aria-invalid'); e.removeAttribute('aria-errormessage'); });
  document.getElementById('formErr').innerHTML = '';
}
async function saveCure(cure) {
  const form = document.getElementById('cureForm'); clearErrs(form);
  const val = id => (document.getElementById(id) || {}).value || '';
  const name = val('cName').trim(), peptide = val('cPeptide').trim();
  const device = val('cDevice'), admin = val('cAdmin'), mode = val('cFreq');
  const doseRaw = val('cDose').trim(), dose = P.num(doseRaw);
  const start = val('cStart'), durRaw = val('cDuration').trim();
  const timeInputs = Array.from(document.querySelectorAll('#timesBox input[type=time]'));
  const times = timeInputs.map(i => i.value).filter(v => /^\d{2}:\d{2}$/.test(v));
  const errs = [];
  if (!name) errs.push(['cName', t('cure2_err_name')]);
  if (!peptide) errs.push(['cPeptide', t('cure2_err_peptide')]);
  if (doseRaw && !(dose > 0)) errs.push(['cDose', t('cure2_err_dose')]);
  if (mode === 'dow' && !formDow.length) errs.push(['dowSet', t('cure2_err_dow')]);
  if (mode === 'dates' && !formDates.length) errs.push(['cDateNew', t('cure2_err_dates')]);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(start)) errs.push(['cStart', t('cure2_err_start')]);
  if (!/^\d+$/.test(durRaw) || parseInt(durRaw, 10) < 1) errs.push(['cDuration', t('cure2_err_duration')]);
  if (!times.length || times.length !== timeInputs.length) {
    const bad = timeInputs.find(i => !/^\d{2}:\d{2}$/.test(i.value)) || timeInputs[0];
    if (bad) errs.push([bad.id, t('cure2_err_time')]);
  }
  if (errs.length) {
    errs.forEach(e => setErr(e[0], e[1]));
    document.getElementById('formErr').innerHTML = P.notice(t('cure2_err_form'), 'error');
    const first = document.getElementById(errs[0][0]);
    const target = first && first.tagName === 'FIELDSET' ? first.querySelector('input') : first;
    if (target) target.focus();
    return;
  }
  // Fréquence (nombre en texte, sens inchangé) + étiquettes
  const perDay = String(times.length);
  const frequency = mode === 'every2' ? '0.5' : mode === 'keep' ? String(cure.frequency) : perDay;
  const orderedTimes = cure ? times : times.slice().sort();
  let notes = cure ? (cure.notes || '') : '';
  notes = P.setTag(notes, 'admin', admin || 'SC');
  notes = P.setTag(notes, 'dev', device || 'syringe');
  notes = P.setTag(notes, 'times', orderedTimes.join(','));
  notes = P.setTag(notes, 'inv', val('cInv') || null);
  notes = P.setTag(notes, 'dow', mode === 'dow' ? formDow.slice().sort((a, b) => a - b).join(',') : null);
  notes = P.setTag(notes, 'dates', mode === 'dates' ? formDates.slice().sort().join(',') : null);
  const payload = {
    name, peptide_name: peptide, dose_mcg: doseRaw ? dose : null, unit: 'mg', frequency,
    duration_days: parseInt(durRaw, 10), start_date: start, status: 'active', notes
  };
  const btn = document.getElementById('cSave');
  btn.disabled = true; btn.setAttribute('aria-busy', 'true'); btn.textContent = t('cure2_saving');
  try {
    if (cure) {
      const { error } = await sb.from('cures').update(payload).eq('id', cure.id);
      if (error) throw error;
      currentCureId = cure.id;
    } else {
      const { data, error } = await sb.from('cures').insert(Object.assign({}, payload, { user_id: userId })).select().single();
      if (error) throw error;
      if (data && data.id) currentCureId = data.id;
    }
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.removeAttribute('aria-busy'); btn.textContent = t('cure2_save');
    document.getElementById('formErr').innerHTML = P.notice(t('msg_save_error'), 'error');
    return;
  }
  try { await loadData(); } catch (e) { console.warn(e); }
  P.refreshReminders(allCures, allInjs, userId);
  const c = curCure();
  if (c) { lsSet('ps_cure_view', c.id); setSelected(pickDefaultDay(P.cure(c))); selDsBelongs = true; }
  goMain();
  P.toast(t(cure ? 'cure2_saved' : 'cure2_created'));
}
async function deleteCure(cure) {
  if (!cure) return;
  const ok = await P.confirm({ title: t('cure2_delete_title'), text: t('cure2_delete_text'), ok: t('cure2_delete'), cancel: t('cure2_keep'), danger: true });
  if (!ok) return;
  try {
    const r1 = await sb.from('injections').delete().eq('cure_id', cure.id);
    if (r1 && r1.error) throw r1.error;
    const r2 = await sb.from('cures').delete().eq('id', cure.id);
    if (r2 && r2.error) throw r2.error;
  } catch (e) { console.error(e); document.getElementById('formErr').innerHTML = P.notice(t('msg_save_error'), 'error'); return; }
  currentCureId = null; selDs = null; selDsBelongs = false; lsDel('ps_cure_view');
  try { await loadData(); } catch (e) { console.warn(e); }
  allCures = allCures.filter(c => c.id !== cure.id);
  P.refreshReminders(allCures, allInjs, userId);
  goMain();
  P.toast(t('cure2_deleted'));
}

init().catch(e => { console.error(e); document.getElementById('view').innerHTML = P.errorState(() => { document.getElementById('view').innerHTML = P.skeleton(); init().catch(() => {}); }); });
</script>
