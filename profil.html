<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PeptideScanner — Profil</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F4F7FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1424" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PeptideScanner">
<script>try{var _pst=localStorage.getItem('ps_theme');if(_pst==='light'||_pst==='dark')document.documentElement.dataset.theme=_pst}catch(e){}</script>
<link rel="stylesheet" href="/peptidescanner.css">
<script src="/lang.js"></script>
<script src="/assets/assets-bundle.js"></script>
<script src="/ps-app.js"></script>
<style>
  /* Profil — maquette « profile » du kit (11 · Profil) + liste « legal » (12) dans une feuille.
     Réécrit le 15/10/2026 (refonte Clarté à 100 %). Jetons du kit uniquement. */
  .prof-id h2 { overflow-wrap: anywhere; }
  .prof-id p { overflow-wrap: anywhere; }
  .prof-danger { display: grid; gap: 4px; }
  .prof-danger .btn { width: 100%; }
</style>
</head>
<!-- Sous-écran : pas d'onglet actif, retour vers l'accueil, barre d'onglets conservée -->
<body data-tab="" data-back="dashboard.html">
<a class="sr-only" href="#main">Aller au contenu</a>
<div class="page">
  <header id="psHeader"></header>
  <main id="main" class="content" tabindex="-1">
    <div class="page-intro"><h1 data-i18n="nav_profile">Profil</h1><p class="muted small" data-i18n="intro_profil_sub">Votre compte et vos préférences</p></div>
    <div id="view" class="stack"></div>
  </main>
  <nav id="psTabbar"></nav>
</div>

<script src="/vendor/supabase-2.117.3.umd.js"></script>
<script>
const SUPABASE_URL      = 'https://dkwztwlkjewdzfichkgk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrd3p0d2xramV3ZHpmaWNoa2drIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MjYwOTAsImV4cCI6MjA5NzQwMjA5MH0.iT7ylcNvPCf2jMUYfJlsDJcoGjPolphQWONFusAAlAk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const P = window.PS;   // outils communs (ps-app.js)
let userId = null, userEmail = '', profil = {};

PS_initShell();
document.getElementById('view').innerHTML = P.skeleton();

// Choix proposés (valeurs enregistrées dans profiles.experience / profiles.goal).
// Les valeurs du parcours d'arrivée (used, schedule, weight) et les anciens textes libres
// sont conservés tels quels : ils apparaissent comme option tant que l'utilisateur ne change rien.
const EXP_OPTS  = [['none', 'prof2_no_answer'], ['new', 'prof2_exp_new'], ['familiar', 'prof2_exp_familiar']];
const GOAL_OPTS = [['organize', 'prof2_goal_organize'], ['history', 'prof2_goal_history'], ['none', 'prof2_no_answer']];
const KNOWN_LABELS = { used: 'prof2_exp_used', schedule: 'prof2_goal_schedule', weight: 'prof2_goal_weight' };

function options(list, current) {
  const out = list.map(o => [o[0], t(o[1])]);
  if (current && !out.some(o => o[0] === current)) out.push([current, KNOWN_LABELS[current] ? t(KNOWN_LABELS[current]) : current]);
  return out;
}
function currentTheme() {
  let v = null; try { v = localStorage.getItem('ps_theme'); } catch (e) {}
  return (v === 'light' || v === 'dark') ? v : 'system';
}

async function init() {
  const session = await P.requireSession(sb);
  if (!session) return;
  userId = session.user.id;
  userEmail = session.user.email || '';
  const { data } = await sb.from('profiles').select('*').eq('id', userId).single();
  profil = data || {};
  PS_loadLangFromProfile(sb, userId, profil.lang);
  render();
  // Message laissé avant le rechargement dû au changement de langue
  try { if (sessionStorage.getItem('prof2_saved')) { sessionStorage.removeItem('prof2_saved'); P.toast(t('prof2_saved')); } } catch (e) {}
}

function row(tag, attrs, icon, title, sub, chevron) {
  return '<' + tag + ' class="list-row" ' + attrs + '>' + P.icon(icon) +
    '<div class="grow"><strong>' + P.esc(title) + '</strong>' + (sub ? '<div class="muted small">' + P.esc(sub) + '</div>' : '') + '</div>' +
    (chevron ? P.icon('chevron-right', 'chev') : '') + '</' + tag + '>';
}

function render() {
  const name = profil.full_name || '';
  const shown = name || (userEmail ? userEmail.split('@')[0] : t('prof2_no_name'));
  document.getElementById('view').innerHTML =
    // Carte d'identité du compte
    '<section class="card prof-id"><div class="row">' + P.icon('user-circle') +
      '<div class="grow"><h2>' + P.esc(shown) + '</h2><p class="small muted">' + P.esc(userEmail) + '</p></div></div></section>' +
    // Préférences
    '<form id="profileForm" class="stack" novalidate>' +
      P.field(t('profil_name'), 'profName', '', 'text', name, '', 'autocomplete="given-name" maxlength="60" placeholder="' + P.esc(t('prof2_name_ph')) + '"') +
      P.select(t('profil_experience'), 'profExperience', options(EXP_OPTS, profil.experience), profil.experience || 'none') +
      P.select(t('prof2_goal'), 'profGoal', options(GOAL_OPTS, profil.goal), profil.goal || 'organize') +
      P.select(t('profil_lang'), 'profLang', [['fr', t('prof2_lang_fr')], ['en', t('prof2_lang_en')]], PS_getLang()) +
      P.select(t('prof2_theme'), 'profTheme', [['light', t('prof2_theme_light')], ['dark', t('prof2_theme_dark')], ['system', t('prof2_theme_system')]], currentTheme()) +
      '<div id="profFeedback"></div>' +
      '<button class="btn full" type="submit" id="profSave">' + P.esc(t('prof2_save')) + '</button>' +
    '</form>' +
    // Compte, rappels, légal, export, déconnexion
    '<section class="card">' +
      row('a', 'href="premium.html"', 'credit-card', t('profil_subscription'), profil.premium ? t('profil_prem_active') : t('prof2_sub_discover'), true) +
      row('a', 'href="alertes.html"', 'bell', t('prof2_reminders'), t('prof2_reminders_sub'), true) +
      row('button', 'type="button" id="profLegal" aria-haspopup="dialog"', 'document-text', t('prof2_legal'), t('prof2_legal_sub'), true) +
      row('button', 'type="button" id="profExport"', 'arrow-down-tray', t('profil_export'), t('prof2_export_sub'), false) +
      row('button', 'type="button" id="profLogout"', 'arrow-right', t('profil_logout'), '', false) +
    '</section>' +
    // Suppressions (toujours confirmées)
    '<div class="prof-danger">' +
      '<button class="btn ghost full" type="button" id="profDelete">' + P.esc(t('profil_delete_account')) + '</button>' +
      '<button class="btn ghost full" type="button" id="profReset">' + P.esc(t('profil_reset')) + '</button>' +
    '</div>' +
    '<p class="screen-footer">' + P.esc(t('prof2_version')) + '</p>';

  document.getElementById('profileForm').addEventListener('submit', e => { e.preventDefault(); savePrefs(); });
  // L'apparence s'applique tout de suite (réglage du téléphone, enregistré dans ps_theme)
  document.getElementById('profTheme').addEventListener('change', e => P.applyTheme(e.target.value));
  document.getElementById('profLegal').onclick = openLegal;
  document.getElementById('profExport').onclick = exportData;
  document.getElementById('profLogout').onclick = () => P.logout(sb);
  document.getElementById('profDelete').onclick = deleteAccount;
  document.getElementById('profReset').onclick = resetData;
  PS_applyI18n();
}

// ── Enregistrer les préférences ─────────────────────────────────
async function savePrefs() {
  const btn = document.getElementById('profSave');
  const fb = document.getElementById('profFeedback');
  fb.innerHTML = '';
  const name = document.getElementById('profName').value.trim().slice(0, 60);
  const payload = {
    full_name: name || null,
    experience: document.getElementById('profExperience').value,
    goal: document.getElementById('profGoal').value
  };
  const theme = document.getElementById('profTheme').value;
  const lang = document.getElementById('profLang').value;
  btn.disabled = true; btn.setAttribute('aria-busy', 'true');
  let error = null;
  try { const r = await sb.from('profiles').update(payload).eq('id', userId); error = r && r.error; } catch (e) { error = e; }
  btn.disabled = false; btn.removeAttribute('aria-busy');
  if (error) { fb.innerHTML = P.notice(t('msg_save_error'), 'error'); return; }
  Object.assign(profil, payload);
  try { if (name) localStorage.setItem('ps_display_name', name); else localStorage.removeItem('ps_display_name'); } catch (e) {}
  P.applyTheme(theme);
  if (lang !== PS_getLang()) {
    // PS_setLang enregistre profiles.lang puis recharge la page
    try { sessionStorage.setItem('prof2_saved', '1'); } catch (e) {}
    await PS_setLang(lang);
    return;
  }
  render();
  P.toast(t('prof2_saved'));
}

// ── Informations légales (liste « legal » du kit) ──────────────
function openLegal() {
  P.openSheet(t('prof2_legal'),
    '<div class="list">' +
      row('a', 'href="cgu.html"', 'document-text', t('prof2_legal_terms'), t('prof2_legal_terms_sub'), true) +
      row('a', 'href="privacy.html"', 'shield-check', t('prof2_legal_privacy'), t('prof2_legal_privacy_sub'), true) +
      row('a', 'href="mentions-legales.html"', 'information-circle', t('prof2_legal_imprint'), t('prof2_legal_imprint_sub'), true) +
    '</div>');
}

// ── Export JSON de toutes les données ──────────────────────────
async function exportData() {
  try {
    const [cRes, iRes, wRes, invRes, aRes] = await Promise.all([
      sb.from('cures').select('*').eq('user_id', userId),
      sb.from('injections').select('*').eq('user_id', userId),
      sb.from('weight_logs').select('*').eq('user_id', userId),
      sb.from('inventory').select('*').eq('user_id', userId),
      sb.from('alerts').select('*').eq('user_id', userId)
    ]);
    const data = {
      profil, cures: cRes.data || [], injections: iRes.data || [], poids: wRes.data || [],
      inventaire: invRes.data || [], alertes: aRes.data || [],
      exportDate: P.localStamp(psDayStr(), P.nowHM())   // heure locale
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'peptidescanner-export-' + psDayStr() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    P.toast(t('profil_export_done'));
  } catch (e) {
    console.error(e);
    P.toast(t('prof2_export_error'));
  }
}

// ── Suppression du compte (Apple 5.1.1(v), Google Play) ────────
// La fonction serveur « delete-account » supprime l'utilisateur de l'authentification ;
// la base efface ensuite profil, cures, injections, poids, stock et alertes en cascade.
async function deleteAccount() {
  const ok = await P.confirm({ title: t('prof2_del_title'), text: t('prof2_del_text'),
    cancel: t('prof2_del_keep'), ok: t('prof2_del_ok'), danger: true });
  if (!ok) return;
  P.toast(t('prof2_deleting'));
  try {
    const { error } = await sb.functions.invoke('delete-account', { body: {} });
    if (error) throw error;
  } catch (e) {
    P.toast(t('profil_delete_error'));
    return;
  }
  try { await PS_cancelReminders(); } catch (e) {}
  try { await sb.auth.signOut(); } catch (e) {}
  try { localStorage.removeItem('ps_display_name'); localStorage.removeItem('ps_height_cm'); } catch (e) {}
  location.href = '/login.html';
}

// ── Supprimer toutes les données de suivi (le compte reste) ────
async function resetData() {
  const ok = await P.confirm({ title: t('prof2_reset_title'), text: t('prof2_reset_text'),
    cancel: t('prof2_reset_keep'), ok: t('prof2_reset_ok'), danger: true });
  if (!ok) return;
  try {
    const res = await Promise.all([
      sb.from('injections').delete().eq('user_id', userId),
      sb.from('cures').delete().eq('user_id', userId),
      sb.from('weight_logs').delete().eq('user_id', userId),
      sb.from('inventory').delete().eq('user_id', userId),
      sb.from('alerts').delete().eq('user_id', userId)
    ]);
    if (res.some(r => r && r.error)) throw res.find(r => r && r.error).error;
  } catch (e) {
    console.error(e);
    P.toast(t('prof2_reset_error'));
    return;
  }
  try { await PS_cancelReminders(); } catch (e) {}
  P.toast(t('prof2_reset_done'));
  setTimeout(() => { location.href = 'dashboard.html'; }, 1500);
}

init().catch(e => { console.error(e); document.getElementById('view').innerHTML = P.errorState(init); });
</script>
</body>
</html>
