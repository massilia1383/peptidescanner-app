<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PeptideScanner — Calculateur</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F4F7FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1424" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PeptideScanner">
<script>try{var _pst=localStorage.getItem('ps_theme');if(_pst==='light'||_pst==='dark')document.documentElement.dataset.theme=_pst}catch(e){}</script>
<link rel="stylesheet" href="/peptidescanner.css">
<script src="/lang.js"></script>
<script src="/assets/assets-bundle.js"></script>
<script src="/ps-app.js"></script>
<script src="/ps-calc.js"></script>
<style>
  /* Calculateur (kit Clarté, écran 06) — uniquement des jetons du kit */
  #view { display: contents; }
  #calc-error { display: grid; gap: 10px; }
  #calc-error:empty { display: none; }
  .calc-zoom .equipment { max-height: none; }
  .calc-zoom-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .calc-zoom-scroll > div { width: 780px; }
  details > p { margin-top: 4px; }
  /* Case du kit (22 px dessinés) avec une zone tactile de 44 × 44 px */
  #calc-confirm { appearance: none; -webkit-appearance: none; position: relative; width: 44px; height: 44px; flex: 0 0 44px;
    margin: -11px -6px -11px -11px; padding: 11px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; }
  #calc-confirm::before { content: ""; display: block; box-sizing: border-box; width: 22px; height: 22px;
    border: 2px solid var(--border-control); border-radius: 5px; background: var(--surface); }
  #calc-confirm:checked::before { background: var(--accent); border-color: var(--accent); }
  #calc-confirm:checked::after { content: ""; position: absolute; left: 19px; top: 14px; width: 6px; height: 11px;
    border: solid var(--on-accent); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
  #calc-confirm:focus-visible { outline: 2px solid var(--focus); outline-offset: -6px; }
  .checkline:has(#calc-confirm) { align-items: center; }
</style>
</head>
<body data-tab="inventory" data-back="inventaire.html">
<a class="sr-only" href="#main">Aller au contenu</a>
<div class="page">
  <header id="psHeader"></header>
  <main id="main" class="content" tabindex="-1">
    <div class="page-intro"><h1 data-i18n="calc2_title">Calculateur</h1><p class="muted small" data-i18n="calc2_sub">Vos valeurs, votre calcul</p></div>
    <div id="view"></div>
  </main>
  <nav id="psTabbar"></nav>
</div>

<script src="/vendor/supabase-2.117.3.umd.js"></script>
<script>
const SUPABASE_URL      = 'https://dkwztwlkjewdzfichkgk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrd3p0d2xramV3ZHpmaWNoa2drIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MjYwOTAsImV4cCI6MjA5NzQwMjA5MH0.iT7ylcNvPCf2jMUYfJlsDJcoGjPolphQWONFusAAlAk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const P = window.PS;   // outils communs (ps-app.js)
let userId = null;

/* ── État de la page ─────────────────────────────────────────────
   mode : '30' | '50' | '100' | 'cartridge'. Aucune dose n'est jamais
   pré-remplie : seuls la quantité du flacon et le volume ajouté peuvent
   venir du détail flacon (?mass=&water=&device=). */
const DEVICES = ['30', '50', '100', 'cartridge'];
const DEVICE_KEY = 'ps_calc_device';
let mode = '50';

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = P.esc;

function readDevicePref() {
  try { const v = localStorage.getItem(DEVICE_KEY); if (DEVICES.includes(v)) return v; } catch (e) {}
  return null;
}
function saveDevicePref(v) { try { localStorage.setItem(DEVICE_KEY, v); } catch (e) {} }

// Valeur d'URL acceptée seulement si c'est un nombre positif lisible (virgule ou point)
function urlNumber(v) {
  const s = String(v || '').trim().replace(',', '.');
  if (!/^\d{1,9}(\.\d{1,6})?$/.test(s) || !(Number(s) > 0)) return '';
  return P.lang() === 'en' ? s : s.replace('.', ',');
}

/* ── Dessins du matériel (textes des SVG traduits) ───────────────── */
function deviceKey(m) { return m === 'cartridge' ? 'cart' : m; }
function deviceSvg(m) {
  const holder = document.createElement('div');
  holder.innerHTML = P.asset(m === 'cartridge' ? 'cartridge-3ml' : 'syringe-' + m);
  const svg = holder.querySelector('svg');
  if (svg) {
    const k = deviceKey(m), label = t('calc2_svg_' + k);
    svg.setAttribute('aria-label', label);
    const ti = svg.querySelector('title'); if (ti) ti.textContent = label;
    // Légende sous le dessin (« U-100 · 0,5 ml · pas 1 U » / « Cartouche · capacité 3 ml »)
    const cap = $$('text', svg).find(x => /pas|Cartouche/.test(x.textContent));
    if (cap) cap.textContent = t('calc2_svgtxt_' + k);
  }
  return holder.innerHTML;
}
function vialSvg() {
  const holder = document.createElement('div');
  holder.innerHTML = P.asset('vial-half');
  const svg = holder.querySelector('svg');
  if (svg) {
    svg.setAttribute('aria-label', t('calc2_vial_aria'));
    const ti = svg.querySelector('title'); if (ti) ti.textContent = t('calc2_vial_aria');
  }
  return holder.innerHTML;
}

/* ── Rendu (structure exacte de la maquette « calculator ») ──────── */
function resultsInitial() {
  return '<div class="result-grid">' +
    '<div><p class="small muted">' + esc(t('calc2_r_conc')) + '</p><div class="measure-result">— <span class="unit">mg/ml</span></div></div>' +
    '<div><p class="small muted">' + esc(t('calc2_r_vol')) + '</p><div class="measure-result">— <span class="unit">ml</span></div></div>' +
    '<div><p class="small muted">' + esc(t('calc2_r_units')) + '</p><div class="measure-result">— <span class="unit">U</span></div></div>' +
    '</div><p class="help">' + esc(t('calc2_r_initial')) + '</p>';
}

function render(values) {
  values = values || {};
  const ph = 'placeholder="—" autocomplete="off"';
  const opts = DEVICES.map(v => [v, t('calc2_dev_' + deviceKey(v))]);
  let html = P.select(t('calc2_device'), 'calc-device', opts, mode);
  html += '<form id="calc-form" class="stack" novalidate>' +
    P.field(t('calc_f_mass'), 'calc-mass', 'mg', 'text', values.mass || '', '', ph) +
    P.field(t('calc_f_water'), 'calc-water', 'ml', 'text', values.water || '', t('calc2_h_water'), ph) +
    P.field(t('calc_f_dose'), 'calc-dose', 'mg', 'text', values.dose || '', t('calc2_h_dose'), ph);
  if (mode === 'cartridge') {
    html += P.field(t('calc_f_loaded'), 'calc-loaded', 'ml', 'text', values.loaded || '', t('calc2_h_loaded'), ph) +
      '<label class="checkline"><input id="calc-confirm" type="checkbox"' + (values.confirmed ? ' checked' : '') + '>' + esc(t('calc2_confirm')) + '</label>' +
      P.field(t('calc_f_step'), 'calc-step', 'U', 'text', values.step || '', t('calc2_h_step'), ph + (values.confirmed ? '' : ' disabled'));
  }
  html += '<button class="btn full" type="submit">' + esc(t('calc2_submit')) + '</button></form>' +
    '<div id="calc-error"></div>' +
    '<section class="card"><div class="eyebrow">' + esc(t('calc2_preview')) + '</div>' +
      '<div class="equipment-pair"><div>' + vialSvg() + '</div><div id="calc-svg">' + deviceSvg(mode) + '</div></div>' +
      '<button class="btn ghost full" type="button" id="calc-zoom">' + esc(t('calc2_zoom')) + '</button>' +
      '<p class="help" id="calc-figure-caption">' + esc(t('calc2_cap_initial')) + '</p></section>' +
    '<section class="card"><div id="calc-results" aria-live="polite">' + resultsInitial() + '</div></section>' +
    '<details><summary class="toggle-detail">' + esc(t('calc2_how')) + '</summary><p class="small muted">' + esc(t('calc2_how_text')) + '</p></details>';
  $('#view').innerHTML = html;
  bind();
  PS_applyI18n();
}

function currentValues() {
  const v = id => ($('#' + id) ? $('#' + id).value : '');
  return { mass: v('calc-mass'), water: v('calc-water'), dose: v('calc-dose'), loaded: v('calc-loaded'),
           step: v('calc-step'), confirmed: !!($('#calc-confirm') && $('#calc-confirm').checked) };
}

function resetFigure() { $('#calc-svg').innerHTML = deviceSvg(mode); }

/* ── Calcul (showCalculation du kit) ─────────────────────────────── */
function showCalculation(e) {
  if (e) e.preventDefault();
  const errorBox = $('#calc-error'), results = $('#calc-results'), caption = $('#calc-figure-caption');
  $$('#calc-form input').forEach(i => { i.removeAttribute('aria-invalid'); i.removeAttribute('aria-errormessage'); });
  errorBox.innerHTML = '';
  results.innerHTML = '<p class="muted">' + esc(t('calc2_r_computing')) + '</p>';
  resetFigure();
  try {
    const val = currentValues();
    const r = PS_CALC.calculate({
      mass: val.mass, water: val.water, dose: val.dose,
      mode: mode === 'cartridge' ? 'cartridge' : 'syringe',
      capacity: Number(mode) || 50,
      loadedVolume: val.loaded, confirmed: val.confirmed, unitStep: val.step
    });
    const cell = (label, value, unit, extra) => '<div><p class="small muted">' + esc(label) + '</p><div class="measure-result">' + esc(value) +
      (unit ? ' <span class="unit">' + unit + '</span>' : '') + '</div>' + (extra || '') + '</div>';
    results.innerHTML = '<div class="result-grid">' +
      cell(t('calc2_r_conc'), r.concentration, 'mg/ml') +
      cell(t('calc2_r_vol'), r.volume, 'ml') +
      cell(r.mode === 'cartridge' ? t('calc2_r_units_dev') : t('calc2_r_units_u100'), r.units === null ? t('calc2_r_not_conv') : r.units, r.units === null ? '' : 'U') +
      (r.completeDoses !== null ? cell(t('calc2_r_doses'), String(r.completeDoses), '', '<p class="help">' + esc(t('calc2_r_doses_help')) + '</p>') : '') +
      '</div>';

    let notes = '';
    if (r.overflow) {
      notes += P.notice(t('calc2_n_overflow'), 'error');
      if (r.alternatives.length) {
        const n = r.alternatives[0];
        notes += '<button class="btn secondary full" type="button" id="calc-larger" data-cap="' + n + '">' + esc(t('calc2_larger').replace('{n}', n)) + '</button>';
      } else {
        notes += P.notice(t('calc2_n_noalt'));
      }
      caption.textContent = t('calc2_cap_overflow');
    } else {
      const label = r.volume + ' ml' + (r.units ? ' · ' + r.units + ' U' : '');
      PS_updateLevel($('#calc-svg svg'), r.mode === 'cartridge' ? 'cartridge' : 'syringe', r.volumeValue, r.unitsValue, label);
      caption.textContent = r.mode === 'cartridge' ? t('calc2_cap_cart') : t('calc2_cap_syringe');
    }
    if (r.aligned === false) notes += P.notice(t('calc2_n_between'), 'warning');
    if (r.mode === 'cartridge' && r.units === null) notes += P.notice(t('calc2_n_scale'));
    errorBox.innerHTML = notes;
    const larger = $('#calc-larger');
    if (larger) larger.onclick = () => chooseLarger(larger.dataset.cap);
  } catch (err) {
    // Le moteur écrit « Libellé : message » ; en anglais, pas d'espace avant les deux-points
    const msg = P.lang() === 'en' ? String(err.message).replace(' : ', ': ') : String(err.message);
    errorBox.innerHTML = P.notice(msg, 'error');
    results.innerHTML = '<p class="muted">' + esc(t('calc2_r_none')) + '</p>';
    caption.textContent = t('calc2_cap_none');
    $$('#calc-form input:not([type=checkbox])').filter(x => !x.disabled).forEach(x => {
      x.setAttribute('aria-invalid', 'true'); x.setAttribute('aria-errormessage', 'calc-error');
    });
    $('#calc-mass').focus();
  }
}

// « Choisir une seringue N U » : on garde les valeurs et on relance le calcul
function chooseLarger(cap) {
  if (!DEVICES.includes(String(cap))) return;
  const keep = currentValues();
  mode = String(cap); saveDevicePref(mode);
  render({ mass: keep.mass, water: keep.water, dose: keep.dose });
  $('#calc-form').requestSubmit();
}

// Toute modification masque l'ancien résultat jusqu'au nouveau calcul
function invalidate(msgKey, captionKey) {
  $('#calc-results').innerHTML = '<p class="muted">' + esc(t(msgKey)) + '</p>';
  $('#calc-error').innerHTML = '';
  resetFigure();
  $('#calc-figure-caption').textContent = t(captionKey);
}

function openZoom() {
  const svg = $('#calc-svg svg');
  if (!svg) return;
  P.openSheet(t('calc2_zoom_title'),
    '<p class="small muted">' + esc(t('calc2_zoom_text')) + '</p>' +
    '<div class="calc-zoom calc-zoom-scroll" data-scroll-x tabindex="0" role="region" aria-label="' + esc(t('calc2_zoom_title')) + '"><div>' + svg.outerHTML + '</div></div>');
}

function bind() {
  $('#calc-form').addEventListener('submit', showCalculation);
  $('#calc-zoom').addEventListener('click', openZoom);
  $('#calc-device').addEventListener('change', e => {
    if (!DEVICES.includes(e.target.value)) return;
    const keep = currentValues();
    mode = e.target.value; saveDevicePref(mode);
    render({ mass: keep.mass, water: keep.water, dose: keep.dose, loaded: keep.loaded });
  });
  $('#calc-form').addEventListener('input', e => {
    if (e.target.type === 'checkbox') return;
    e.target.removeAttribute('aria-invalid'); e.target.removeAttribute('aria-errormessage');
    invalidate('calc2_r_changed', 'calc2_cap_editing');
  });
  const confirmBox = $('#calc-confirm');
  if (confirmBox) confirmBox.addEventListener('change', () => {
    $('#calc-step').disabled = !confirmBox.checked;
    $('#calc-results').innerHTML = '<p class="muted">' + esc(t('calc2_r_recheck')) + '</p>';
    resetFigure();
  });
}

/* ── Démarrage ───────────────────────────────────────────────────── */
PS_initShell();
document.title = 'PeptideScanner — ' + t('calc2_title');
document.documentElement.lang = P.lang() === 'en' ? 'en' : 'fr';
document.getElementById('view').innerHTML = P.skeleton();

async function init() {
  const session = await P.requireSession(sb);
  if (!session) return;
  userId = session.user.id;
  const { data: profil } = await sb.from('profiles').select('*').eq('id', userId).single();
  if (profil) PS_loadLangFromProfile(sb, userId, profil.lang);

  const params = new URLSearchParams(location.search);
  const urlDevice = params.get('device');
  mode = DEVICES.includes(urlDevice) ? urlDevice : (readDevicePref() || '50');
  render({ mass: urlNumber(params.get('mass')), water: urlNumber(params.get('water')) });
}
init().catch(e => { console.error(e); document.getElementById('view').innerHTML = P.errorState(init); });
</script>
</body>
</html>
