<script>
const SUPABASE_URL      = 'https://dkwztwlkjewdzfichkgk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrd3p0d2xramV3ZHpmaWNoa2drIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MjYwOTAsImV4cCI6MjA5NzQwMjA5MH0.iT7ylcNvPCf2jMUYfJlsDJcoGjPolphQWONFusAAlAk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const P = window.PS;   // outils communs (ps-app.js)
const MAIN = document.getElementById('main');
let userId = null, items = [], loaded = false;

PS_initShell();
MAIN.innerHTML = P.skeleton();

/* ─────────────────────────────────────────────────────────────
   Données de la table inventory (rien n'est « nettoyé ») :
   peptide_name, vial_qty_mg (mg), remaining_units (mg restants),
   bac_water_ml (eau ajoutée, ml), lot_number (fréquence de prise en texte),
   reconstituted_at (reconstitution, ou première utilisation d'un stylo),
   expiry_date (péremption, ou date limite après ouverture d'un stylo),
   notes : sealed|active|finished, temp:, days:, snote:, type:vial|pen-prefilled|pen-refillable,
           idose: (votre dose par injection, mg), pdose:, pleft:, pstep:, pscale:100, ploaded:
   ───────────────────────────────────────────────────────────── */
const KNOWN_TAGS = ['type', 'temp', 'days', 'snote', 'idose', 'pdose', 'pleft', 'pstep', 'pscale', 'ploaded'];
const FLAGS = ['sealed', 'active', 'finished'];

// Indications générales de conservation : jamais pré-remplies, seulement proposées
// (bouton « Utiliser cette indication »), sans aucune durée. À vérifier sur la notice.
const STORAGE_HINTS = {
  'bpc-157': 'light', 'tb-500': 'light', 'cjc-1295': 'heat', 'ipamorelin': 'freeze', 'ghrp-6': 'light',
  'ghrp-2': 'light', 'sermorelin': 'heat', 'semaglutide': '', 'tirzepatide': '', 'epithalon': '',
  'semax': 'heat', 'selank': 'heat', 'pt-141': 'light', 'aod-9604': '', 'thymosin alpha-1': 'light',
  'ghk-cu': '', 'hgh': 'heat', 'igf-1': '', 'mgf': 'heat', 'dsip': ''
};
function storageHint(name) {
  if (!name) return null;
  const key = String(name).toLowerCase().trim().normalize('NFD').replace(/[̀-ͯ]/g, '');
  if (!key) return null;
  let k = Object.prototype.hasOwnProperty.call(STORAGE_HINTS, key) ? key : null;
  if (!k) k = Object.keys(STORAGE_HINTS).find(x => key.includes(x) || (key.length >= 3 && x.includes(key))) || null;
  if (!k) return null;
  const n = STORAGE_HINTS[k];
  return { temp: '2-8 °C', note: n ? t('inv2_sn_' + n) : '' };
}

/* ── Petits outils de la page ───────────────────────────────── */
const esc = P.esc;
function tf(key, vars) { let s = t(key); Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); }); return s; }
function typeOf(it) { const v = P.getTag(it.notes, 'type'); return v === 'pen-prefilled' || v === 'pen-refillable' ? v : 'vial'; }
function flagOf(it) { const n = it.notes || ''; return P.hasFlag(n, 'finished') ? 'finished' : P.hasFlag(n, 'sealed') ? 'sealed' : 'active'; }
function capFirst(v) { const s = String(v || '').trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function numOrNull(v) { const n = parseFloat(v); return isFinite(n) ? n : null; }
function fmtMl(n) { return Number(n).toLocaleString(P.locale(), { minimumFractionDigits: 1, maximumFractionDigits: 2 }); }
function fmtLong(ds) { return P.fmtDate(ds, { day: 'numeric', month: 'long', year: 'numeric' }); }
function since(ds) {
  const n = P.dayIndex(psDay(ds), psDay(new Date()));
  if (n === 0) return t('inv2_today');
  if (n < 0) return t('inv2_future');
  return n === 1 ? t('inv2_ago_1') : tf('inv2_ago_n', { n: n });
}
function nameOf(it) {
  const n = capFirst(it.peptide_name);
  if (n) return n;
  const ty = typeOf(it);
  return ty === 'pen-prefilled' ? t('inv2_pen_pre') : ty === 'pen-refillable' ? t('inv2_pen_refill') : t('inv2_vial');
}
// Dessin du kit avec un nom accessible traduit
function art(html, label) {
  return html.replace(/aria-label="[^"]*"/, 'aria-label="' + esc(label) + '"').replace(/<title>[^<]*<\/title>/, '<title>' + esc(label) + '</title>');
}
function freeNote(notes) {
  return String(notes || '').split('|').map(s => s.trim()).filter(Boolean)
    .filter(s => FLAGS.indexOf(s) < 0 && !/^[a-z]+:/.test(s)).join(' · ');
}
// Recompose les notes : état + note libre + étiquettes inconnues conservées, puis étiquettes via P.setTag
function buildNotes(oldNotes, flag, note, tags) {
  const parts = String(oldNotes || '').split('|').map(s => s.trim()).filter(Boolean);
  const keepUnknown = parts.filter(s => /^[a-z]+:/.test(s) && KNOWN_TAGS.indexOf(s.split(':')[0]) < 0);
  const known = parts.filter(s => /^[a-z]+:/.test(s) && KNOWN_TAGS.indexOf(s.split(':')[0]) >= 0);
  const oldFlag = parts.find(s => FLAGS.indexOf(s) >= 0) || null;
  const f = flag === undefined ? oldFlag : flag;
  let out = [f, String(note || '').replace(/\|/g, '/').trim()].concat(keepUnknown, known).filter(Boolean).join('|');
  Object.keys(tags || {}).forEach(k => {
    const v = tags[k];
    out = P.setTag(out, k, (v === null || v === undefined) ? null : String(v).replace(/\|/g, '/').trim());
  });
  return out;
}

/* Estimations : uniquement à partir des valeurs saisies par l'utilisateur */
function vialInfo(it) {
  const qty = numOrNull(it.vial_qty_mg), water = numOrNull(it.bac_water_ml);
  const rem = it.remaining_units !== null && it.remaining_units !== undefined ? numOrNull(it.remaining_units) : qty;
  const flag = flagOf(it), sealed = flag === 'sealed';
  const frac = (qty && rem !== null) ? Math.max(0, Math.min(1, rem / qty)) : (flag === 'finished' ? 0 : null);
  const vol = (!sealed && qty && water && rem !== null) ? Math.max(0, rem / qty * water) : null;
  const idose = numOrNull(P.getTag(it.notes, 'idose')), freq = numOrNull(it.lot_number);
  let days = null, injLeft = null;
  if (!sealed && flag !== 'finished' && idose > 0 && freq > 0 && rem > 0) { injLeft = Math.floor(rem / idose); days = Math.round(injLeft / freq); }
  const expired = it.expiry_date ? psDay(it.expiry_date) < psDay(new Date()) : false;
  return { qty, water, rem, flag, sealed, frac, vol, idose, freq, days, injLeft, expired, low: frac !== null && frac > 0 && frac < 0.2 && !sealed };
}
function stateLabel(flag) { return flag === 'sealed' ? t('inv2_st_sealed') : flag === 'finished' ? t('inv2_st_finished') : t('inv2_st_recon'); }

/* ── Chargement ─────────────────────────────────────────────── */
async function init() {
  const session = await P.requireSession(sb);
  if (!session) return;
  userId = session.user.id;
  const { data: profil } = await sb.from('profiles').select('lang').eq('id', userId).single();
  if (profil) PS_loadLangFromProfile(sb, userId, profil.lang);
  await loadData();
}
async function loadData() {
  const { data, error } = await sb.from('inventory').select('*').eq('user_id', userId).order('created_at', { ascending: false });
  if (error) throw error;
  items = data || []; loaded = true;
  route();
}
function find(id) { return items.find(x => String(x.id) === String(id)); }

/* ── Routage par hash ───────────────────────────────────────── */
function parseHash() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  const m = /^(vial|pen|refill|add|edit)=(.+)$/.exec(h);
  return m ? { view: m[1], arg: m[2] } : { view: 'list', arg: null };
}
let lastView = '';
function route() {
  if (!loaded) return;
  P.closeSheet();
  const r = parseHash();
  let html = '';
  if (r.view === 'add') html = viewForm(null, r.arg);
  else if (r.view === 'list') html = viewList();
  else {
    const it = find(r.arg);
    if (!it) html = viewMissing();
    else if (r.view === 'edit') html = viewForm(it, typeOf(it));
    else {
      const ty = typeOf(it);   // la vue suit le type réel de l'élément
      html = ty === 'pen-prefilled' ? viewPen(it) : ty === 'pen-refillable' ? viewRefill(it) : viewVial(it);
    }
  }
  MAIN.innerHTML = html;
  afterRender(r);
  PS_applyI18n();
  const key = r.view + ':' + r.arg;
  if (key !== lastView) { window.scrollTo(0, 0); if (lastView) MAIN.focus({ preventScroll: true }); }
  lastView = key;
}
window.addEventListener('hashchange', route);

function intro(title, sub) {
  return '<div class="page-intro"><h1>' + esc(title) + '</h1>' + (sub ? '<p class="muted small">' + esc(sub) + '</p>' : '') + '</div>';
}
function backRow(href, label) {
  return '<div class="back-row"><a class="icon-btn" href="' + esc(href) + '" aria-label="' + esc(t('back') + ' · ' + label) + '">' + P.icon('chevron-left') +
    '</a><a class="back-label" href="' + esc(href) + '" tabindex="-1">' + esc(label) + '</a></div>';
}
function row(title, sub, ic) {
  return '<div class="list-row">' + (ic ? P.icon(ic) : '') + '<div class="grow"><strong>' + esc(title) + '</strong>' +
    (sub ? '<div class="muted small">' + esc(sub) + '</div>' : '') + '</div></div>';
}
function delButton(it) {
  return '<button class="btn ghost full del" type="button" data-act="delete" data-id="' + esc(it.id) + '">' + P.icon('trash') + esc(t('delete')) + '</button>';
}

/* ── 1. Liste (maquette inventory / empty-inventory) ───────── */
function viewList() {
  if (!items.length) {
    return intro(t('inv2_title')) +
      '<section class="card">' + P.empty(t('inv2_empty_title'), t('inv2_empty_text'), 'archive-box') + '</section>' +
      '<button class="btn full" type="button" data-act="add-sheet">' + esc(t('inv2_add_mine')) + '</button>';
  }
  return intro(t('inv2_title'), t('inv2_sub')) +
    '<button class="btn full" type="button" data-act="add-sheet">' + P.icon('plus') + esc(t('inv2_add')) + '</button>' +
    items.map(cardOf).join('') +
    '<a class="btn secondary full" href="calculateur.html">' + esc(t('inv2_open_calc')) + '</a>';
}
function cardOf(it) {
  const ty = typeOf(it), name = nameOf(it);
  if (ty === 'vial') {
    const v = vialInfo(it);
    let sub = v.flag === 'sealed' ? t('inv2_not_recon') : v.flag === 'finished' ? t('inv2_st_finished')
      : v.vol !== null ? tf('inv2_recon_ml', { v: fmtMl(v.vol) })
      : v.rem !== null && v.qty ? tf('inv2_recon_mg', { v: P.fmtNum(v.rem, 2) }) : t('inv2_st_recon');
    const pills = [];
    if (v.flag === 'active' && (v.vol !== null || (v.rem !== null && v.qty))) pills.push('<span class="pill">' + esc(t('inv2_estimate')) + '</span>');
    if (v.low && v.flag === 'active') pills.push('<span class="pill warn">' + esc(t('inv2_low')) + '</span>');
    if (v.expired && v.flag !== 'finished') pills.push('<span class="pill warn">' + esc(t('inv2_expired')) + '</span>');
    const vial = art(P.vialHtml(v.frac === null ? 0.5 : v.frac, v.sealed, 'material-mini'), t('inv2_vial'));
    return '<section class="card inv-card" data-href="#vial=' + esc(it.id) + '"><div class="row">' + vial +
      '<div class="grow"><h2>' + esc(name) + '</h2><p class="small muted">' + esc(sub) + '</p>' +
      (pills.length ? '<div class="pills">' + pills.join('') + '</div>' : '') + '</div>' +
      '<a class="icon-btn" href="#vial=' + esc(it.id) + '" aria-label="' + esc(tf('inv2_detail_of', { n: name })) + '">' + P.icon('chevron-right') + '</a></div></section>';
  }
  const pre = ty === 'pen-prefilled';
  const typeLabel = pre ? t('inv2_pen_pre') : t('inv2_pen_refill');
  const sub2 = pre ? t('inv2_pen_pre_sub') : t('inv2_pen_refill_sub');
  const hasName = !!capFirst(it.peptide_name);
  const href = (pre ? '#pen=' : '#refill=') + it.id;
  return '<section class="card inv-card" data-href="' + esc(href) + '" data-pen="' + esc(it.id) + '">' +
    art(P.asset(pre ? 'pen-prefilled' : 'pen-refillable'), typeLabel) +
    '<div class="row between"><div class="grow"><h2>' + esc(name) + '</h2><p class="small muted">' +
    esc(hasName ? typeLabel + ' · ' + sub2 : sub2) + '</p></div>' +
    '<a class="icon-btn" href="' + esc(href) + '" aria-label="' + esc(tf('inv2_detail_of', { n: name })) + '">' + P.icon('chevron-right') + '</a></div></section>';
}
function openAddSheet() {
  P.openSheet(t('inv2_add'),
    '<a class="btn secondary full" href="#add=vial">' + esc(t('inv2_vial')) + '</a>' +
    '<a class="btn secondary full" href="#add=pen-prefilled">' + esc(t('inv2_pen_pre')) + '</a>' +
    '<a class="btn secondary full" href="#add=pen-refillable">' + esc(t('inv2_pen_refill')) + '</a>');
}

function viewMissing() {
  return backRow('#', t('inv2_title')) + intro(t('inv2_title')) +
    '<section class="card">' + P.empty(t('inv2_missing_title'), t('inv2_missing_text'), 'archive-box') + '</section>' +
    '<a class="btn full" href="#">' + esc(t('inv2_back_list')) + '</a>';
}

/* ── 2. Détail du flacon (maquette vial) ───────────────────── */
function viewVial(it) {
  const v = vialInfo(it), name = nameOf(it);
  const stage = '<div class="equipment-stage">' + art(P.vialHtml(v.frac === null ? 0 : v.frac, v.sealed, 'equipment'),
    v.sealed ? t('inv2_vial_powder') : tf('inv2_vial_level', { p: v.frac === null ? '—' : Math.round(v.frac * 100) })) + '</div>';
  const volHtml = v.sealed ? '<h2>' + esc(t('inv2_not_recon')) + '</h2>'
    : v.vol !== null ? '<div class="number big-number">' + esc(fmtMl(v.vol)) + ' <span class="unit">ml</span></div>'
    : '<h2>' + esc(t('inv2_not_set_m')) + '</h2>';
  const pill = '<span class="pill">' + esc(stateLabel(v.flag)) + '</span>';
  const help = v.sealed ? t('inv2_help_sealed') : v.vol === null && !v.water ? t('inv2_help_nowater') : t('inv2_help_vol');
  const card1 = '<section class="card detail-card">' + stage +
    '<div class="row between vol-row"><div><div class="small muted">' + esc(t('inv2_vol_left')) + '</div>' + volHtml + '</div>' + pill + '</div>' +
    (!v.sealed && v.frac !== null ? P.progress(v.frac * 100, t('inv2_vol_left')) : '') +
    '<p class="help">' + esc(help) + '</p></section>';

  // Conservation : uniquement ce que l'utilisateur a saisi (étiquettes temp:, days:, snote:)
  const temp = P.getTag(it.notes, 'temp'), sdays = P.getTag(it.notes, 'days'), snote = P.getTag(it.notes, 'snote');
  const cons = [temp, snote, sdays ? tf('inv2_days_notice', { n: sdays }) : ''].filter(Boolean);
  const consTxt = cons.length ? cons.join(' · ') + ' · ' + t('inv2_personal') : t('inv2_from_notice');
  const qtyTxt = v.qty ? tf('inv2_qty_of', { r: P.fmtNum(v.rem, 3), q: P.fmtNum(v.qty, 3) }) : t('inv2_qty_none');
  const exp = it.expiry_date ? fmtLong(it.expiry_date) + (v.expired ? ' · ' + t('inv2_date_passed') : '') : t('inv2_not_set_f');
  const daysTxt = v.days !== null ? tf('inv2_days_est', { d: v.days, n: v.injLeft }) : t('inv2_days_none');
  const rows = row(t('inv2_recon_on'), it.reconstituted_at && !v.sealed ? fmtLong(it.reconstituted_at) : t('inv2_not_recon'), 'calendar-days') +
    row(t('inv2_qty_left'), qtyTxt, 'beaker') +
    row(t('inv2_storage'), consTxt, 'archive-box') +
    row(t('inv2_expiry'), exp, 'calendar-days') +
    row(t('inv2_days_left'), daysTxt, 'clock');
  const calcHref = 'calculateur.html' + (v.qty || v.water ? '?' + [v.qty ? 'mass=' + encodeURIComponent(v.qty) : '', v.water ? 'water=' + encodeURIComponent(v.water) : ''].filter(Boolean).join('&') : '');
  return backRow('#', t('inv2_title')) + intro(name, t('inv2_vial_sub')) + card1 +
    (v.low ? P.notice(t('inv2_low_notice'), 'warning') : '') +
    '<section class="card">' + rows + '</section>' +
    '<a class="btn secondary full" href="#edit=' + esc(it.id) + '">' + esc(t('inv2_edit_vial')) + '</a>' +
    '<a class="btn full" href="' + esc(calcHref) + '">' + esc(t('inv2_recon_calc')) + '</a>' +
    P.notice(t('inv2_storage_notice')) + delButton(it);
}

/* ── 3. Stylo prérempli (maquette pen) ─────────────────────── */
function viewPen(it) {
  const name = nameOf(it), pdose = P.getTag(it.notes, 'pdose'), pleft = P.getTag(it.notes, 'pleft');
  const first = it.reconstituted_at ? fmtLong(it.reconstituted_at) + ' · ' + since(it.reconstituted_at) : t('inv2_not_set_f');
  const limit = it.expiry_date ? fmtLong(it.expiry_date) + (psDay(it.expiry_date) < psDay(new Date()) ? ' · ' + t('inv2_date_passed') : '') : t('inv2_from_notice');
  return backRow('#', t('inv2_title')) + intro(name, t('inv2_pen_sub')) +
    '<section class="card detail-card" data-pen="' + esc(it.id) + '">' + art(P.asset('pen-prefilled'), t('inv2_pen_pre') + (pdose ? ' · ' + pdose : '')) +
    '<div class="readout"><span class="small muted">' + esc(t('inv2_pen_dose')) + '</span><h2>' + esc(pdose || t('inv2_not_set_f')) + '</h2></div></section>' +
    '<section class="card">' +
      row(t('inv2_first_use'), first, 'calendar-days') +
      row(t('inv2_doses_left'), pleft ? tf('inv2_doses_decl', { n: pleft }) : t('inv2_not_set_fp'), 'archive-box') +
      row(t('inv2_limit_open'), limit, 'clock') + '</section>' +
    P.notice(t('inv2_needle'), 'warning') +
    '<button class="btn full" type="button" data-act="pen-sheet" data-id="' + esc(it.id) + '">' + esc(t('inv2_fill_track')) + '</button>' +
    P.notice(t('inv2_no_conv')) +
    '<a class="btn ghost full" href="#edit=' + esc(it.id) + '">' + P.icon('pencil-square') + esc(t('inv2_edit_name')) + '</a>' + delButton(it);
}
function openPenSheet(it) {
  P.openSheet(t('inv2_pen_sheet'),
    P.field(t('inv2_f_pdose'), 'sDose', '', 'text', P.getTag(it.notes, 'pdose') || '', t('inv2_h_pdose'), 'placeholder="—" maxlength="24"') +
    P.field(t('inv2_f_pleft'), 'sLeft', '', 'text', P.getTag(it.notes, 'pleft') || '', '', 'inputmode="numeric" placeholder="—"') +
    P.field(t('inv2_first_use'), 'sFirst', '', 'date', it.reconstituted_at ? String(it.reconstituted_at).slice(0, 10) : '') +
    P.field(t('inv2_limit_open'), 'sLimit', '', 'date', it.expiry_date ? String(it.expiry_date).slice(0, 10) : '', t('inv2_h_limit')) +
    '<button class="btn full" type="button" id="sSave">' + esc(t('save')) + '</button>',
    d => { d.querySelector('#sSave').onclick = () => savePenSheet(it, d); });
}
async function savePenSheet(it, d) {
  clearErrors(d);
  const left = d.querySelector('#sLeft').value.trim();
  if (left && !/^\d{1,4}$/.test(left)) { setErr(d.querySelector('#sLeft'), t('inv2_err_int')); return; }
  const notes = buildNotes(it.notes, undefined, freeNote(it.notes), { pdose: d.querySelector('#sDose').value, pleft: left });
  const payload = { notes, reconstituted_at: d.querySelector('#sFirst').value || null, expiry_date: d.querySelector('#sLimit').value || null };
  await writeUpdate(it, payload, d.querySelector('#sSave'));
}

/* ── 4. Stylo rechargeable (maquette refill-pen) ───────────── */
function viewRefill(it) {
  const name = nameOf(it);
  const loadedMl = numOrNull(P.getTag(it.notes, 'ploaded'));
  const scaleOk = P.getTag(it.notes, 'pscale') === '100';
  const step = P.getTag(it.notes, 'pstep');
  const okLoaded = loadedMl !== null && loadedMl > 0 && loadedMl <= 3;
  const unitsTxt = scaleOk ? (okLoaded ? tf('inv2_units_conf_l', { u: P.fmtNum(loadedMl * 100, 1) }) : t('inv2_units_conf')) : t('inv2_not_set_fp');
  const first = it.reconstituted_at ? fmtLong(it.reconstituted_at) + ' · ' + since(it.reconstituted_at) : t('inv2_not_set_f');
  const calcHref = 'calculateur.html?device=cartridge' + (okLoaded ? '&loaded=' + encodeURIComponent(loadedMl) : '');
  return backRow('#', t('inv2_title')) + intro(name, t('inv2_refill_sub')) +
    '<section class="card detail-card" data-refill="' + esc(it.id) + '" data-loaded="' + (okLoaded ? loadedMl : '') + '">' +
      art(P.asset('pen-refillable'), t('inv2_pen_refill')) +
      '<div class="row between vol-row"><div><div class="small muted">' + esc(t('inv2_loaded')) + '</div><h2>' +
        esc(okLoaded ? fmtMl(loadedMl) + ' ml' : t('inv2_to_fill')) + '</h2></div><span class="pill">' + esc(t('inv2_cap3')) + '</span></div>' +
      (okLoaded ? art(P.asset('cartridge-3ml', 'equipment cart-level'), tf('inv2_cart_aria', { v: fmtMl(loadedMl) })).replace('Cartouche · capacité 3 ml', esc(t('inv2_cart_cap'))) : '') +
      (loadedMl !== null && !okLoaded ? P.notice(t('calc_err_loaded_cap'), 'error') : '') +
    '</section>' +
    '<section class="card">' +
      row(t('inv2_units_shown'), unitsTxt, 'adjustments-horizontal') +
      row(t('inv2_step'), step ? tf('inv2_step_decl', { n: step }) : t('inv2_step_none'), 'information-circle') +
      row(t('inv2_first_use'), first, 'calendar-days') + '</section>' +
    P.notice(t('inv2_cap_notice')) +
    '<button class="btn secondary full" type="button" data-act="refill-sheet" data-id="' + esc(it.id) + '">' + esc(t('inv2_fill_pen')) + '</button>' +
    '<a class="btn full" href="' + esc(calcHref) + '">' + esc(t('inv2_calc_cart')) + '</a>' +
    '<a class="btn ghost full" href="#edit=' + esc(it.id) + '">' + P.icon('pencil-square') + esc(t('inv2_edit_name')) + '</a>' + delButton(it);
}
function refillFields(it, pre) {
  const scaleOk = it ? P.getTag(it.notes, 'pscale') === '100' : false;
  return P.field(t('inv2_f_loaded'), pre + 'Loaded', 'ml', 'text', it ? (P.getTag(it.notes, 'ploaded') || '') : '', t('inv2_h_loaded'), 'placeholder="—"') +
    '<label class="checkline"><input type="checkbox" id="' + pre + 'Scale"' + (scaleOk ? ' checked' : '') + '><span>' + esc(t('inv2_f_scale')) + '</span></label>' +
    P.field(t('inv2_f_step'), pre + 'Step', 'U', 'text', it ? (P.getTag(it.notes, 'pstep') || '') : '', t('inv2_h_step'), 'placeholder="—"' + (scaleOk ? '' : ' disabled'));
}
function bindScale(root, pre) {
  const cb = root.querySelector('#' + pre + 'Scale'), st = root.querySelector('#' + pre + 'Step');
  if (cb && st) cb.onchange = () => { st.disabled = !cb.checked; };
}
function readRefill(root, pre) {
  const lRaw = root.querySelector('#' + pre + 'Loaded').value.trim();
  const sRaw = root.querySelector('#' + pre + 'Step').value.trim();
  const scale = root.querySelector('#' + pre + 'Scale').checked;
  let ok = true;
  const l = P.num(lRaw), s = P.num(sRaw);
  if (lRaw && !(l > 0)) { setErr(root.querySelector('#' + pre + 'Loaded'), t('inv2_err_pos')); ok = false; }
  else if (lRaw && l > 3) { setErr(root.querySelector('#' + pre + 'Loaded'), t('calc_err_loaded_cap')); ok = false; }
  if (scale && sRaw && !(s > 0)) { setErr(root.querySelector('#' + pre + 'Step'), t('inv2_err_pos')); ok = false; }
  return ok ? { ploaded: lRaw ? String(l) : null, pscale: scale ? '100' : null, pstep: scale && sRaw ? String(s) : null } : null;
}
function openRefillSheet(it) {
  P.openSheet(t('inv2_refill_sheet'),
    refillFields(it, 's') +
    P.field(t('inv2_first_use'), 'sFirst', '', 'date', it.reconstituted_at ? String(it.reconstituted_at).slice(0, 10) : '') +
    '<button class="btn full" type="button" id="sSave">' + esc(t('save')) + '</button>',
    d => { bindScale(d, 's'); d.querySelector('#sSave').onclick = () => saveRefillSheet(it, d); });
}
async function saveRefillSheet(it, d) {
  clearErrors(d);
  const tags = readRefill(d, 's'); if (!tags) return;
  const payload = { notes: buildNotes(it.notes, undefined, freeNote(it.notes), tags), reconstituted_at: d.querySelector('#sFirst').value || null };
  await writeUpdate(it, payload, d.querySelector('#sSave'));
}

/* ── 5. Formulaire d'ajout / modification ──────────────────── */
const FREQS = [['', 'inv2_fq_none'], ['3', 'inv2_fq_3'], ['2', 'inv2_fq_2'], ['1', 'inv2_fq_1'], ['0.5', 'inv2_fq_05'], ['0.28', 'inv2_fq_028'], ['0.14', 'inv2_fq_014']];
function viewForm(it, type) {
  type = ['vial', 'pen-prefilled', 'pen-refillable'].indexOf(type) >= 0 ? type : 'vial';
  const edit = !!it;
  const back = edit ? (type === 'pen-prefilled' ? '#pen=' : type === 'pen-refillable' ? '#refill=' : '#vial=') + it.id : '#';
  const backLabel = edit ? nameOf(it) : t('inv2_title');
  const titles = { vial: edit ? 'inv2_t_edit_vial' : 'inv2_t_add_vial', 'pen-prefilled': edit ? 'inv2_t_edit_pen' : 'inv2_t_add_pen', 'pen-refillable': edit ? 'inv2_t_edit_refill' : 'inv2_t_add_refill' };
  const g = k => it ? (P.getTag(it.notes, k) || '') : '';
  const dateVal = v => v ? String(v).slice(0, 10) : '';
  const nameField = P.field(type === 'vial' ? t('inv2_f_name') : t('inv2_f_name_pen'), 'fName', '', 'text', it ? (it.peptide_name || '') : '', '', 'autocomplete="off" maxlength="60" required');
  const noteField = '<div class="field"><label class="label" for="fNote">' + esc(t('inv2_f_note')) + '</label><textarea class="textarea" id="fNote" rows="3" maxlength="300">' + esc(it ? freeNote(it.notes) : '') + '</textarea></div>';
  let body = '';
  if (type === 'vial') {
    const flag = it ? flagOf(it) : 'active';
    const freq = it && it.lot_number ? String(it.lot_number) : '';
    const fopts = FREQS.map(f => [f[0], t(f[1])]);
    if (freq && !fopts.some(f => f[0] === freq)) fopts.push([freq, tf('inv2_fq_other', { v: freq })]);
    body =
      '<section class="card form-card"><h2>' + esc(t('inv2_sec_vial')) + '</h2>' + nameField +
        '<div class="grid2">' +
          P.field(t('inv2_f_qty'), 'fQty', 'mg', 'text', it && it.vial_qty_mg !== null ? it.vial_qty_mg : '', '', 'placeholder="—"') +
          P.field(t('inv2_f_water'), 'fWater', 'ml', 'text', it && it.bac_water_ml !== null ? it.bac_water_ml : '', '', 'placeholder="—"') +
        '</div>' +
        (edit ? P.field(t('inv2_f_rem'), 'fRem', 'mg', 'text', it.remaining_units !== null && it.remaining_units !== undefined ? it.remaining_units : '', t('inv2_h_rem'), 'placeholder="—"') : '') +
        '<p class="help">' + esc(t('inv2_h_water')) + '</p>' +
        P.select(t('inv2_f_status'), 'fStatus', [['sealed', t('inv2_st_sealed')], ['active', t('inv2_st_active')], ['finished', t('inv2_st_finished')]], flag) +
        '<div id="fReconWrap"' + (flag === 'sealed' ? ' class="hidden"' : '') + '>' +
          P.field(t('inv2_f_recon'), 'fRecon', '', 'date', it ? dateVal(it.reconstituted_at) : psDayStr()) + '</div>' +
        P.field(t('inv2_expiry'), 'fExpiry', '', 'date', it ? dateVal(it.expiry_date) : '') +
      '</section>' +
      '<section class="card form-card"><h2>' + esc(t('inv2_sec_storage')) + '</h2>' +
        '<p class="help">' + esc(t('inv2_h_storage')) + '</p>' +
        P.field(t('inv2_f_temp'), 'fTemp', '', 'text', g('temp'), '', 'placeholder="—" maxlength="40"') +
        P.field(t('inv2_f_snote'), 'fSnote', '', 'text', g('snote'), '', 'placeholder="—" maxlength="120"') +
        P.field(t('inv2_f_sdays'), 'fSdays', t('days'), 'text', g('days'), t('inv2_h_sdays'), 'placeholder="—" inputmode="numeric"') +
        '<div id="fSuggest"></div>' +
      '</section>' +
      '<section class="card form-card"><h2>' + esc(t('inv2_sec_yours')) + '</h2>' +
        '<p class="help">' + esc(t('inv2_h_yours')) + '</p>' +
        P.field(t('inv2_f_idose'), 'fIdose', 'mg', 'text', g('idose'), '', 'placeholder="—"') +
        P.select(t('inv2_f_freq'), 'fFreq', fopts, freq) +
      '</section>';
  } else {
    const pre = type === 'pen-prefilled';
    body = '<section class="card form-card"><h2>' + esc(pre ? t('inv2_pen_pre') : t('inv2_pen_refill')) + '</h2>' + nameField +
      (pre
        ? P.field(t('inv2_f_pdose'), 'fPdose', '', 'text', g('pdose'), t('inv2_h_pdose'), 'placeholder="—" maxlength="24"') +
          P.field(t('inv2_f_pleft'), 'fPleft', '', 'text', g('pleft'), '', 'inputmode="numeric" placeholder="—"')
        : refillFields(it, 'f')) +
      P.field(t('inv2_first_use'), 'fFirst', '', 'date', it ? dateVal(it.reconstituted_at) : '') +
      P.field(t('inv2_limit_open'), 'fLimit', '', 'date', it ? dateVal(it.expiry_date) : '', t('inv2_h_limit')) +
      '</section>' + P.notice(pre ? t('inv2_no_conv') : t('inv2_cap_notice'));
  }
  return backRow(back, backLabel) + intro(t(titles[type])) +
    '<form id="invForm" class="stack" novalidate data-type="' + type + '" data-id="' + (it ? esc(it.id) : '') + '">' + body +
    '<section class="card form-card">' + noteField + '</section>' +
    '<div id="fError"></div>' +
    '<button class="btn full" type="submit" id="fSave">' + esc(t('save')) + '</button>' +
    '<a class="btn secondary full" href="' + esc(back) + '">' + esc(t('cancel')) + '</a></form>';
}
function updateSuggest() {
  const box = document.getElementById('fSuggest'); if (!box) return;
  const name = document.getElementById('fName').value;
  const hint = storageHint(name);
  const temp = document.getElementById('fTemp').value.trim(), snote = document.getElementById('fSnote').value.trim();
  if (!hint || (temp && (!hint.note || snote))) { box.innerHTML = ''; return; }
  const txt = tf('inv2_suggest', { n: capFirst(name.trim()), v: [hint.temp, hint.note].filter(Boolean).join(' · ') });
  box.innerHTML = '<div class="suggest">' + P.notice(txt) +
    '<button class="btn secondary full" type="button" data-act="use-hint">' + esc(t('inv2_use_hint')) + '</button></div>';
}
function useHint() {
  const hint = storageHint(document.getElementById('fName').value); if (!hint) return;
  const tEl = document.getElementById('fTemp'), nEl = document.getElementById('fSnote');
  if (!tEl.value.trim()) tEl.value = hint.temp;
  if (hint.note && !nEl.value.trim()) nEl.value = hint.note;
  updateSuggest();
  P.toast(t('inv2_hint_used'));
}

function clearErrors(root) {
  root.querySelectorAll('[aria-invalid]').forEach(e => e.removeAttribute('aria-invalid'));
  root.querySelectorAll('.error-text').forEach(e => e.remove());
}
function setErr(input, msg) {
  if (!input) return;
  input.setAttribute('aria-invalid', 'true');
  const id = input.id + '-err';
  const p = document.createElement('p'); p.className = 'error-text'; p.id = id; p.textContent = msg;
  const wrap = input.closest('.input-wrap') || input;
  wrap.insertAdjacentElement('afterend', p);
  input.setAttribute('aria-errormessage', id);
}
function readPos(form, id, opts) {
  const el = form.querySelector('#' + id); if (!el) return { ok: true, v: undefined };
  const raw = el.value.trim();
  if (!raw) return { ok: true, v: null };
  const n = P.num(raw);
  if (!isFinite(n) || n < 0 || (!(opts && opts.zero) && n === 0)) { setErr(el, t('inv2_err_pos')); return { ok: false }; }
  return { ok: true, v: n };
}

async function submitForm(form) {
  clearErrors(form);
  document.getElementById('fError').innerHTML = '';
  const type = form.dataset.type, id = form.dataset.id, it = id ? find(id) : null;
  const name = form.querySelector('#fName').value.trim();
  let ok = true;
  if (!name) { setErr(form.querySelector('#fName'), t('inv2_err_name')); ok = false; }
  const note = form.querySelector('#fNote').value;
  let payload;
  if (type === 'vial') {
    const qty = readPos(form, 'fQty'), water = readPos(form, 'fWater'), rem = readPos(form, 'fRem', { zero: true }), idose = readPos(form, 'fIdose');
    const sdRaw = form.querySelector('#fSdays').value.trim();
    if (sdRaw && !/^\d{1,4}$/.test(sdRaw)) { setErr(form.querySelector('#fSdays'), t('inv2_err_int')); ok = false; }
    ok = ok && qty.ok && water.ok && rem.ok && idose.ok;
    if (ok && rem.v !== null && rem.v !== undefined && qty.v && rem.v > qty.v) { setErr(form.querySelector('#fRem'), t('inv2_err_rem')); ok = false; }
    if (ok && idose.v && qty.v && idose.v > qty.v) { setErr(form.querySelector('#fIdose'), t('calc_err_dose_gt')); ok = false; }
    if (!ok) return focusErr(form);
    const status = form.querySelector('#fStatus').value;
    const recon = status === 'sealed' ? null : (form.querySelector('#fRecon').value || null);
    const freq = form.querySelector('#fFreq').value;
    const tags = { temp: form.querySelector('#fTemp').value, snote: form.querySelector('#fSnote').value, days: sdRaw || null, idose: idose.v ? String(idose.v) : null };
    if (!it) tags.type = 'vial';
    payload = {
      peptide_name: name, vial_qty_mg: qty.v, bac_water_ml: water.v, lot_number: freq || null,
      reconstituted_at: recon, expiry_date: form.querySelector('#fExpiry').value || null,
      notes: buildNotes(it ? it.notes : '', status, note, tags)
    };
    if (!it) payload.remaining_units = qty.v;                       // nouveau flacon : plein
    else if (rem.v !== undefined && rem.v !== null) payload.remaining_units = rem.v;
  } else {
    let tags;
    if (type === 'pen-prefilled') {
      const left = form.querySelector('#fPleft').value.trim();
      if (left && !/^\d{1,4}$/.test(left)) { setErr(form.querySelector('#fPleft'), t('inv2_err_int')); ok = false; }
      tags = { pdose: form.querySelector('#fPdose').value, pleft: left };
    } else {
      tags = readRefill(form, 'f'); if (!tags) ok = false;
    }
    if (!ok) return focusErr(form);
    tags.type = type;
    payload = {
      peptide_name: name, reconstituted_at: form.querySelector('#fFirst').value || null,
      expiry_date: form.querySelector('#fLimit').value || null, notes: buildNotes(it ? it.notes : '', undefined, note, tags)
    };
    if (!it) Object.assign(payload, { vial_qty_mg: null, remaining_units: null, bac_water_ml: null, lot_number: null });
  }
  const btn = form.querySelector('#fSave');
  btn.disabled = true; btn.setAttribute('aria-busy', 'true');
  try {
    let res;
    if (it) res = await sb.from('inventory').update(payload).eq('id', it.id);
    else res = await sb.from('inventory').insert(Object.assign({ user_id: userId }, payload)).select().single();
    if (res && res.error) throw res.error;
    const newId = it ? it.id : (res && res.data && res.data.id);
    P.toast(t(it ? 'inv2_saved' : 'inv2_added'));
    await reloadThen(newId ? (type === 'pen-prefilled' ? '#pen=' : type === 'pen-refillable' ? '#refill=' : '#vial=') + newId : '#');
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.removeAttribute('aria-busy');
    document.getElementById('fError').innerHTML = P.notice(t('msg_save_error'), 'error');
  }
}
function focusErr(form) { const e = form.querySelector('[aria-invalid=true]'); if (e) e.focus(); }

async function writeUpdate(it, payload, btn) {
  if (btn) { btn.disabled = true; btn.setAttribute('aria-busy', 'true'); }
  try {
    const res = await sb.from('inventory').update(payload).eq('id', it.id);
    if (res && res.error) throw res.error;
    Object.assign(it, payload);   // affichage immédiat
    P.closeSheet();
    P.toast(t('inv2_saved'));
    route();
    loadData().catch(() => {});
  } catch (e) {
    console.error(e);
    if (btn) { btn.disabled = false; btn.removeAttribute('aria-busy'); }
    P.toast(t('msg_save_error'));
  }
}
async function reloadThen(hash) {
  try { await loadDataQuiet(); } catch (e) {}
  if (('#' + location.hash.replace(/^#/, '')) === hash || (hash === '#' && !location.hash)) route(); else location.hash = hash;
}
async function loadDataQuiet() {
  const { data, error } = await sb.from('inventory').select('*').eq('user_id', userId).order('created_at', { ascending: false });
  if (!error && data) items = data;
}

/* Suppression : confirmation du kit, puis « Annuler » dans le toast (réinsertion de la ligne) */
async function deleteItem(id) {
  const it = find(id); if (!it) return;
  const ok = await P.confirm({ title: t('inv2_del_title'), text: tf('inv2_del_text', { n: nameOf(it) }), ok: t('delete'), cancel: t('inv2_keep'), danger: true });
  if (!ok) return;
  const res = await sb.from('inventory').delete({}).eq('id', it.id);
  if (res && res.error) { P.toast(t('msg_save_error')); return; }
  const copy = Object.assign({}, it);
  items = items.filter(x => x !== it);
  if (location.hash) location.hash = ''; else route();
  P.toast(t('inv2_deleted'), async () => {
    await sb.from('inventory').insert(copy);
    await loadDataQuiet(); route();
  });
}

/* ── Après rendu : niveaux et fenêtres des dessins ─────────── */
function afterRender(r) {
  // Fenêtre du stylo prérempli : uniquement la valeur saisie (aucune conversion)
  MAIN.querySelectorAll('[data-pen]').forEach(el => {
    const it = find(el.dataset.pen); if (!it) return;
    const v = P.getTag(it.notes, 'pdose'), lab = el.querySelector('[data-part="pen-dose-label"]');
    if (lab && v && v.length <= 7) lab.textContent = v;
  });
  // Rechargeable : niveau de la cartouche = volume chargé déclaré (aucun niveau inventé)
  MAIN.querySelectorAll('.inv-card, [data-refill]').forEach(el => {
    const fill = el.querySelector('[data-part="pen-cartridge-liquid-fill"]'); if (!fill) return;
    const id = el.dataset.refill || (el.dataset.href || '').split('=')[1];
    const it = find(id); const l = it ? numOrNull(P.getTag(it.notes, 'ploaded')) : null;
    fill.setAttribute('width', (l > 0 && l <= 3) ? 125 * l / 3 : 0);
  });
  MAIN.querySelectorAll('[data-refill]').forEach(el => {
    const l = numOrNull(el.dataset.loaded), svg = el.querySelector('svg.cart-level');
    if (svg && l > 0) PS_updateLevel(svg, 'cartridge', l, null, tf('inv2_cart_label', { v: fmtMl(l) }));
  });
  if (r.view === 'add' || r.view === 'edit') {
    const form = document.getElementById('invForm'); if (!form) return;
    form.addEventListener('submit', e => { e.preventDefault(); submitForm(form); });
    if (form.dataset.type === 'vial') {
      ['fName', 'fTemp', 'fSnote'].forEach(id => form.querySelector('#' + id).addEventListener('input', updateSuggest));
      form.querySelector('#fStatus').addEventListener('change', e => {
        const w = document.getElementById('fReconWrap'); w.classList.toggle('hidden', e.target.value === 'sealed');
        const rc = document.getElementById('fRecon'); if (e.target.value !== 'sealed' && !rc.value) rc.value = psDayStr();
      });
      updateSuggest();
    } else if (form.dataset.type === 'pen-refillable') bindScale(form, 'f');
  }
}

/* ── Actions (délégation) ───────────────────────────────────── */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) {
    const act = a.dataset.act, it = a.dataset.id ? find(a.dataset.id) : null;
    if (act === 'add-sheet') openAddSheet();
    else if (act === 'delete') deleteItem(a.dataset.id);
    else if (act === 'pen-sheet' && it) openPenSheet(it);
    else if (act === 'refill-sheet' && it) openRefillSheet(it);
    else if (act === 'use-hint') useHint();
    return;
  }
  const card = e.target.closest('.inv-card[data-href]');
  if (card && !e.target.closest('a,button')) location.hash = card.dataset.href;
});

init().catch(e => { console.error(e); MAIN.innerHTML = P.errorState(() => { MAIN.innerHTML = P.skeleton(); init().catch(() => { MAIN.innerHTML = P.errorState(); }); }); PS_applyI18n(); });

// Retour sur la page (depuis Cure par exemple) : stock relu, saisie en cours préservée
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !userId) return;
  const v = parseHash().view;
  if (v === 'add' || v === 'edit' || document.querySelector('dialog[open]')) return;
  loadData().catch(() => {});
});
</script>
