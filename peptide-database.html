<script src="/vendor/supabase-2.117.3.umd.js"></script>
<script>
const SUPABASE_URL      = 'https://dkwztwlkjewdzfichkgk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrd3p0d2xramV3ZHpmaWNoa2drIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MjYwOTAsImV4cCI6MjA5NzQwMjA5MH0.iT7ylcNvPCf2jMUYfJlsDJcoGjPolphQWONFusAAlAk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const P = window.PS;   // outils communs (ps-app.js)
let userId = null;

// Ordre d'affichage des catégories et des phases (codes internes → clés lib2_)
const CATS = ['gh', 'recov', 'anti', 'neuro', 'fat', 'sex', 'immun', 'cardio', 'skin'];
const PHASES = ['experimental', 'preclinical', 'phase1', 'phase2', 'phase3', 'established'];
const REPORTS_KEY = 'ps_source_reports';

let PHASE_MAP = {};                   // nom normalisé → research_phase (table Supabase « peptides »)
const filters = { q: '', cat: 'all', phase: 'all' };
let listScroll = 0;

// ── Petits outils ──────────────────────────────────────────────
function fmt(key, vars) {
  let s = t(key);
  Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
function norm(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
}
function isEn() { return P.lang() === 'en'; }
function loc(p, field) {                      // texte de la fiche dans la langue active
  if (isEn() && p.en && p.en[field] !== undefined) return p.en[field];
  return p[field];
}
function displayName(p) { return loc(p, 'name') || p.name; }
function catLabel(code) { return t('lib2_cat_' + code); }
function phaseOf(p) {
  const fromDb = PHASE_MAP[norm(p.name)] || (p.en && p.en.name ? PHASE_MAP[norm(p.en.name)] : null);
  const ph = fromDb || p.phase || 'experimental';
  return PHASES.indexOf(ph) >= 0 ? ph : 'experimental';
}
function routeLabel(p) {
  const v = isEn() ? String(p.admin).replace(/Topique/g, 'Topical') : p.admin;
  return fmt('lib2_route', { v: v });
}
function slugOf(p) { return encodeURIComponent(p.name); }

// ── Lecture Supabase : phase de recherche par peptide ──────────
async function loadPhases() {
  try {
    const { data, error } = await sb.from('peptides').select('name, research_phase');
    if (error || !data) return;
    const map = {};
    data.forEach(r => { if (r && r.name && r.research_phase) map[norm(r.name)] = r.research_phase; });
    PHASE_MAP = map;
  } catch (e) { console.warn('[bibliothèque] phases non chargées :', e); }
}

// ── Filtrage ───────────────────────────────────────────────────
function matches(p) {
  if (filters.cat !== 'all' && p.cat !== filters.cat) return false;
  if (filters.phase !== 'all' && phaseOf(p) !== filters.phase) return false;
  const q = norm(filters.q);
  if (!q) return true;
  const hay = [p.name, p.alias, p.en && p.en.name, p.en && p.en.alias, catLabel(p.cat)]
    .concat(p.effets, (p.en && p.en.effets) || []).map(norm).join(' | ');
  return hay.indexOf(q) >= 0;
}
function sorted(list) {
  return list.slice().sort((a, b) => displayName(a).localeCompare(displayName(b), P.locale(), { sensitivity: 'base', numeric: true }));
}

// ── Vue liste (maquette « library » / « empty-library ») ────────
function renderList() {
  const opt = (v, txt) => [v, txt];
  const catOpts = [opt('all', t('lib2_f_cat_all'))].concat(CATS.map(c => opt(c, catLabel(c))));
  const phOpts = [opt('all', t('lib2_f_phase_all'))].concat(PHASES.map(ph => opt(ph, t('lib2_ph_' + ph))));
  document.title = 'PeptideScanner — ' + t('lib2_title');
  document.getElementById('view').innerHTML =
    '<div class="stack">' +
    '<div class="page-intro"><h1 data-i18n="lib2_title">Bibliothèque</h1><p class="muted small" data-i18n="lib2_sub">Des sources pour comprendre</p></div>' +
    '<div class="field"><label class="label" for="libSearch" data-i18n="lib2_search">Rechercher un peptide</label>' +
      '<div class="input-wrap lib-search"><span class="search-ic">' + P.icon('magnifying-glass') + '</span>' +
      '<input class="input" id="libSearch" name="libSearch" type="search" enterkeyhint="search" autocomplete="off" data-i18n-ph="lib2_search_ph" placeholder="Nom ou mot-clé" value="' + P.esc(filters.q) + '"></div></div>' +
    '<div class="grid2">' +
      P.select(t('lib2_f_cat'), 'libCat', catOpts, filters.cat) +
      P.select(t('lib2_f_phase'), 'libPhase', phOpts, filters.phase) +
    '</div>' +
    '<p class="small muted" id="libCount" aria-live="polite"></p>' +
    '<div id="libResults"></div>' +
    '<div id="libNotice">' + P.notice(t('msg_info_not_reco')) + '</div>' +
    '</div>';
  PS_applyI18n();

  const search = document.getElementById('libSearch');
  search.addEventListener('input', () => { filters.q = search.value; renderResults(); });
  search.addEventListener('keydown', e => { if (e.key === 'Enter') search.blur(); });
  document.getElementById('libCat').addEventListener('change', e => { filters.cat = e.target.value; renderResults(); });
  document.getElementById('libPhase').addEventListener('change', e => { filters.phase = e.target.value; renderResults(); });
  renderResults();
}

function renderResults() {
  const box = document.getElementById('libResults');
  if (!box) return;
  const total = PEPTIDES.length;
  const list = sorted(PEPTIDES.filter(matches));
  const filtered = list.length !== total;
  const countEl = document.getElementById('libCount');
  const noticeEl = document.getElementById('libNotice');
  if (!list.length) {
    countEl.textContent = '';
    countEl.classList.add('hidden');
    noticeEl.classList.add('hidden');
    box.innerHTML = '<section class="card">' +
      P.empty(t('lib2_empty_title'), t('lib2_empty_text'), 'magnifying-glass', t('lib2_empty_cta'), null, 'lib-reset') + '</section>';
    const reset = box.querySelector('[data-ps-action="lib-reset"]');
    if (reset) reset.addEventListener('click', resetFilters);
    return;
  }
  countEl.classList.remove('hidden');
  noticeEl.classList.remove('hidden');
  countEl.textContent = filtered
    ? fmt(list.length === 1 ? 'lib2_count_of_one' : 'lib2_count_of', { n: list.length, total: total })
    : fmt('lib2_count', { n: total });
  box.innerHTML = '<section class="card lib-list"><div class="list" role="list" aria-label="' + P.esc(t('lib2_list_aria')) + '">' +
    list.map(p =>
      '<a class="list-row" role="listitem" href="#p=' + slugOf(p) + '">' + P.icon('book-open') +
      '<div class="grow"><strong>' + P.esc(displayName(p)) + '</strong>' +
      '<div class="muted small">' + P.esc(catLabel(p.cat) + ' · ' + t('lib2_ph_' + phaseOf(p))) + '</div></div>' +
      P.icon('chevron-right', 'chev') + '</a>').join('') +
    '</div></section>';
  box.querySelectorAll('a.list-row').forEach(a => a.addEventListener('click', () => { listScroll = window.scrollY; }));
}

function resetFilters() {
  filters.q = ''; filters.cat = 'all'; filters.phase = 'all';
  renderList();
  const s = document.getElementById('libSearch'); if (s) s.focus();
}

// ── Vue fiche (maquette « peptide ») ────────────────────────────
function findPeptide(slug) {
  let key = slug;
  try { key = decodeURIComponent(slug); } catch (e) {}
  const n = norm(key);
  return PEPTIDES.find(p => norm(p.name) === n || (p.en && p.en.name && norm(p.en.name) === n) || String(p.id) === key) || null;
}

function regBlock(p) {
  const code = p.reg || 'review';
  let sub;
  if (code === 'review') sub = t('lib2_reg_review_sub');
  else if (code === 'cosmetic') sub = t('lib2_reg_cosmetic_sub');
  else sub = (loc(p, 'regNote') ? loc(p, 'regNote') + ' ' : '') + t('lib2_reg_country');
  return '<div><span class="eyebrow" data-i18n="lib2_reg_eyebrow">Statut réglementaire</span><h2>' + P.esc(t('lib2_reg_' + code)) + '</h2>' +
    '<p class="small muted">' + P.esc(sub) + '</p></div>';
}

function studiesBlock(p) {
  const list = Array.isArray(p.etudes) ? p.etudes : [];
  let html = '<h2 data-i18n="lib2_studies">Études et sources</h2>' +
    '<p class="small muted" style="margin-top:12px" data-i18n="lib2_studies_format">Chaque référence comporte : auteurs, année, titre, type d’étude, population ou modèle, DOI ou lien et date de consultation.</p>';
  if (!list.length) return html + '<p class="help" data-i18n="lib2_studies_none">Aucune étude n’est citée pour le moment.</p>';
  return html + '<div class="mt-2">' + list.map(s => {
    const head = [s.authors, s.year].filter(Boolean).join(', ');
    const link = s.link && /^https?:\/\//.test(s.link)
      ? '<a class="small" href="' + P.esc(s.link) + '" target="_blank" rel="noopener">' + P.esc(s.link) + '</a>' : '';
    return '<div class="lib-study"><strong class="small">' + P.esc(s.title || '') + '</strong>' +
      (head || s.type ? '<div class="muted small">' + P.esc([head, s.type].filter(Boolean).join(' · ')) + '</div>' : '') + link + '</div>';
  }).join('') + '</div>';
}

function renderPeptide(p) {
  const ph = phaseOf(p);
  const alias = loc(p, 'alias');
  const effets = loc(p, 'effets') || [];
  const sec = loc(p, 'secondaires') || [];
  const contra = loc(p, 'contreindications');
  const note = loc(p, 'note');
  document.title = 'PeptideScanner — ' + displayName(p);
  document.getElementById('view').innerHTML =
    '<div class="stack">' +
    '<a class="back-row lib-back" href="#"><span class="icon-btn" aria-hidden="true">' + P.icon('chevron-left') + '</span><span data-i18n="lib2_title">Bibliothèque</span></a>' +
    '<div class="page-intro"><h1 id="pepTitle" tabindex="-1">' + P.esc(displayName(p)) + '</h1>' +
      (alias ? '<p class="muted small lib-sub">' + P.esc(alias) + '</p>' : '') +
      '<p class="muted small">' + P.esc(catLabel(p.cat)) + ' · ' + P.esc(routeLabel(p)) + '</p></div>' +
    P.notice(t('lib2_notice_doc')) +
    '<section class="card"><div class="stack">' + regBlock(p) + '<hr class="divider">' +
      '<div><span class="eyebrow" data-i18n="lib2_research_eyebrow">État de la recherche</span><h2>' + P.esc(t('lib2_ph_' + ph)) + '</h2>' +
      '<p class="small muted">' + P.esc(t('lib2_ph_' + ph + '_desc')) + '</p></div></div></section>' +
    '<section class="card"><h2 data-i18n="lib2_effects">Effets étudiés</h2>' +
      (effets.length ? '<div class="pills mt-3">' + effets.map(e => '<span class="pill info">' + P.esc(e) + '</span>').join('') + '</div>'
                     : '<p class="small muted mt-3" data-i18n="lib2_none">Non renseigné.</p>') + '</section>' +
    '<section class="card"><h2 data-i18n="lib2_safety">Effets indésirables et contre-indications</h2>' +
      '<h3 class="lib-h3" data-i18n="lib2_side">Effets indésirables signalés</h3>' +
      (sec.length ? '<ul class="lib-bullets">' + sec.map(s => '<li>' + P.esc(s) + '</li>').join('') + '</ul>'
                  : '<p class="small muted" data-i18n="lib2_none">Non renseigné.</p>') +
      '<h3 class="lib-h3" data-i18n="lib2_contra">Contre-indications et précautions</h3>' +
      '<p class="small muted">' + (contra ? P.esc(contra) : P.esc(t('lib2_none'))) + '</p>' +
      (note ? '<h3 class="lib-h3" data-i18n="lib2_note">À savoir</h3><p class="small muted">' + P.esc(note) + '</p>' : '') +
    '</section>' +
    '<section class="card">' + studiesBlock(p) + '</section>' +
    '<section class="card"><h2 data-i18n="lib2_limits">Ce que la fiche ne conclut pas</h2>' +
      '<p class="small muted" style="margin-top:12px" data-i18n="lib2_limits_text">Un résultat de recherche ne constitue pas une recommandation personnelle. Pour une décision médicale, adressez-vous à un professionnel de santé.</p></section>' +
    '<button class="btn secondary full" type="button" id="reportBtn" data-i18n="lib2_report_btn">Signaler une source à corriger</button>' +
    '</div>';
  PS_applyI18n();
  document.getElementById('reportBtn').addEventListener('click', () => openReport(p));
  window.scrollTo(0, 0);
  const h = document.getElementById('pepTitle'); if (h) h.focus({ preventScroll: true });
}

function renderNotFound() {
  document.getElementById('view').innerHTML =
    '<div class="stack"><a class="back-row lib-back" href="#"><span class="icon-btn" aria-hidden="true">' + P.icon('chevron-left') + '</span><span data-i18n="lib2_title">Bibliothèque</span></a>' +
    '<section class="card">' + P.empty(t('lib2_nf_title'), t('lib2_nf_text'), 'book-open', t('lib2_nf_cta'), '#') + '</section></div>';
  PS_applyI18n();
  window.scrollTo(0, 0);
}

// ── Feuille « Signaler une source à corriger » (sans réseau) ────
function readReports() {
  try { const v = JSON.parse(localStorage.getItem(REPORTS_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
}
function openReport(p) {
  const body =
    '<p class="small muted">' + P.esc(displayName(p)) + '</p>' +
    P.field(t('lib2_report_ref'), 'repRef', '', 'text', '', '', 'placeholder="' + P.esc(t('lib2_report_ref_ph')) + '" autocomplete="off"') +
    '<div class="field"><label class="label" for="repNote">' + P.esc(t('lib2_report_note')) + '</label>' +
      '<textarea class="textarea" id="repNote" name="repNote" rows="4" placeholder="' + P.esc(t('lib2_report_note_ph')) + '" aria-describedby="repHelp"></textarea>' +
      '<p class="help" id="repHelp">' + P.esc(t('lib2_report_help')) + '</p></div>' +
    '<p class="error-text hidden" id="repErr" role="alert"></p>' +
    '<button class="btn full" type="button" id="repOk">' + P.esc(t('lib2_report_ok')) + '</button>';
  P.openSheet(t('lib2_report_title'), body, d => {
    d.querySelector('#repOk').onclick = () => {
      const ref = d.querySelector('#repRef').value.trim();
      const note = d.querySelector('#repNote').value.trim();
      const err = d.querySelector('#repErr');
      if (!ref && !note) {
        d.querySelector('#repRef').setAttribute('aria-invalid', 'true');
        err.textContent = t('lib2_report_err'); err.classList.remove('hidden');
        return;
      }
      const list = readReports();
      list.push({ peptide: p.name, ref: ref, note: note, at: P.localStamp(psDayStr(), P.nowHM()) });
      let saved = true;
      try { localStorage.setItem(REPORTS_KEY, JSON.stringify(list.slice(-200))); } catch (e) { saved = false; }
      if (!saved) { err.textContent = t('msg_save_error'); err.classList.remove('hidden'); return; }
      P.closeSheet();
      P.toast(t('lib2_report_done'));
    };
  });
}

// ── Routage par l'adresse : #p=<nom> ouvre une fiche ───────────
function route() {
  const h = location.hash || '';
  if (h.indexOf('#p=') === 0) {
    const p = findPeptide(h.slice(3));
    if (p) renderPeptide(p); else renderNotFound();
    return;
  }
  renderList();
  requestAnimationFrame(() => window.scrollTo(0, listScroll || 0));
}

PS_initShell();
document.getElementById('view').innerHTML = P.skeleton();

async function init() {
  const session = await P.requireSession(sb);
  if (!session) return;
  userId = session.user.id;
  const { data: profil } = await sb.from('profiles').select('*').eq('id', userId).single();
  if (profil) PS_loadLangFromProfile(sb, userId, profil.lang);
  route();                                   // les fiches sont locales : affichage immédiat
  await loadPhases();                        // puis les phases de recherche à jour
  if (Object.keys(PHASE_MAP).length) {
    if ((location.hash || '').indexOf('#p=') === 0) route(); else renderResults();
  }
}
window.addEventListener('hashchange', route);
init().catch(e => { console.error(e); document.getElementById('view').innerHTML = P.errorState(init); });
</script>
