<script>
const SUPABASE_URL      = 'https://dkwztwlkjewdzfichkgk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrd3p0d2xramV3ZHpmaWNoa2drIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MjYwOTAsImV4cCI6MjA5NzQwMjA5MH0.iT7ylcNvPCf2jMUYfJlsDJcoGjPolphQWONFusAAlAk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const P = window.PS;   // outils communs (ps-app.js)

// ── État de la page ──────────────────────────────────────────────
let userId = null;
let allCures = [], allInjections = [], allWeights = [], allInventory = [];
let ROWS = [];          // créneaux du jour affichés (ordre de l'écran)
let busy = false;       // bloque les doubles appuis pendant une écriture
let renderedDay = null; // jour affiché (pour rafraîchir après minuit)

// Rotation des sites d'injection (inchangée : clé localStorage ps_site_<cure>)
const SITE_KEYS = ['site_abd_g', 'site_abd_d', 'site_thigh_g', 'site_thigh_d', 'site_glute_g', 'site_glute_d'];

// ── Petits outils ────────────────────────────────────────────────
const $ = s => document.querySelector(s);
// Traduction avec variables {x} (jamais de variable nommée « t »)
function tx(key, vars) {
  let s = t(key);
  Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
const esc = P.esc;
function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
function shortDate(ds) { return P.fmtDate(ds, { day: 'numeric', month: 'long' }); }
function periodOf(hm) {
  const h = parseInt(String(hm || '').slice(0, 2), 10);
  if (!isFinite(h) || h < 12) return t('home2_morning');
  return h < 18 ? t('home2_afternoon') : t('home2_evening');
}
function cleanNote(v) { return String(v || '').replace(/\s*[|\r\n]+\s*/g, ' ').trim().slice(0, 200); }
function doseMg(cure) {
  let d = parseFloat(cure && cure.dose_mcg) || 0;
  if (String((cure && cure.unit) || 'mg').toLowerCase() === 'mcg') d = d / 1000;
  return d;
}
function injQty(inj) { const q = parseFloat(P.getTag(inj && inj.notes, 'qty')); return q > 0 ? q : null; }
// Quantité consommée dans le flacon pour un état donné (mg)
function effectMg(status, qty, cure) {
  if (status === 'done') return doseMg(cure);
  if (status === 'partial') return qty > 0 ? qty : doseMg(cure);
  return 0;
}
// Stock : consumed > 0 = retiré du flacon, < 0 = remis
async function applyStock(cure, consumed) {
  if (!consumed || !cure) return;
  const dir = consumed > 0 ? -1 : 1, amt = Math.abs(consumed);
  try {
    if (Math.abs(amt - doseMg(cure)) < 1e-9) await P.updateStock(sb, userId, cure, dir);
    else await P.updateStock(sb, userId, cure, dir, amt);
  } catch (e) { console.warn('[accueil] stock :', e); }
}
function nextSite(cureId) {
  let last = -1;
  try { last = parseInt(localStorage.getItem('ps_site_' + cureId) || '-1', 10); } catch (e) {}
  if (!isFinite(last)) last = -1;
  const idx = (last + 1) % SITE_KEYS.length;
  try { localStorage.setItem('ps_site_' + cureId, idx); } catch (e) {}
  return { label: t(SITE_KEYS[idx]), prev: last };
}
function restoreSite(cureId, prev) {
  try { if (prev < 0) localStorage.removeItem('ps_site_' + cureId); else localStorage.setItem('ps_site_' + cureId, prev); } catch (e) {}
}
function check(r) { if (r && r.error) throw r.error; return r; }
// Requête ciblant une injection : par id, ou par ses valeurs si l'id n'a pas été renvoyé
function target(q, inj) {
  if (inj._local) return q.eq('user_id', userId).eq('cure_id', inj.cure_id).eq('injected_at', inj.injected_at).eq('notes', inj.notes);
  return q.eq('id', inj.id);
}
function afterChange() {
  render();
  P.refreshReminders(allCures, allInjections, userId);
}
// Garde-fou : une seule écriture à la fois, message clair en cas d'échec
async function guarded(fn) {
  if (busy) return;
  busy = true;
  try { await fn(); }
  catch (e) { console.error(e); P.toast(t('msg_save_error')); }
  finally { busy = false; }
}

// Annulation depuis le toast : une seule à la fois ; en cas d'échec, message d'erreur (pas « annulée »)
function undoable(fn) {
  return () => {
    if (busy) return new Promise(() => {});
    busy = true;
    return Promise.resolve().then(fn).then(() => { busy = false; },
      e => { busy = false; console.error(e); P.toast(t('msg_save_error')); return new Promise(() => {}); });
  };
}

// ── Données ──────────────────────────────────────────────────────
function activeModels() {
  return allCures
    .filter(c => c && c.status === 'active' && c.start_date)
    .map(c => P.cure(c))
    .filter(m => m && m.state === 'active')
    .sort((a, b) => {
      if (a.raw.is_favorite && !b.raw.is_favorite) return -1;
      if (!a.raw.is_favorite && b.raw.is_favorite) return 1;
      return b.start - a.start;
    });
}
// Créneaux du jour de toutes les cures actives (prévus, reportés vers aujourd'hui, saisies du jour)
function todayRows(models, ds) {
  const rows = [];
  models.forEach((m, ci) => {
    const states = P.slotStates(m, allInjections, ds) || [];
    states.forEach(s => {
      const legacy = s.status === 'postponed' && !s.inj && !s.auto;   // jour couvert par une injection d'un autre jour
      // Heure de référence du créneau (Matin / Après-midi / Soir) : prévue, ou celle du report
      const planned = (s.incoming || s.extra || s.off) ? (s.time || m.times[s.slot]) : (m.times[s.slot] || s.time);
      rows.push({ m, s, ci, legacy, planned, from: s.from || (s.inj ? P.readReport(s.inj) : null) });
    });
  });
  rows.sort((a, b) => String(a.s.time || '99:99').localeCompare(String(b.s.time || '99:99')) || a.ci - b.ci || a.s.slot - b.s.slot);
  return rows;
}
function rowSlotLabel(r) { return r.m.name + ' · ' + periodOf(r.planned) + ' · ' + (r.s.time || r.planned); }
function rowSub(r) {
  const s = r.s;
  let sub = P.statusLabel(s.status);
  if (r.from) sub += ' · ' + tx('home2_from', { d: shortDate(r.from) });
  if (s.inj && s.status === 'postponed') {
    const to = P.postponedTo(s.inj);
    if (to) sub += ' · ' + tx('home2_to', { d: shortDate(to.ds), h: to.time || '—' });
  }
  if (s.inj && s.status === 'partial' && injQty(s.inj)) sub += ' · ' + P.fmtNum(injQty(s.inj), 3) + ' mg';
  if (r.legacy && s.to) sub += ' · ' + shortDate(s.to.ds);
  return sub;
}

// ── Écritures ────────────────────────────────────────────────────
// Renseigner un créneau encore vide (prévu ou reporté vers aujourd'hui)
async function recordSlot(r, status, opts) {
  opts = opts || {};
  const m = r.m, s = r.s, cure = m.raw, ds = psDayStr();

  // Créneau déjà reporté vers aujourd'hui, reporté de nouveau : on déplace le report d'origine
  if (s.incoming && status === 'postponed') {
    const src = s.source, oldNotes = src.notes;
    const newNotes = P.setTag(oldNotes, 'to', opts.date + ' ' + opts.ptime);
    check(await target(sb.from('injections').update({ notes: newNotes }), src));
    src.notes = newNotes;
    afterChange();
    P.toast(tx('home2_msg_postponed', { d: shortDate(opts.date), h: opts.ptime }), undoable(async () => {
      check(await target(sb.from('injections').update({ notes: oldNotes }), src));
      src.notes = oldNotes; afterChange();
    }));
    return;
  }

  const taken = status === 'done' || status === 'partial';
  let notes = 'slot:' + s.slot;
  if (s.incoming) notes = P.setTag(notes, 'report', s.from);
  if (status !== 'done') notes = P.setTag(notes, 'st', status);
  if (status === 'partial' && opts.qty) notes = P.setTag(notes, 'qty', opts.qty);
  if (status === 'postponed') notes = P.setTag(notes, 'to', opts.date + ' ' + opts.ptime);
  if (opts.note) notes = P.setTag(notes, 'note', cleanNote(opts.note));
  const site = taken ? nextSite(cure.id) : null;
  const row = {
    user_id: userId, cure_id: cure.id, peptide_name: cure.peptide_name || cure.name,
    dose_mcg: taken ? (cure.dose_mcg != null ? cure.dose_mcg : null) : null,
    injection_site: site ? site.label : null,
    injected_at: P.localStamp(ds, taken ? (opts.time || P.nowHM()) : (s.time || r.planned)),
    notes: notes
  };
  let res;
  try { res = check(await sb.from('injections').insert(row).select().single()); }
  catch (e) { if (site) restoreSite(cure.id, site.prev); throw e; }
  const saved = Object.assign({}, row, (res && res.data) || {});
  if (!saved.id) { saved.id = 'local-' + Date.now(); saved._local = true; }
  allInjections.unshift(saved);
  const used = effectMg(status, opts.qty, cure);
  await applyStock(cure, used);
  afterChange();

  const msg = status === 'done' ? t('home2_msg_done') : status === 'partial' ? t('msg_partial')
    : status === 'missed' ? t('msg_missed') : status === 'rest' ? t('home2_msg_rest')
    : tx('home2_msg_postponed', { d: shortDate(opts.date), h: opts.ptime });
  P.toast(msg, undoable(async () => {
    check(await target(sb.from('injections').delete({}), saved));
    allInjections = allInjections.filter(i => i !== saved);
    await applyStock(cure, -used);
    if (site) restoreSite(cure.id, site.prev);
    afterChange();
  }));
}

// Changer l'état d'un créneau déjà renseigné (feuille des états)
async function changeRecorded(r, res) {
  const inj = r.s.inj, cure = r.m.raw;
  if (res.status === 'clear') return clearRecord(r);
  const old = { notes: inj.notes, dose_mcg: inj.dose_mcg, injection_site: inj.injection_site };
  const oldStatus = P.injStatus(inj);
  const wasTaken = oldStatus === 'done' || oldStatus === 'partial';
  const taken = res.status === 'done' || res.status === 'partial';
  let notes = P.setTag(inj.notes, 'st', res.status === 'done' ? null : res.status);
  notes = P.setTag(notes, 'qty', res.status === 'partial' && res.qty ? res.qty : null);
  notes = P.setTag(notes, 'to', res.status === 'postponed' ? res.date + ' ' + res.time : null);
  let site = null;
  if (taken && !wasTaken && !inj.injection_site) site = nextSite(cure.id);
  const patch = {
    notes: notes,
    dose_mcg: taken ? (inj.dose_mcg != null ? inj.dose_mcg : (cure.dose_mcg != null ? cure.dose_mcg : null)) : null,
    injection_site: taken ? (inj.injection_site || (site ? site.label : null)) : null
  };
  try { check(await target(sb.from('injections').update(patch), inj)); }
  catch (e) { if (site) restoreSite(cure.id, site.prev); throw e; }
  const delta = effectMg(res.status, res.qty, cure) - effectMg(oldStatus, injQty(inj), cure);
  Object.assign(inj, patch);
  await applyStock(cure, delta);
  afterChange();
  const msg = res.status === 'done' ? t('home2_msg_done') : res.status === 'partial' ? t('msg_partial')
    : res.status === 'missed' ? t('msg_missed') : res.status === 'rest' ? t('home2_msg_rest')
    : tx('home2_msg_postponed', { d: shortDate(res.date), h: res.time });
  P.toast(msg, undoable(async () => {
    check(await target(sb.from('injections').update(old), inj));
    Object.assign(inj, old);
    await applyStock(cure, -delta);
    if (site) restoreSite(cure.id, site.prev);
    afterChange();
  }));
}

// Effacer un enregistrement : le créneau redevient non renseigné
async function clearRecord(r) {
  const ok = await P.confirm({ title: t('home2_clear_title'), text: t('home2_clear_text'), ok: t('home2_clear_ok'), cancel: t('cancel'), danger: true });
  if (!ok) return;
  const inj = r.s.inj, cure = r.m.raw;
  check(await target(sb.from('injections').delete({}), inj));
  allInjections = allInjections.filter(i => i !== inj);
  const used = effectMg(P.injStatus(inj), injQty(inj), cure);
  await applyStock(cure, -used);
  afterChange();
  P.toast(t('home2_msg_cleared'), undoable(async () => {
    const copy = Object.assign({}, inj); delete copy._local;
    if (inj._local) delete copy.id;
    check(await sb.from('injections').insert(copy));
    allInjections.unshift(inj);
    await applyStock(cure, used);
    afterChange();
  }));
}

// Modifier l'heure et la note d'un enregistrement
async function saveEdit(r, hm, note) {
  const inj = r.s.inj;
  const old = { injected_at: inj.injected_at, notes: inj.notes };
  const patch = {
    injected_at: /^\d{2}:\d{2}$/.test(hm) ? P.localStamp(P.injDay(inj), hm) : inj.injected_at,
    notes: P.setTag(inj.notes, 'note', cleanNote(note) || null)
  };
  if (patch.injected_at === old.injected_at && patch.notes === old.notes) return;
  check(await target(sb.from('injections').update(patch), inj));
  Object.assign(inj, patch);
  afterChange();
  P.toast(t('home2_msg_saved'), undoable(async () => {
    check(await target(sb.from('injections').update(old), inj));
    Object.assign(inj, old); afterChange();
  }));
}

// ── Feuilles ─────────────────────────────────────────────────────
function allowFor(r, recorded) {
  // Une injection qui couvre un report ne se reporte pas une 2e fois (l'effacer d'abord)
  if (recorded && r.from) return ['done', 'partial', 'missed', 'rest'];
  return ['done', 'partial', 'missed', 'postponed', 'rest'];
}
async function openStatus(r) {
  const recorded = !!r.s.inj;
  const res = await P.statusSheet({
    title: t('st_sheet_title'),
    sub: tx('home2_sheet_sub', { slot: rowSlotLabel(r) }),
    date: psDayStr(), time: r.s.time || r.planned,
    allow: allowFor(r, recorded), canClear: recorded
  });
  if (!res) return;
  if (recorded) return guarded(() => changeRecorded(r, res));
  return guarded(() => recordSlot(r, res.status, { qty: res.qty, date: res.date, ptime: res.time }));
}
function openEdit(r) {
  const s = r.s, recorded = !!s.inj;
  const title = r.m.name + ' · ' + periodOf(r.planned);
  const site = recorded && s.inj.injection_site ? ' · ' + s.inj.injection_site : '';
  const hm = recorded ? (P.injTime(s.inj) || r.planned) : P.nowHM();
  const note = recorded ? (P.getTag(s.inj.notes, 'note') || '') : '';
  const body = '<p class="small muted">' + esc((s.time || r.planned) + ' · ' + rowSub(r) + site) + '</p>' +
    P.field(t('home2_time'), 'hmTime', '', 'time', hm) +
    P.field(t('home2_note'), 'hmNote', '', 'text', note, '', 'maxlength="200" autocomplete="off"') +
    (recorded
      ? '<button class="btn full" type="button" data-k="save">' + esc(t('save')) + '</button>' +
        '<button class="btn secondary full" type="button" data-k="status">' + esc(t('home2_change_status')) + '</button>' +
        '<button class="btn ghost full" type="button" data-k="clear">' + esc(t('st_clear')) + '</button>'
      : '<button class="btn full" type="button" data-k="done">' + esc(t('home2_mark_done')) + '</button>' +
        '<button class="btn secondary full" type="button" data-k="status">' + esc(t('home2_other_status')) + '</button>');
  P.openSheet(title, body, d => {
    const val = id => (d.querySelector(id).value || '').trim();
    d.querySelectorAll('[data-k]').forEach(b => {
      b.onclick = () => {
        const k = b.dataset.k, time = val('#hmTime'), txt = val('#hmNote');
        if ((k === 'save' || k === 'done') && time && !/^\d{2}:\d{2}$/.test(time)) { d.querySelector('#hmTime').setAttribute('aria-invalid', 'true'); return; }
        if (k === 'status') { openStatus(r); return; }    // la feuille des états remplace celle-ci
        P.closeSheet();
        if (k === 'save') guarded(() => saveEdit(r, time, txt));
        else if (k === 'done') guarded(() => recordSlot(r, 'done', { time: time || P.nowHM(), note: txt }));
        else if (k === 'clear') guarded(() => clearRecord(r));
      };
    });
  });
}

// ── Rendu ────────────────────────────────────────────────────────
function setIntro(titleKey, sub) {
  const h = $('#introTitle'); h.setAttribute('data-i18n', titleKey); h.textContent = t(titleKey);
  const p = $('#introSub'); p.textContent = sub || ''; p.hidden = !sub;
}
function todayLabel() {
  return cap(P.fmtDate(new Date(), { weekday: 'long', day: 'numeric', month: 'long' }));
}

function heroHtml(rows) {
  const head = (title) => '<div class="row between"><div><div class="eyebrow">' + esc(t('home2_eyebrow')) + '</div>' +
    '<h2 class="home-h2">' + esc(title) + '</h2></div>' + P.icon('calendar-days') + '</div>';
  if (!rows.length) {
    return '<section class="card hero-card">' + head(t('home2_rest_title')) +
      '<div class="list-row">' + P.status('rest', false) + '<div class="grow"><strong>' + esc(t('st_rest')) + '</strong>' +
      '<div class="small muted">' + esc(t('home2_rest_sub')) + '</div></div></div></section>';
  }
  const total = rows.length, done = rows.filter(r => !r.s.auto).length;
  let html = '<section class="card hero-card">' + head(tx(total === 1 ? 'home2_count_1' : 'home2_count', { x: done, y: total }));
  rows.forEach((r, i) => {
    const editable = !r.legacy;
    html += '<div class="list-row">' + P.status(r.s.status, false) +
      '<div class="grow"><strong>' + esc(rowSlotLabel(r)) + '</strong><div class="small muted">' + esc(rowSub(r)) + '</div></div>' +
      (editable ? '<button class="icon-btn" type="button" data-edit="' + i + '" aria-label="' + esc(tx('home2_edit_aria', { slot: rowSlotLabel(r) })) + '">' + P.icon('pencil-square') + '</button>' : '') +
      '</div>';
  });
  const next = rows.findIndex(r => r.s.auto);
  const lastRec = (() => { for (let i = rows.length - 1; i >= 0; i--) if (rows[i].s.inj) return i; return -1; })();
  html += '<div class="stack tight home-actions">';
  if (next >= 0) {
    html += '<button class="btn full" type="button" data-done="' + next + '">' + esc(t('home2_mark_done')) + '</button>' +
            '<button class="btn ghost full" type="button" data-other="' + next + '">' + esc(t('home2_other_status')) + '</button>';
  } else if (lastRec >= 0) {
    html += '<button class="btn full" type="button" data-other="' + lastRec + '">' + esc(t('home2_edit_record')) + '</button>';
  }
  return html + '</div></section>';
}

function cureHtml(models) {
  const m = models[0], today = psDay(new Date());
  const dayNum = Math.min(m.duration, Math.max(1, m.dayNumber(today)));
  const pct = Math.round(dayNum / m.duration * 100);
  const others = models.length - 1;
  return '<section class="card"><div class="row">' + P.icon('calendar-days') +
    '<div class="grow"><span class="small muted">' + esc(t('home2_cure_now') + ' · ' + m.name) + '</span>' +
    '<h2>' + esc(tx('home2_day_of', { x: dayNum, y: m.duration })) + '</h2></div>' +
    '<a class="icon-btn" href="cure.html" aria-label="' + esc(t('home2_open_cure')) + '">' + P.icon('chevron-right') + '</a></div>' +
    P.progress(pct, t('home2_progress_aria')) +
    '<p class="help">' + esc(t('home2_progress_help')) + '</p>' +
    (others > 0 ? '<a class="link-btn home-more" href="cure.html">' + esc(others === 1 ? t('home2_more_1') : tx('home2_more_n', { n: others })) + '</a>' : '') +
    '</section>';
}

function nextReminder() {
  let rem = {};
  try { rem = JSON.parse(localStorage.getItem('ps_reminders_' + userId) || '{}') || {}; } catch (e) {}
  const plan = PS_buildInjectionPlan(allCures, allInjections, rem, 2);
  if (!plan.length) return null;
  const at = plan[0].at;
  return { hm: P.pad(at.getHours()) + ':' + P.pad(at.getMinutes()), tomorrow: psDayStr(at) !== psDayStr() };
}
function lastWeight() {
  const w = allWeights.filter(x => x && x.weight_kg != null && isFinite(parseFloat(x.weight_kg)))
    .sort((a, b) => String(b.logged_at || '').localeCompare(String(a.logged_at || '')) || String(b.created_at || '').localeCompare(String(a.created_at || '')));
  return w.length ? parseFloat(w[0].weight_kg) : null;
}
function gridHtml() {
  const nr = nextReminder(), w = lastWeight();
  return '<div class="grid2">' +
    '<section class="card compact home-mini"><div class="small muted">' + esc(t('home2_next_reminder')) + '</div>' +
      '<div class="number home-metric">' + (nr ? esc(nr.hm) + (nr.tomorrow ? ' <span class="unit">' + esc(t('home2_tomorrow')) + '</span>' : '') : '—') + '</div>' +
      '<a class="btn ghost" href="alertes.html">' + esc(t('home2_set')) + '</a></section>' +
    '<section class="card compact home-mini"><div class="small muted">' + esc(t('home2_last_weight')) + '</div>' +
      '<div class="number home-metric">' + (w != null ? esc(P.fmtNum(w, 1)) + ' <span class="unit">kg</span>' : '—') + '</div>' +
      '<a class="btn ghost" href="poids.html">' + esc(t('home2_add')) + '</a></section>' +
    '</div>';
}

// Flacon actif à moins de 20 % (quantité restante / quantité du flacon)
function lowVial() {
  let best = null;
  allInventory.forEach(f => {
    if (!f || P.hasFlag(f.notes, 'finished') || P.hasFlag(f.notes, 'sealed')) return;
    if (/^pen/.test(P.getTag(f.notes, 'type') || '')) return;
    const total = parseFloat(f.vial_qty_mg), left = parseFloat(f.remaining_units);
    if (!(total > 0) || !isFinite(left)) return;
    const frac = left / total;
    if (frac < 0.2 && (!best || frac < best.frac)) best = { f, frac };
  });
  return best;
}
function vialCardHtml() {
  const lv = lowVial();
  if (!lv) return '';
  return '<section class="card compact"><div class="row home-vial">' +
    P.asset('vial-low', 'material-mini').replace('<svg ', '<svg aria-hidden="true" focusable="false" ') +
    '<div class="grow"><strong>' + esc(t('home2_vial_low')) + '</strong>' +
    '<p class="small muted">' + esc((lv.f.peptide_name ? lv.f.peptide_name + ' · ' : '') + t('home2_vial_est')) + '</p>' +
    '<a class="btn ghost" href="inventaire.html#vial=' + encodeURIComponent(lv.f.id) + '">' + esc(t('home2_vial_see')) + '</a></div></div></section>';
}

function emptyHtml(hasCures) {
  return '<section class="card">' +
    P.empty(t(hasCures ? 'home2_none_title' : 'home2_empty_title'), t(hasCures ? 'home2_none_text' : 'home2_empty_text'),
      'calendar-days', t('home2_empty_cta'), 'cure.html#new') +
    '</section><a class="btn secondary full" href="inventaire.html">' + esc(t('home2_add_equipment')) + '</a>';
}

function render() {
  const view = $('#view');
  const ds = psDayStr();
  renderedDay = ds;
  const models = activeModels();
  if (!models.length) {
    setIntro('home2_today', t('home2_ready'));
    ROWS = [];
    view.innerHTML = emptyHtml(allCures.length > 0);
    PS_applyI18n();
    return;
  }
  setIntro('home2_today', todayLabel());
  ROWS = todayRows(models, ds);
  view.innerHTML = heroHtml(ROWS) + cureHtml(models) + gridHtml() + vialCardHtml();
  view.querySelectorAll('[data-edit]').forEach(b => { b.onclick = () => { if (!busy) openEdit(ROWS[+b.dataset.edit]); }; });
  view.querySelectorAll('[data-other]').forEach(b => { b.onclick = () => { if (!busy) openStatus(ROWS[+b.dataset.other]); }; });
  view.querySelectorAll('[data-done]').forEach(b => {
    b.onclick = () => guarded(async () => {
      b.setAttribute('aria-busy', 'true');
      await recordSlot(ROWS[+b.dataset.done], 'done', { time: P.nowHM() });
    });
  });
  PS_applyI18n();
}

// ── Chargement ───────────────────────────────────────────────────
function showLoading() {
  setIntro('home2_today', '');
  $('#view').innerHTML = P.skeleton();
  PS_applyI18n();
}
function showError() {
  setIntro('home2_error_title', '');
  $('#view').innerHTML = P.errorState(init) +
    '<a class="btn ghost full" href="profil.html">' + esc(t('home2_open_profile')) + '</a>';
  PS_applyI18n();
}
async function loadAll() {
  const [cRes, iRes, wRes, vRes] = await Promise.all([
    sb.from('cures').select('*').eq('user_id', userId).order('created_at', { ascending: false }),
    sb.from('injections').select('*').eq('user_id', userId).order('injected_at', { ascending: false }).limit(1000),
    sb.from('weight_logs').select('*').eq('user_id', userId).order('logged_at', { ascending: false }).limit(5),
    sb.from('inventory').select('*').eq('user_id', userId)
  ]);
  [cRes, iRes, wRes].forEach(check);
  allCures = cRes.data || [];
  allInjections = iRes.data || [];
  allWeights = wRes.data || [];
  allInventory = (vRes && !vRes.error && vRes.data) || [];
}
async function init() {
  showLoading();
  try {
    // Avertissement d'utilisation + parcours d'arrivée (redirections gérées par ps-app.js)
    const session = await P.requireSession(sb, { onboarding: true });
    if (!session) return;
    userId = session.user.id;
    const { data: profil } = await sb.from('profiles').select('*').eq('id', userId).single();
    if (profil) PS_loadLangFromProfile(sb, userId, profil.lang);
    await loadAll();
    // Rappels du téléphone remis à jour à chaque ouverture (si activés)
    P.refreshReminders(allCures, allInjections, userId);
    render();
  } catch (e) {
    console.error(e);
    showError();
  }
}

document.documentElement.lang = P.lang();
document.title = t('home2_doc_title');
PS_initShell();
// Retour sur l'appli après minuit : on recharge le nouveau jour
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && userId && renderedDay && renderedDay !== psDayStr() && !busy) init();
});
init();
</script>
</body>
</html>
