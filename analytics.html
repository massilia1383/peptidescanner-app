<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PeptideScanner — Statistiques</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F4F7FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1424" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PeptideScanner">
<script>try{var _pst=localStorage.getItem('ps_theme');if(_pst==='light'||_pst==='dark')document.documentElement.dataset.theme=_pst}catch(e){}</script>
<link rel="stylesheet" href="/peptidescanner.css">
<script src="/lang.js"></script>
<script src="/assets/assets-bundle.js"></script>
<script src="/ps-app.js"></script>
<style>
  /* Statistiques (maquettes « statistics » et « empty-stats ») — jetons du kit uniquement */
  .stat2-count { margin: 8px 0 }
  .stat2-states { margin-top: 18px }
  .stat2-lock { margin: 12px 0 }
  .stat2-lock-title { gap: 12px }
</style>
</head>
<body data-tab="weight" data-back="poids.html">
<a class="sr-only" href="#main" data-i18n="stat2_skip">Aller au contenu</a>
<div class="page">
  <header id="psHeader"></header>
  <main id="main" class="content" tabindex="-1">
    <div class="page-intro"><h1 data-i18n="stat2_title">Statistiques</h1><p class="muted small" id="stat2Sub" data-i18n="stat2_sub">Comprendre votre historique</p></div>
    <div id="view" class="stack"></div>
  </main>
  <nav id="psTabbar"></nav>
</div>

<script src="/vendor/supabase-2.117.3.umd.js"></script>
<script>
const SUPABASE_URL      = 'https://dkwztwlkjewdzfichkgk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrd3p0d2xramV3ZHpmaWNoa2drIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MjYwOTAsImV4cCI6MjA5NzQwMjA5MH0.iT7ylcNvPCf2jMUYfJlsDJcoGjPolphQWONFusAAlAk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const P = window.PS;   // outils communs (ps-app.js)
let userId = null;

let cures = [];        // cures déjà commencées, triées (actives d'abord)
let injections = [];   // toutes les injections de l'utilisateur
let selectedId = null;
try { selectedId = localStorage.getItem('ps_stat2_cure'); } catch (e) {}

PS_initShell();
document.getElementById('view').innerHTML = P.skeleton();

// ── Petits outils locaux ────────────────────────────────────────
function fill(str, map) { return String(str).replace(/\{(\w+)\}/g, (m, k) => (k in map ? map[k] : m)); }
// Accord : en français 0 et 1 sont au singulier, en anglais seulement 1
function isOne(n) { return P.lang() === 'en' ? n === 1 : n < 2; }
function cureName(c) {
  const m = P.cure(c);
  return (c.peptide_name || c.name || P.tr('stat2_cure_fallback')) + (m.label ? ' · ' + m.label : '');
}
// « Du 1er au 18 juin » / « June 1 to 18 » ; deux mois : « Du 20 mai au 18 juin »
function periodLabel(d0, d1) {
  const en = P.lang() === 'en', loc = P.locale();
  if (P.dayIndex(d0, d1) <= 0) return fill(P.tr('stat2_period_one'), { d: P.fmtDate(d1, { day: 'numeric', month: 'long' }) });
  const sameYear = d0.getFullYear() === d1.getFullYear(), sameMonth = sameYear && d0.getMonth() === d1.getMonth();
  const yearOpt = d1.getFullYear() !== new Date().getFullYear() ? { year: 'numeric' } : {};
  let from, to;
  if (sameMonth) {
    if (en) { from = d0.toLocaleDateString(loc, { month: 'long', day: 'numeric' }); to = String(d1.getDate()) + (yearOpt.year ? ', ' + d1.getFullYear() : ''); }
    else { from = d0.getDate() === 1 ? '1er' : String(d0.getDate()); to = P.fmtDate(d1, Object.assign({ day: 'numeric', month: 'long' }, yearOpt)); }
  } else {
    const o0 = Object.assign({ day: 'numeric', month: 'long' }, sameYear ? {} : { year: 'numeric' });
    from = P.fmtDate(d0, o0);
    if (!en && d0.getDate() === 1) from = from.replace(/^1 /, '1er ');
    to = P.fmtDate(d1, Object.assign({ day: 'numeric', month: 'long' }, sameYear ? yearOpt : { year: 'numeric' }));
  }
  return fill(P.tr('stat2_period'), { from: from, to: to });
}

// ── Données ─────────────────────────────────────────────────────
async function loadData() {
  const today = psDay(new Date());
  const [cr, ir] = await Promise.all([
    sb.from('cures').select('*').eq('user_id', userId).order('created_at', { ascending: false }),
    sb.from('injections').select('*').eq('user_id', userId).order('injected_at', { ascending: true })
  ]);
  if (cr.error) throw cr.error;
  if (ir.error) throw ir.error;
  injections = ir.data || [];
  // Seules les cures déjà commencées ont un historique ; actives (favorite en tête) puis les plus récentes
  cures = (cr.data || []).filter(c => c.start_date && psDay(c.start_date) <= today).sort((a, b) => {
    const ma = P.cure(a), mb = P.cure(b);
    const ra = (ma.state === 'active' && a.status === 'active') ? 0 : 1, rb = (mb.state === 'active' && b.status === 'active') ? 0 : 1;
    if (ra !== rb) return ra - rb;
    if (!!b.is_favorite !== !!a.is_favorite) return b.is_favorite ? 1 : -1;
    return String(b.start_date).localeCompare(String(a.start_date));
  });
  if (!cures.some(c => String(c.id) === String(selectedId))) selectedId = cures.length ? cures[0].id : null;
}

async function init() {
  const session = await P.requireSession(sb);
  if (!session) return;
  userId = session.user.id;
  const { data: profil } = await sb.from('profiles').select('*').eq('id', userId).single();
  if (profil) PS_loadLangFromProfile(sb, userId, profil.lang);
  document.documentElement.lang = P.lang();
  await loadData();
  render();
}

// ── Rendu ───────────────────────────────────────────────────────
function render() {
  const view = document.getElementById('view');
  const sub = document.getElementById('stat2Sub');
  const ids = cures.map(c => String(c.id));
  const hasHistory = injections.some(i => ids.indexOf(String(i.cure_id)) >= 0);

  if (!cures.length || !hasHistory) {
    // Maquette « empty-stats »
    sub.classList.add('hidden');
    view.innerHTML = '<section class="card">' + P.empty(P.tr('stat2_empty_title'), P.tr('stat2_empty_text'), 'chart-bar', P.tr('stat2_empty_cta'), 'cure.html') + '</section>';
    PS_applyI18n();
    return;
  }
  sub.classList.remove('hidden');

  const cure = cures.find(c => String(c.id) === String(selectedId)) || cures[0];
  const model = P.cure(cure);
  const injs = injections.filter(i => String(i.cure_id) === String(cure.id));
  const r = P.cureStats(model, injs);
  // cureStats compte les créneaux passés non renseignés dans « missed » : on les sépare
  const missedRecorded = Math.max(0, (r.missed || 0) - (r.notRecorded || 0));
  const counts = [['done', r.done || 0], ['partial', r.partial || 0], ['missed', missedRecorded], ['postponed', r.postponed || 0]];
  if (r.rest) counts.push(['rest', r.rest]);

  const today = psDay(new Date());
  const lastDay = P.addDays(model.end, -1) < today ? P.addDays(model.end, -1) : today;
  const pct = r.recordedPct || 0;
  const n = r.recorded || 0, total = r.slotsElapsed || 0, left = r.notRecorded || 0;

  const title = fill(P.tr('stat2_count'), {
    n: n, total: total,
    entries: P.tr(isOne(n) ? 'stat2_entry_one' : 'stat2_entry_other'),
    planned: P.tr(isOne(total) ? 'stat2_planned_one' : 'stat2_planned_other')
  });
  const leftText = left === 0 ? P.tr('stat2_left_zero') : fill(P.tr(isOne(left) ? 'stat2_left_one' : 'stat2_left_other'), { n: left });

  let html = '';
  if (cures.length > 1) {
    html += P.select(P.tr('stat2_cure_label'), 'stat2Cure', cures.map(c => [c.id, cureName(c)]), cure.id);
  }
  html += '<section class="card">' +
      '<div class="eyebrow">' + P.esc(periodLabel(model.start, lastDay)) + '</div>' +
      '<h2 class="stat2-count">' + P.esc(title) + '</h2>' +
      '<p class="small muted">' + P.esc(fill(P.tr('stat2_pct_text'), { pct: pct })) + '</p>' +
      P.progress(pct, P.tr('stat2_progress_label')) +
      '<div class="stack tight stat2-states">' +
        counts.map(c => '<div class="row between">' + P.status(c[0]) + '<strong class="number">' + c[1] + '</strong></div>').join('') +
      '</div>' +
      '<p class="help">' + P.esc(leftText) + '</p>' +
    '</section>' +
    '<section class="card">' +
      '<div class="row stat2-lock-title">' + P.icon('lock-closed') + '<h2 data-i18n="stat2_lock_title">Votre historique détaillé</h2></div>' +
      '<p class="small muted stat2-lock" data-i18n="stat2_lock_text">Comparez les périodes et exportez vos enregistrements avec Premium.</p>' +
      '<a class="btn secondary full" href="premium.html" data-i18n="stat2_premium">Découvrir Premium</a>' +
    '</section>' +
    '<a class="btn ghost full" href="cure.html" data-i18n="stat2_calendar">Voir le calendrier</a>';
  view.innerHTML = html;

  const sel = document.getElementById('stat2Cure');
  if (sel) sel.addEventListener('change', () => {
    selectedId = sel.value;
    try { localStorage.setItem('ps_stat2_cure', String(selectedId)); } catch (e) {}
    render();
    const again = document.getElementById('stat2Cure'); if (again) again.focus();
  });
  PS_applyI18n();
}

init().catch(e => { console.error(e); document.getElementById('view').innerHTML = P.errorState(init); });
</script>
</body>
</html>
