<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Nouveau mot de passe — PeptideScanner</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F4F7FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1424" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PeptideScanner">
<script>try{var _pst=localStorage.getItem('ps_theme');if(_pst==='light'||_pst==='dark')document.documentElement.dataset.theme=_pst}catch(e){}</script>
<link rel="stylesheet" href="/peptidescanner.css">
<script src="/lang.js"></script>
<script src="/assets/assets-bundle.js"></script>
<script src="/ps-app.js"></script>
<!--
  Refonte « Clarté » (15/10/2026) : même style que l'écran de connexion (maquettes login / forgot du kit).
  Logique Supabase inchangée : le lien « Mot de passe oublié » de login.html renvoie ici
  (redirectTo = origine + /reset-password.html). Supabase lit le jeton de récupération dans l'adresse,
  ouvre une session temporaire, puis on enregistre le nouveau mot de passe avec auth.updateUser().
  Côté Supabase, l'adresse doit figurer dans Authentication > URL Configuration > Redirect URLs.
-->
<style>
  .lang-switch{flex:0 0 auto;padding:3px;gap:3px;flex-wrap:nowrap}
  .lang-switch button{flex:0 0 auto;min-width:44px;min-height:44px;padding:6px 10px;font-size:var(--text-sm)}
  .field-error[hidden]{display:none}
  #msgBox:empty{display:none}
</style>
</head>
<body data-no-profile="1">
<a class="sr-only" href="#main" data-i18n="auth2_skip">Aller au contenu</a>
<div class="page">
  <header id="psHeader"></header>
  <main id="main" class="content no-tabs" tabindex="-1">
    <div class="page-intro">
      <h1 data-i18n="auth2_reset_title">Nouveau mot de passe</h1>
      <p class="muted small" data-i18n="auth2_reset_sub">Choisissez un nouveau mot de passe pour votre compte.</p>
    </div>
    <section class="card">
      <form id="resetForm" class="stack" novalidate>
        <div id="msgBox" aria-live="polite"></div>
        <div class="field">
          <label class="label" for="pw1" data-i18n="auth2_reset_new">Nouveau mot de passe</label>
          <div class="input-wrap"><input class="input" id="pw1" type="password" autocomplete="new-password" minlength="6" aria-describedby="pw1-help pw1-err"></div>
          <p class="help" id="pw1-help" data-i18n="auth2_pw_help">6 caractères minimum.</p>
          <p class="error-text field-error" id="pw1-err" hidden></p>
        </div>
        <div class="field">
          <label class="label" for="pw2" data-i18n="auth2_reset_confirm">Confirmez le mot de passe</label>
          <div class="input-wrap"><input class="input" id="pw2" type="password" autocomplete="new-password" minlength="6" aria-describedby="pw2-err"></div>
          <p class="error-text field-error" id="pw2-err" hidden></p>
        </div>
        <button class="btn full" id="submitBtn" type="submit" data-i18n="auth2_reset_submit">Enregistrer</button>
      </form>
    </section>
    <a class="btn ghost full" href="/login.html" data-i18n="auth2_back_login">Retour à la connexion</a>
  </main>
</div>

<script src="/vendor/supabase-2.117.3.umd.js"></script>
<script>
const SUPABASE_URL      = 'https://dkwztwlkjewdzfichkgk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrd3p0d2xramV3ZHpmaWNoa2drIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MjYwOTAsImV4cCI6MjA5NzQwMjA5MH0.iT7ylcNvPCf2jMUYfJlsDJcoGjPolphQWONFusAAlAk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const P = window.PS;
const PW_MIN = 6;
const $ = function (id) { return document.getElementById(id); };

PS_initShell();
function renderLangSwitch() {
  const head = $('psHeader'); if (!head) return;
  let box = head.querySelector('.lang-switch');
  if (!box) { box = document.createElement('div'); box.className = 'segmented lang-switch'; box.setAttribute('role', 'group'); head.appendChild(box); }
  box.setAttribute('aria-label', t('auth2_lang'));
  const cur = PS_getLang();
  box.innerHTML = ['fr', 'en'].map(function (l) {
    return '<button type="button" lang="' + l + '" data-lang="' + l + '" aria-pressed="' + (cur === l) + '" aria-label="' + (l === 'fr' ? 'Français' : 'English') + '">' + l.toUpperCase() + '</button>';
  }).join('');
  box.querySelectorAll('button').forEach(function (b) {
    b.onclick = function () { if (b.dataset.lang !== PS_getLang()) PS_setLang(b.dataset.lang); };
  });
}
document.documentElement.lang = PS_getLang();
renderLangSwitch();
PS_applyI18n();
document.title = t('auth2_doc_reset');

function showMsg(key, kind) { $('msgBox').innerHTML = key ? P.notice(t(key), kind) : ''; }
function fieldError(id, key) {
  const input = $(id), err = $(id + '-err');
  if (key) { err.textContent = t(key); err.hidden = false; input.setAttribute('aria-invalid', 'true'); }
  else { err.textContent = ''; err.hidden = true; input.removeAttribute('aria-invalid'); }
}

// Session de récupération : ouverte automatiquement par Supabase à partir du lien reçu par e-mail.
let recoveryReady = false;
sb.auth.onAuthStateChange(function (event, session) {
  if (event === 'PASSWORD_RECOVERY' || (session && event === 'SIGNED_IN')) { recoveryReady = true; if ($('msgBox').dataset.invalid) { showMsg(null); delete $('msgBox').dataset.invalid; } }
});
sb.auth.getSession().then(function (res) {
  if (res && res.data && res.data.session) recoveryReady = true;
  setTimeout(function () {
    if (!recoveryReady) { showMsg('auth2_reset_invalid', 'error'); $('msgBox').dataset.invalid = '1'; }
  }, 1500);
});

$('resetForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  fieldError('pw1', null); fieldError('pw2', null);
  if (!$('msgBox').dataset.invalid) showMsg(null);
  const pw1 = $('pw1').value, pw2 = $('pw2').value;
  if (pw1.length < PW_MIN) { fieldError('pw1', pw1 ? 'auth2_err_pw_short' : 'auth2_err_pw_empty'); $('pw1').focus(); return; }
  if (pw1 !== pw2) { fieldError('pw2', 'auth2_err_pw_mismatch'); $('pw2').focus(); return; }
  const btn = $('submitBtn');
  btn.disabled = true; btn.setAttribute('aria-busy', 'true'); btn.textContent = t('auth2_reset_busy');
  let res;
  try { res = await sb.auth.updateUser({ password: pw1 }); } catch (err) { res = { error: err }; }
  btn.removeAttribute('aria-busy'); btn.textContent = t('auth2_reset_submit');
  if (res.error) { btn.disabled = false; delete $('msgBox').dataset.invalid; showMsg('auth2_reset_error', 'error'); return; }
  delete $('msgBox').dataset.invalid;
  showMsg('auth2_reset_done', 'success');
  setTimeout(function () { location.href = '/dashboard.html'; }, 1800);
});
</script>
</body>
</html>
